# =============================================================================
# LiveKit CLI config: DEFAULT = ferni-dev (dev-8sm1ba0z)
# =============================================================================
#
# A bare `lk agent deploy` from the repo root targets this file. It points at
# the DEV project on purpose, so a deploy without flags cannot reach
# production. The production agent record lives in livekit.prod.toml and must
# be selected explicitly with `--config livekit.prod.toml`.
#
# Deploying the voice agent to LiveKit Cloud (measured on ferni-dev, 2026-09-26):
#   - lk builds ./Dockerfile; copy docker/Dockerfile.agent there first.
#   - set secret PORT=8081. The platform health-checks 8081, and the worker
#     defaults to 8080 (the GCE blue port). Without it, the instance keeps
#     restarting and never settles at Running.
#   - NODE_ENV=production requires persistent memory (Firestore). LiveKit
#     Cloud has no GCP identity, so it needs a mounted service-account key
#     (--secret-mount).
#   - instances are 2 CPU / 4 GB; `--region` is required non-interactively.
# =============================================================================

[project]
  subdomain = "dev-8sm1ba0z"

[agent]
  id = "CA_siTDMHEba4Fg"
