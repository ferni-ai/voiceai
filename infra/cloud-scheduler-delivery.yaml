# Delivery jobs the voice process used to run in-memory.
# startup() leaves them off (REMINDER_SCHEDULER_IN_PROCESS / IN_PROCESS_SCHEDULERS).
# Deploy with: ferni ops memory:deploy-scheduler (apps/cli/src/commands/ops/delivery-jobs.ts
# is the source it deploys; keep this file in step). Every job needs the
# oidcToken block: /api/jobs/* refuses (401) a request without a scheduler
# OIDC token whose audience is the job URL (scheduler-auth.ts).
#
jobs:
  - name: deliver-reminders
    description: Deliver due reminders from Firestore
    schedule: "* * * * *"
    timeZone: America/Los_Angeles
    httpTarget:
      uri: https://app.ferni.ai/api/jobs/deliver-reminders
      httpMethod: POST
      headers:
        Content-Type: application/json
        X-CloudScheduler: "true"
      oidcToken:
        serviceAccountEmail: scheduler-invoker@johnb-2025.iam.gserviceaccount.com
        audience: https://app.ferni.ai/api/jobs/deliver-reminders
    retryConfig:
      retryCount: 2
      minBackoffDuration: 15s
      maxBackoffDuration: 60s

  - name: deliver-scheduled-actions
    description: Run due scheduled actions and workflow reminders
    schedule: "* * * * *"
    timeZone: America/Los_Angeles
    httpTarget:
      uri: https://app.ferni.ai/api/jobs/deliver-scheduled-actions
      httpMethod: POST
      headers:
        Content-Type: application/json
        X-CloudScheduler: "true"
      oidcToken:
        serviceAccountEmail: scheduler-invoker@johnb-2025.iam.gserviceaccount.com
        audience: https://app.ferni.ai/api/jobs/deliver-scheduled-actions
    retryConfig:
      retryCount: 2
      minBackoffDuration: 15s
      maxBackoffDuration: 60s

  - name: execute-scheduled-outreach
    description: Send scheduled outreach that is due
    schedule: "* * * * *"
    timeZone: America/Los_Angeles
    httpTarget:
      uri: https://app.ferni.ai/api/jobs/execute-scheduled-outreach
      httpMethod: POST
      headers:
        Content-Type: application/json
        X-CloudScheduler: "true"
      oidcToken:
        serviceAccountEmail: scheduler-invoker@johnb-2025.iam.gserviceaccount.com
        audience: https://app.ferni.ai/api/jobs/execute-scheduled-outreach
    retryConfig:
      retryCount: 2
      minBackoffDuration: 15s
      maxBackoffDuration: 60s

  - name: calendar-triggers
    description: Fire calendar-based coaching triggers
    schedule: "*/5 * * * *"
    timeZone: America/Los_Angeles
    httpTarget:
      uri: https://app.ferni.ai/api/jobs/calendar-triggers
      httpMethod: POST
      headers:
        Content-Type: application/json
        X-CloudScheduler: "true"
      oidcToken:
        serviceAccountEmail: scheduler-invoker@johnb-2025.iam.gserviceaccount.com
        audience: https://app.ferni.ai/api/jobs/calendar-triggers
    retryConfig:
      retryCount: 1
      minBackoffDuration: 30s
      maxBackoffDuration: 120s

  # As created in prod on 2026-10-18 (gcloud scheduler jobs describe follow-through): no
  # Content-Type or X-CloudScheduler header, 120s deadline.
  - name: follow-through
    description: Follow-up texts (follow-up-texts.ts via /api/jobs/follow-through); sends only to people with FOLLOW_THROUGH_TEXTS on
    schedule: "*/5 * * * *"
    timeZone: America/Los_Angeles
    attemptDeadline: 120s
    httpTarget:
      uri: https://app.ferni.ai/api/jobs/follow-through
      httpMethod: POST
      oidcToken:
        serviceAccountEmail: scheduler-invoker@johnb-2025.iam.gserviceaccount.com
        audience: https://app.ferni.ai/api/jobs/follow-through
    retryConfig:
      retryCount: 0

  - name: pondering
    description: Ponder the callers whose night slot has come (PONDERING, ponder-job.ts)
    schedule: "40 * * * *"
    timeZone: Etc/UTC
    httpTarget:
      uri: https://app.ferni.ai/api/jobs/pondering
      httpMethod: POST
      headers:
        Content-Type: application/json
        X-CloudScheduler: "true"
      oidcToken:
        serviceAccountEmail: scheduler-invoker@johnb-2025.iam.gserviceaccount.com
        audience: https://app.ferni.ai/api/jobs/pondering
    retryConfig:
      retryCount: 0

  - name: retry-pending-revocations
    description: Retry Google OAuth revokes queued by account erasure
    schedule: "*/15 * * * *"
    timeZone: Etc/UTC
    httpTarget:
      uri: https://app.ferni.ai/api/jobs/retry-pending-revocations
      httpMethod: POST
      headers:
        Content-Type: application/json
        X-CloudScheduler: "true"
      oidcToken:
        serviceAccountEmail: scheduler-invoker@johnb-2025.iam.gserviceaccount.com
        audience: https://app.ferni.ai/api/jobs/retry-pending-revocations
    retryConfig:
      retryCount: 0

  - name: held-scrub-sweep
    description: Retry MINOR_CARE held-window scrubs that failed (off unless HELD_SCRUB_SWEEP)
    schedule: "17 * * * *"
    timeZone: Etc/UTC
    httpTarget:
      uri: https://app.ferni.ai/api/jobs/held-scrub-sweep
      httpMethod: POST
      headers:
        Content-Type: application/json
        X-CloudScheduler: "true"
      oidcToken:
        serviceAccountEmail: scheduler-invoker@johnb-2025.iam.gserviceaccount.com
        audience: https://app.ferni.ai/api/jobs/held-scrub-sweep
    retryConfig:
      retryCount: 0
