# Env of the production web server (Cloud Run john-bogle-ui), passed by
# .github/workflows/deploy-production.yml as --env-vars-file. Keep sorted, one
# per line, every value double-quoted (unquoted on/off parse as YAML booleans).
#
# The file REPLACES the service's env on every deploy, so a flag set by hand on
# Cloud Run is gone after the next main push: turn a web-server flag on here
# (and in apps/cli deploy.ts), in a reviewed PR. Per-deploy values (BUILD_SHA,
# the project ids) and values from GitHub expressions are appended by the
# workflow step, one printf per key.
#
# This repo is public: no secret values here. Secrets are mounted from Secret
# Manager through secrets.txt next to this file.
ALLOWED_ORIGINS: "https://app.ferni.ai,https://ferni.ai,https://ferni-prod.web.app"
CALL_HOURS_GUARD: "on"
COHORT_FLAGS: "on"
DEPLOY_ENV: "production"
FAMILY_CHECKIN_STOP: "on"
FOLLOW_THROUGH_JOB: "on"
JOURNAL_ONE_STORE: "on"
JOURNAL_TRANSCRIBE_VERTEX: "on"
MEMORY_VIEW: "on"
MORNING_BRIEF: "on"
NODE_ENV: "production"
ON_BEHALF_DNC_CHECK: "on"
PONDERING: "on"
PROACTIVE_CHANNELS: "on"
PROMISES_PANEL: "off"
SIP_TRUNK_ID: "ST_AEE6NnKE84XP"
SMS_CRISIS_SCREEN: "shadow"
TEAM_BY_NEED: "on"
