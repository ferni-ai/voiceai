name: Signed-in E2E

# Clicks through the app as a signed-in user, on desktop and a phone viewport,
# against a local stack: Firebase Auth + Firestore emulators, the API server and
# the Vite dev server. Specs: e2e/signed-in/. Config: playwright.signed-in.config.ts.
#
# Nothing here touches a real project: the emulators run as demo-ferni, and the
# LiveKit values are placeholders (voice calls aren't exercised).

on:
  pull_request:
    paths:
      - 'apps/web/**'
      # What the walk exercises: the API server and the layers under it. Voice-only
      # code (agents, speech, conversation, tools, personas) is still walked on every
      # push to main, without paths.
      - 'src/servers/**'
      - 'src/api/**'
      - 'src/services/**'
      - 'src/memory/**'
      - 'src/config/**'
      - 'src/types/**'
      - 'src/utils/**'
      - 'e2e/signed-in/**'
      - 'playwright.signed-in.config.ts'
      - 'firebase.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/signed-in-e2e.yml'
  push:
    branches: [main]
  # Nightly on main, whatever OPTIONAL_CI says (#1366); PR and push runs still follow it
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# One run per PR: a new push cancels the PR's running one. Every other run (push,
# merge queue, schedule) gets its own group and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FIREBASE_TOOLS_VERSION: '15.10.0'
  PROJECT_ID: demo-ferni
  FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
  FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
  E2E_BASE_URL: http://localhost:3004

jobs:
  signed-in-e2e:
    if: ${{ vars.OPTIONAL_CI != 'off' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: Signed-in walk (desktop + phone)
    # optional: hosted only; re-enable VM via CI_RUNNER in Nov if wanted
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 206 tests on one worker (shared emulator) now take ~30 min

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          frozen-lockfile: 'true'

      # The Firebase emulators run on the JVM
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Playwright Chromium
        # System deps need sudo; the self-hosted runner has them preinstalled.
        run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Start Firebase emulators
        run: |
          mkdir -p e2e-logs
          nohup npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:start \
            --only auth,firestore:ferni-dev --project "$PROJECT_ID" > e2e-logs/emulators.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080 >/dev/null && curl -sf http://127.0.0.1:9099 >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Firebase emulators did not start"; tail -50 e2e-logs/emulators.log; exit 1

      - name: Start API server
        env:
          PORT: '3002'
          NODE_ENV: development
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GCLOUD_PROJECT: ${{ env.PROJECT_ID }}
          FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
          # Placeholders: the walk never starts a voice session
          LIVEKIT_URL: wss://livekit.localhost.invalid
          LIVEKIT_API_KEY: ci-placeholder
          LIVEKIT_API_SECRET: ci-placeholder-not-a-secret
          JOURNAL_ONE_STORE: 'on' # as on the prod web server: the Chronicle can edit and delete
        # With prod's on/off flags (deploy/ui-server/env.yaml): MEMORY_VIEW=on answers What Ferni Knows
        run: |
          # No pipe: a failed read must fail the step (the default shell has no pipefail)
          node scripts/ci/prod-web-flags.mjs server > e2e-logs/server-flags.env
          cat e2e-logs/server-flags.env
          set -a; . e2e-logs/server-flags.env; set +a
          nohup npx tsx src/servers/api/index.ts > e2e-logs/api.log 2>&1 &
          for _ in $(seq 1 90); do
            # Any HTTP answer means it is listening (status itself needs no auth)
            curl -s -o /dev/null http://localhost:3002/api/ecobee/status && exit 0
            sleep 2
          done
          echo "::error::API server did not start"; tail -80 e2e-logs/api.log; exit 1

      # Built with prod's VITE_* flags (deploy-firebase.yml, resolved from the repo variables),
      # so the walk sees app.ferni.ai's menu: What Ferni Knows, Chip In, no Your Contribution.
      - name: Start web app (emulator sign-in, prod flags)
        working-directory: apps/web
        # Only the variables deploy-firebase.yml builds with (prod-web-flags.mjs checks the
        # list both ways); never toJSON(vars), since a step's env is printed in a public log.
        # The Venmo handle never enters the job: only whether it is set; the walk uses a placeholder.
        env:
          PROD_VAR_VITE_VENMO_CHIP_IN: ${{ vars.VITE_VENMO_CHIP_IN }}
          PROD_VAR_VITE_VENMO_HANDLE_SET: ${{ vars.VITE_VENMO_HANDLE != '' }}
          PROD_VAR_VITE_CAPTIONS_V2: ${{ vars.VITE_CAPTIONS_V2 }}
          PROD_VAR_VITE_CAPTIONS_BREATH: ${{ vars.VITE_CAPTIONS_BREATH }}
          PROD_VAR_VITE_CAPTIONS_HEARD: ${{ vars.VITE_CAPTIONS_HEARD }}
          PROD_VAR_VITE_MEMORY_VIEW: ${{ vars.VITE_MEMORY_VIEW }}
          PROD_VAR_VITE_PROMISES_PANEL: ${{ vars.VITE_PROMISES_PANEL }}
          PROD_VAR_VITE_TOAST_REGION: ${{ vars.VITE_TOAST_REGION }}
          PROD_VAR_VITE_TRY_FIRST: ${{ vars.VITE_TRY_FIRST }}
          PROD_VAR_VITE_APPLE_WEB_SIGNIN: ${{ vars.VITE_APPLE_WEB_SIGNIN }}
          PROD_VAR_VITE_CALL_WRAP_UP: ${{ vars.VITE_CALL_WRAP_UP }}
          PROD_VAR_VITE_NATURAL_BLINK: ${{ vars.VITE_NATURAL_BLINK }}
          PROD_VAR_VITE_LID_BLEND: ${{ vars.VITE_LID_BLEND }}
          PROD_VAR_VITE_GAZE: ${{ vars.VITE_GAZE }}
          PROD_VAR_VITE_LISTEN_NODS: ${{ vars.VITE_LISTEN_NODS }}
          PROD_VAR_VITE_SPRING_BODY: ${{ vars.VITE_SPRING_BODY }}
          PROD_VAR_VITE_WEIGHTED_EASING: ${{ vars.VITE_WEIGHTED_EASING }}
          PROD_VAR_VITE_SPEECH_BEATS: ${{ vars.VITE_SPEECH_BEATS }}
          PROD_VAR_VITE_THINKING_GLANCE: ${{ vars.VITE_THINKING_GLANCE }}
          PROD_VAR_VITE_TURN_GESTURES: ${{ vars.VITE_TURN_GESTURES }}
          PROD_VAR_VITE_FACE_ENGINE: ${{ vars.VITE_FACE_ENGINE }}
          PROD_VAR_VITE_EXPRESSION_ARBITER: ${{ vars.VITE_EXPRESSION_ARBITER }}
          PROD_VAR_VITE_REPLY_TONE: ${{ vars.VITE_REPLY_TONE }}
          PROD_VAR_VITE_SOUND_DIRECTOR: ${{ vars.VITE_SOUND_DIRECTOR }}
          PROD_VAR_VITE_IDLE_LIFE: ${{ vars.VITE_IDLE_LIFE }}
        run: |
          cat > .env.development.local <<'EOF'
          VITE_USE_FIREBASE_EMULATORS=true
          VITE_FIREBASE_API_KEY=emulator-only-not-a-real-key
          VITE_FIREBASE_AUTH_DOMAIN=demo-ferni.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=demo-ferni
          VITE_FIREBASE_STORAGE_BUCKET=demo-ferni.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=123456789
          VITE_FIREBASE_APP_ID=1:123456789:web:abcdef
          EOF
          node ../../scripts/ci/prod-web-flags.mjs web >> .env.development.local
          node ../../scripts/ci/prod-web-flags.mjs diff >> "$GITHUB_STEP_SUMMARY"
          nohup pnpm exec vite --port 3004 --strictPort > ../../e2e-logs/web.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://localhost:3004 >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Web app did not start"; tail -50 ../../e2e-logs/web.log; exit 1

      - name: Run the signed-in walk
        run: pnpm exec playwright test -c playwright.signed-in.config.ts

      - name: Upload report, traces and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: signed-in-e2e
          path: |
            playwright-report-signed-in/
            test-results/
            e2e-logs/
          retention-days: 7
