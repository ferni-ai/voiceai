# Ferni Pub/Sub worker and outreach worker images.
#
# Every PR, and every push to main, that touches the workers builds both images
# (no push, no credentials), so a Dockerfile can't silently rot again. Both
# were npm-based against a pnpm workspace and could never build; this workflow
# also targeted a GCP project ("ferni-prod") that doesn't exist, and failed
# every run from 2026-01-10 to 2026-10-03.
#
# Deploying the Pub/Sub worker is manual (workflow_dispatch). Nothing
# subscribes to the ferni-* topics yet, and the publishers only send with
# PUBSUB_ENABLED=true, so the worker isn't on the production path.

name: Deploy Pub/Sub Worker

on:
  pull_request:
    paths:
      - 'src/services/pubsub/**'
      - 'src/workers/**'
      - 'src/memory/embeddings.ts'
      - 'src/memory/summarizer.ts'
      - 'src/intelligence/context-service.ts'
      - 'Dockerfile.worker'
      - 'docker/Dockerfile.outreach'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-worker.yml'
  push:
    branches: [main]
    paths:
      - 'src/services/pubsub/**'
      - 'src/workers/**'
      - 'src/memory/embeddings.ts'
      - 'src/memory/summarizer.ts'
      - 'src/intelligence/context-service.ts'
      - 'Dockerfile.worker'
      - 'docker/Dockerfile.outreach'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: johnb-2025
  REGION: us-central1
  SERVICE_NAME: ferni-worker
  IMAGE: gcr.io/johnb-2025/ferni-worker

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            dockerfile: Dockerfile.worker
          - name: outreach
            dockerfile: docker/Dockerfile.outreach
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker buildx build -f ${{ matrix.dockerfile }} -t ferni-${{ matrix.name }}:ci --load .
      - name: Smoke-test the worker image
        if: matrix.name == 'worker'
        # Start the container and wait for /health: proves the image's
        # dependencies resolve and the server comes up.
        run: |
          docker run -d --name worker -p 8080:8080 ferni-worker:ci
          for i in $(seq 1 60); do
            if curl -fs localhost:8080/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs worker
          exit 1

  deploy:
    name: Deploy worker to Cloud Run
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The same key every other production deploy uses (deploy-production.yml).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build -f Dockerfile.worker -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      # Private: Pub/Sub push subscriptions call it with an OIDC token.
      - name: Deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --project ${{ env.PROJECT_ID }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --concurrency 80 \
            --set-env-vars "NODE_ENV=production,PUBSUB_ENABLED=true,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" \
            --no-allow-unauthenticated \
            --quiet
