name: PR Flow

# Size, base branch, WIP and issue link (scripts/ci/pr-flow-check.sh).
# The description and the size/large-ok label change the result, so those events
# supersede the PR's run. Any other label runs the check in a group of its own, so
# it can't cancel the run of a PR opened with that label (#4198). It never skips:
# a skipped check counts as passing and would stand in for a red one.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

concurrency:
  group: pr-flow-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'size/large-ok' && github.run_id) || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-flow:
    name: PR Flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - name: Check size, base, WIP and issue link
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/pr-flow-check.sh ${{ github.event.pull_request.number }}
