name: Lighthouse CI

# Accessibility and performance audits for the ferni.ai landing site.
#
# Pull requests: build the site from the PR's commit and audit the built pages,
#   so the result reflects the change under review. Accessibility below budget
#   fails the check; the other categories warn.
# Weekly / manual: audit production.

on:
  pull_request:
    paths:
      - 'apps/website/ferni-website/**'
      - 'design-system/**'
      - '.github/workflows/lighthouse-ci.yml'
  schedule:
    # Run weekly on Sundays at 6am UTC
    - cron: '0 6 * * 0'
  workflow_dispatch: # Allow manual triggers

env:
  # Performance budgets (0-100)
  PERFORMANCE_BUDGET: 80
  ACCESSIBILITY_BUDGET: 90
  BEST_PRACTICES_BUDGET: 85
  SEO_BUDGET: 90
  # Pages audited (paths on the site)
  AUDIT_PATHS: '/ /give/ /about/'
  PRODUCTION_URL: 'https://ferni.ai'

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build the site from this commit
        if: github.event_name == 'pull_request'
        working-directory: apps/website/ferni-website
        run: |
          npm ci --no-audit --no-fund
          npm run build:prod

      - name: Install Lighthouse CI
        run: pnpm add -g @lhci/cli@0.13.x

      - name: Setup Chrome
        # Hosted images ship Chrome; the self-hosted runner does not (and has no sudo).
        if: runner.environment == 'self-hosted'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          no-sudo: true

      - name: Run Lighthouse
        env:
          LOCAL: ${{ github.event_name == 'pull_request' }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node -e '
            const local = process.env.LOCAL === "true";
            const paths = process.env.AUDIT_PATHS.split(" ");
            const collect = {
              numberOfRuns: 3,
              settings: { preset: "desktop" },
              url: paths.map((p) =>
                local ? `http://localhost${p}${p.endsWith("/") ? "index.html" : ""}` : process.env.PRODUCTION_URL + p
              ),
            };
            if (local) collect.staticDistDir = "./apps/website/ferni-website/_site";
            const config = { ci: { collect, upload: { target: "filesystem", outputDir: "./lighthouse-report" } } };
            require("fs").writeFileSync("lighthouserc.json", JSON.stringify(config, null, 2));
          '
          lhci collect --config=lighthouserc.json
          lhci upload --config=lighthouserc.json

      - name: Check scores
        id: scores
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("lighthouse-report/manifest.json", "utf8"));
            const runs = manifest.filter((r) => r.isRepresentativeRun);
            const budgets = {
              performance: +process.env.PERFORMANCE_BUDGET,
              accessibility: +process.env.ACCESSIBILITY_BUDGET,
              "best-practices": +process.env.BEST_PRACTICES_BUDGET,
              seo: +process.env.SEO_BUDGET,
            };
            const pct = (v) => Math.round(v * 100);
            const lines = ["## 🔦 Lighthouse Audit Results", "", "| Page | Performance | Accessibility | Best Practices | SEO |", "|---|---|---|---|---|"];
            const failures = [];
            const a11yIssues = [];
            for (const run of runs) {
              const page = new URL(run.url).pathname.replace(/index\.html$/, "");
              const cells = Object.keys(budgets).map((cat) => {
                const score = pct(run.summary[cat]);
                const ok = score >= budgets[cat];
                if (!ok && cat === "accessibility") failures.push(`${page} accessibility ${score} < ${budgets[cat]}`);
                return `${score} ${ok ? "✅" : cat === "accessibility" ? "❌" : "⚠️"}`;
              });
              lines.push(`| ${page} | ${cells.join(" | ")} |`);
              const lhr = JSON.parse(fs.readFileSync(run.jsonPath, "utf8"));
              for (const ref of lhr.categories.accessibility.auditRefs) {
                const audit = lhr.audits[ref.id];
                if (audit.score !== null && audit.score < 1 && !["notApplicable", "manual", "informative"].includes(audit.scoreDisplayMode)) {
                  a11yIssues.push(`- \`${page}\` ${audit.id}: ${audit.title} (${audit.details?.items?.length ?? 0})`);
                }
              }
            }
            const source = process.env.GITHUB_EVENT_NAME === "pull_request" ? "this PR'"'"'s build" : process.env.PRODUCTION_URL;
            lines.push("", `Budgets: performance ${budgets.performance}, accessibility ${budgets.accessibility} (blocking), best practices ${budgets["best-practices"]}, SEO ${budgets.seo}. Audited: ${source}.`);
            if (a11yIssues.length) lines.push("", "**Accessibility audits not passing:**", ...a11yIssues);
            const body = lines.join("\n");
            fs.writeFileSync("lighthouse-summary.md", body + "\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body + "\n");
            if (failures.length) {
              console.error(failures.join("\n"));
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "failed=true\n");
            }
          '

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('lighthouse-summary.md') != ''
        # Advisory: a comment that can't be posted (fork PRs get a read-only token) must not fail the job
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lighthouse-ci -->';
            const body = `${marker}\n${fs.readFileSync('lighthouse-summary.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

      - name: Fail on accessibility below budget
        if: steps.scores.outputs.failed == 'true'
        run: |
          echo "❌ Accessibility is below budget (${{ env.ACCESSIBILITY_BUDGET }}). See the summary for the failing audits."
          exit 1

  axe-audit:
    name: Axe Accessibility Audit
    # Production monitoring. On PRs, Lighthouse's accessibility category (which
    # runs axe-core's rules) audits the PR's own build.
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install axe-core/cli
        run: pnpm add -g @axe-core/cli

      - name: Run axe accessibility scan
        id: axe
        run: |
          URLS=$(for p in $AUDIT_PATHS; do printf '%s%s,' "$PRODUCTION_URL" "$p"; done)
          axe "${URLS%,}" --save axe-results.json --tags wcag2a,wcag2aa,wcag21aa

          # axe --save writes one result per page
          VIOLATIONS=$(jq '[.[].violations[]] | length' axe-results.json)
          CRITICAL=$(jq '[.[].violations[] | select(.impact == "critical")] | length' axe-results.json)
          SERIOUS=$(jq '[.[].violations[] | select(.impact == "serious")] | length' axe-results.json)

          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "serious=$SERIOUS" >> $GITHUB_OUTPUT

          {
            echo "## 🔍 Axe Accessibility Scan ($PRODUCTION_URL)"
            echo ""
            echo "| Impact | Count |"
            echo "|--------|-------|"
            echo "| Critical | $CRITICAL |"
            echo "| Serious | $SERIOUS |"
            echo "| Total | $VIOLATIONS |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail on critical issues
        if: steps.axe.outputs.critical != '0'
        run: |
          echo "❌ Found ${{ steps.axe.outputs.critical }} critical accessibility violations"
          jq '.[] | .url as $u | .violations[] | select(.impact == "critical") | {url: $u, id, description, nodes: [.nodes[].html]}' axe-results.json
          exit 1
