name: Brand Compliance

on:
  pull_request:
    paths:
      - 'apps/cli/src/commands/quality/**'
      - 'apps/web/src/**'
      - 'src/**'
      - 'design-system/**'
      - 'brand/**'
  push:
    branches:
      - main
    paths:
      - 'apps/cli/src/commands/quality/**'
      - 'apps/web/src/**'
      - 'src/**'
      - 'design-system/**'
      - 'brand/**'

jobs:
  lint-brand:
    name: Brand Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'
        
      # The ratchet (docs/DEFINITION-OF-CLEAN.md): fails only when this change
      # makes things worse than the committed baseline: a file over 500 lines
      # grows or a new one starts over it, any critical brand copy, or more
      # brand-copy warnings / brand-lint errors. The old step ran the full
      # linter (thousands of pre-existing errors) and tried to post it all as a
      # PR comment, which the workflow token can't do: red on every PR.
      - name: Quality ratchet
        run: pnpm tsx apps/cli/src/commands/quality/ratchet.ts

  lint-tokens:
    name: Token Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Build design tokens
        run: |
          cd design-system
          pnpm install --no-frozen-lockfile
          pnpm build
          
      - name: Verify token outputs
        run: |
          # Check that all token files were generated
          test -f design-system/dist/tokens.css || (echo "Missing tokens.css" && exit 1)
          test -f design-system/dist/tokens.ts || (echo "Missing tokens.ts" && exit 1)
          echo "✅ Token files generated successfully"

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Install Playwright
        run: pnpm playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd apps/web
          pnpm install --no-frozen-lockfile
          pnpm build
          
      - name: Run visual regression tests
        run: |
          cd apps/web
          pnpm test:visual || true
        continue-on-error: true
        
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diff
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Install Playwright
        run: pnpm playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd apps/web
          pnpm install --no-frozen-lockfile
          pnpm build
          
      - name: Run accessibility tests
        run: |
          cd apps/web
          pnpm test:a11y || true
        continue-on-error: true
        
      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: apps/web/a11y-report/
          retention-days: 7

