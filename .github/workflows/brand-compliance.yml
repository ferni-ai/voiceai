name: Brand Compliance

on:
  pull_request:
    paths:
      - 'apps/cli/src/commands/quality/**'
      - 'apps/web/src/**'
      - 'src/**'
      - 'design-system/**'
      - 'brand/**'
      - '.github/workflows/brand-compliance.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/cli/src/commands/quality/**'
      - 'apps/web/src/**'
      - 'src/**'
      - 'design-system/**'
      - 'brand/**'

jobs:
  lint-brand:
    name: Brand Compliance Check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # The report is posted as a PR comment; the default token is read-only.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Run brand compliance linter
        id: brand-lint
        # Steps without an explicit shell run under bash -e, without pipefail, so
        # the pipe through tee would otherwise hide the linter's exit code.
        run: |
          set -o pipefail
          pnpm tsx apps/cli/src/commands/quality/lint-brand.ts 2>&1 | tee brand-lint.txt
        continue-on-error: true

      - name: Upload full report
        if: steps.brand-lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: brand-compliance-report
          path: brand-lint.txt
          retention-days: 7

      # One comment per PR, updated in place. The full report runs to megabytes
      # (GitHub caps a comment at 65,536 characters), so the comment carries the
      # summary and the first errors, and links to the artifact for the rest.
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.brand-lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- brand-compliance-report -->';
            const raw = fs.readFileSync('brand-lint.txt', 'utf8');

            const summaryAt = raw.lastIndexOf('📊 Summary:');
            const summary = summaryAt >= 0 ? raw.slice(summaryAt).trim() : '';
            const errorsAt = raw.indexOf('❌ ERRORS:');
            const warningsAt = raw.indexOf('⚠️ WARNINGS:');
            const errorsEnd = warningsAt >= 0 ? warningsAt : summaryAt >= 0 ? summaryAt : raw.length;
            let errors = errorsAt >= 0 ? raw.slice(errorsAt, errorsEnd).trim() : '';

            const MAX_ERRORS_CHARS = 50000;
            let truncated = false;
            if (errors.length > MAX_ERRORS_CHARS) {
              const cut = errors.lastIndexOf('\n\n', MAX_ERRORS_CHARS);
              errors = errors.slice(0, cut > 0 ? cut : MAX_ERRORS_CHARS);
              truncated = true;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## 🎨 Brand Compliance Check',
              '',
              'Brand guideline violations were found. Most are pre-existing and tracked for cleanup; this check does not block merging.',
              '',
              '```',
              summary,
              '```',
              '',
              '<details><summary>Errors' + (truncated ? ' (first part only)' : '') + '</summary>',
              '',
              '```',
              errors,
              '```',
              '',
              '</details>',
              '',
              `Full report, including warnings: the \`brand-compliance-report\` artifact on [this run](${runUrl}).`,
              'See `design-system/docs/brand/FERNI-BRAND-GUIDELINES.md` for the rules.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Warn if brand lint failed
        if: steps.brand-lint.outcome == 'failure'
        run: |
          echo "::warning::Brand compliance violations found. See PR comment for details."
          echo "These are pre-existing issues tracked for cleanup."

      # Reported above for information; the ratchet below is what can fail the job.
      # The ratchet (docs/DEFINITION-OF-CLEAN.md): fails only when this change
      # makes things worse than the committed baseline: a file over 500 lines
      # grows or a new one starts over it, any critical brand copy, or more
      # brand-copy warnings / brand-lint errors. The old step ran the full
      # linter (thousands of pre-existing errors) and tried to post it all as a
      # PR comment, which the workflow token can't do: red on every PR.
      - name: Quality ratchet
        run: pnpm tsx apps/cli/src/commands/quality/ratchet.ts

  lint-tokens:
    name: Token Validation
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Build design tokens
        run: |
          cd design-system
          pnpm install --no-frozen-lockfile
          pnpm build
          
      - name: Verify token outputs
        run: |
          # Check that all token files were generated
          test -f design-system/dist/tokens.css || (echo "Missing tokens.css" && exit 1)
          test -f design-system/dist/tokens.ts || (echo "Missing tokens.ts" && exit 1)
          echo "✅ Token files generated successfully"

  visual-regression:
    name: Visual Regression
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Install Playwright
        # System deps need sudo; the self-hosted runner has them preinstalled.
        run: pnpm playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Build frontend
        run: |
          cd apps/web
          pnpm install --no-frozen-lockfile
          pnpm build
          
      - name: Run visual regression tests
        run: |
          cd apps/web
          pnpm test:visual || true
        continue-on-error: true
        
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diff
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  accessibility:
    name: Accessibility Audit
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Install Playwright
        # System deps need sudo; the self-hosted runner has them preinstalled.
        run: pnpm playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Build frontend
        run: |
          cd apps/web
          pnpm install --no-frozen-lockfile
          pnpm build
          
      - name: Run accessibility tests
        run: |
          cd apps/web
          pnpm test:a11y || true
        continue-on-error: true
        
      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: apps/web/a11y-report/
          retention-days: 7

