# Voice AI - Build Native Apps
#
# Builds the iOS app. The Electron desktop app and the native Android app were
# removed: Android ships as a Trusted Web Activity built by android-twa.yml.
# The iOS build and unit tests run on every pull request and push to main that
# touches the iPhone app or this workflow. Merge-queue
# groups skip them: no required check comes from here, and a macOS job per group
# held queue runners (merge-queue-jobs.test.ts). Tags (v*) and manual dispatch
# also build an unsigned iOS archive.

name: Build Native Apps

on:
  push:
    tags:
      - 'v*'
    # main: only when the iPhone app or this workflow changed
    # (GitHub does not apply path filters to tag pushes).
    branches: [main]
    paths:
      - 'apps/ios-native/**'
      - '.github/workflows/build-apps.yml'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mobile
          - ios

# A newer push to a PR cancels that PR's older run. Merge-queue, tag and manual
# runs each get their own group and are never cancelled: cancelling a queue run
# for a re-request on its ref drops the entry (see ci.yml's header).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # iOS (Native SwiftUI): build and unit tests on a simulator, archive on tags
  # ============================================================================
  # Pull requests run the iOS job only when they touch the iPhone app or this
  # workflow; merge-queue groups never run it (a skipped job
  # still reports its check). Pushes to main are path-filtered in `on:` above,
  # and a failed push run opens a main-red issue (nightly-health.yml). ci.yml's
  # Node jobs keep excluding apps/ios-native: they cannot see a Swift change.
  ios-changes:
    name: Did the iOS app change?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.ios.outputs.matched }}
    steps:
      - uses: actions/checkout@v7

      - id: ios
        uses: ./.github/actions/pr-changes
        with:
          include: '^(apps/ios-native/|\.github/workflows/build-apps\.yml$)'

  build-ios:
    name: iOS build and test
    needs: ios-changes
    if: >
      !cancelled() && github.event_name != 'merge_group' && (
        needs.ios-changes.outputs.ios == 'true' ||
        github.event_name == 'push' ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == 'mobile' ||
        github.event.inputs.platforms == 'ios'
      )
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SPM_DIR: ${{ github.workspace }}/.spm

    steps:
      - uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ env.SPM_DIR }}
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/ios-native/Ferni.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        working-directory: apps/ios-native
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Ferni.xcodeproj \
            -scheme Ferni \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          version = lambda r: [int(x) for x in r.split(".iOS-")[1].split("-")]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Build and run unit tests (simulator, unsigned)
        working-directory: apps/ios-native
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ferni.xcodeproj \
            -scheme Ferni \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -resultBundlePath "$RUNNER_TEMP/FerniTests.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/FerniTests.xcresult
          retention-days: 14

      # Tags and manual runs also check that a Release archive builds. It is
      # unsigned: signing and upload stay manual in Xcode.
      - name: Build iOS archive (unsigned)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: apps/ios-native
        run: |
          xcodebuild -project Ferni.xcodeproj \
            -scheme Ferni \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ferni.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS archive
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/Ferni.xcarchive
          retention-days: 30
