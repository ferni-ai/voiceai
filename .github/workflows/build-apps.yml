# Voice AI - Build Native Apps
#
# Builds the mobile apps (iOS, Android). The Electron desktop app was removed.
# The iOS build and unit tests run on every pull request, merge-queue group and
# push to main that touches the iPhone app, the shared Swift package or this
# workflow. Tags (v*) and manual dispatch also build Android and an unsigned
# iOS archive.

name: Build Native Apps

on:
  push:
    tags:
      - 'v*'
    # main: only when the iPhone app, the shared package or this workflow changed
    # (GitHub does not apply path filters to tag pushes).
    branches: [main]
    paths:
      - 'apps/ios-native/**'
      - 'apps/shared/**'
      - '.github/workflows/build-apps.yml'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mobile
          - ios
          - android

# A newer push to a PR cancels that PR's older run. Merge-queue, tag and manual
# runs each get their own group and are never cancelled: cancelling a queue run
# for a re-request on its ref drops the entry (see ci.yml's header).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # iOS (Native SwiftUI): build and unit tests on a simulator, archive on tags
  # ============================================================================
  # Pull requests and merge-queue groups run the iOS job only when they touch the
  # iPhone app, the shared Swift package or this workflow (a skipped job still
  # reports its check, so it can be a required check). Pushes to main are
  # path-filtered in `on:` above. ci.yml's
  # Node jobs keep excluding apps/ios-native: they cannot see a Swift change.
  ios-changes:
    name: Did the iOS app change?
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.ios.outputs.matched }}
    steps:
      - uses: actions/checkout@v7

      - id: ios
        uses: ./.github/actions/pr-changes
        with:
          include: '^(apps/ios-native/|apps/shared/|\.github/workflows/build-apps\.yml$)'
          merge-group: 'true'

  build-ios:
    name: iOS build and test
    needs: ios-changes
    if: >
      !cancelled() && (
        needs.ios-changes.outputs.ios == 'true' ||
        github.event_name == 'push' ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == 'mobile' ||
        github.event.inputs.platforms == 'ios'
      )
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SPM_DIR: ${{ github.workspace }}/.spm

    steps:
      - uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # FerniShared compiles a .metal shader; recent Xcode ships the Metal
      # compiler as a separate download.
      - name: Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun -sdk iphonesimulator metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ env.SPM_DIR }}
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/ios-native/FerniVoice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        working-directory: apps/ios-native
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FerniVoice.xcodeproj \
            -scheme FerniVoice \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          version = lambda r: [int(x) for x in r.split(".iOS-")[1].split("-")]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Build and run unit tests (simulator, unsigned)
        working-directory: apps/ios-native
        run: |
          set -o pipefail
          xcodebuild test \
            -project FerniVoice.xcodeproj \
            -scheme FerniVoice \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -resultBundlePath "$RUNNER_TEMP/FerniVoiceTests.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/FerniVoiceTests.xcresult
          retention-days: 14

      # Tags and manual runs also check that a Release archive builds. It is
      # unsigned: signing and upload stay manual in Xcode.
      - name: Build iOS archive (unsigned)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: apps/ios-native
        run: |
          xcodebuild -project FerniVoice.xcodeproj \
            -scheme FerniVoice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FerniVoice.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS archive
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/FerniVoice.xcarchive
          retention-days: 30

  # ============================================================================
  # ANDROID BUILD (Native Kotlin/Compose)
  # ============================================================================
  build-android:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mobile' ||
      github.event.inputs.platforms == 'android'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android-native/**/*.gradle*', 'apps/android-native/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/android-native/ferni-release.keystore

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/android-native/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../ferni-release.keystore
          EOF

      - name: Build Android APK
        run: |
          cd apps/android-native
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Android Bundle (AAB)
        run: |
          cd apps/android-native
          ./gradlew bundleRelease
        continue-on-error: true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: |
            apps/android-native/app/build/outputs/apk/release/*.apk
            apps/android-native/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # ============================================================================
  # CREATE RELEASE
  # ============================================================================
  create-release:
    needs: [build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/android-build/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

