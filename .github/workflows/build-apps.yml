# Voice AI - Build Native Apps
#
# Builds the mobile apps (iOS, Android). The Electron desktop app was removed.
# Triggered on version tags (v*) or manual dispatch. Pull requests and the merge
# queue run only the iOS build and unit tests, and only when the iPhone app
# or this workflow changed.

name: Build Native Apps

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mobile
          - ios
          - android

# Cancel in-progress runs for same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # iOS (Native SwiftUI): build and unit tests on a simulator, archive on tags
  # ============================================================================
  # Pull requests and merge-queue groups run the iOS job only when they touch the
  # iPhone app or this workflow (a skipped job still
  # reports its check, so this can be made a required check later). ci.yml's
  # Node jobs keep excluding apps/ios-native: they cannot see a Swift change.
  ios-changes:
    name: Did the iOS app change?
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.ios.outputs.matched }}
    steps:
      - uses: actions/checkout@v7

      - id: ios
        uses: ./.github/actions/pr-changes
        with:
          include: '^(apps/ios-native/|\.github/workflows/(build-apps|ios-testflight)\.yml$)'
          merge-group: 'true'

  build-ios:
    name: iOS build and test
    needs: ios-changes
    if: >
      !cancelled() && (
        needs.ios-changes.outputs.ios == 'true' ||
        github.event_name == 'push' ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == 'mobile' ||
        github.event.inputs.platforms == 'ios'
      )
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SPM_DIR: ${{ github.workspace }}/.spm

    steps:
      - uses: actions/checkout@v7

      # The one Xcode for iOS builds (apps/ios-native/.xcode-version), shared with
      # the TestFlight lane; fails loudly if the image lacks it.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat apps/ios-native/.xcode-version).app" || { ls -d /Applications/Xcode*.app; exit 1; }
          xcodebuild -version

      - name: Xcode pin
        run: apps/ios-native/scripts/check-xcode-pin.sh

      # No timers or delayed dispatch in the avatar and call (one clock, one state machine).
      - name: Motion rules
        working-directory: apps/ios-native
        run: ./scripts/check-motion-rules.sh

      # Notes from Ferni ship in Release: FERNI_PUSH and the APNs entitlements (IB1).
      - name: Push build
        working-directory: apps/ios-native
        run: ./scripts/check-push-build.sh

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ env.SPM_DIR }}
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/ios-native/Ferni.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        working-directory: apps/ios-native
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Ferni.xcodeproj \
            -scheme Ferni \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          version = lambda r: [int(x) for x in r.split(".iOS-")[1].split("-")]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Build and run unit tests (simulator, unsigned)
        working-directory: apps/ios-native
        # Package tests, then the app-hosted tests; only a host app that never
        # launched is retried, once, with a warning (scripts/ci-test.sh).
        run: scripts/ci-test.sh "${{ steps.sim.outputs.udid }}" "$SPM_DIR" "$RUNNER_TEMP"

      # Every UI test but the store screenshots: Apple's accessibility audit at
      # the default size and AX5, Reduce Motion and Reduce Transparency, and the
      # behaviour tests (scripts/ui-audit.sh).
      - name: UI tests and accessibility audit (iPhone, gating)
        working-directory: apps/ios-native
        run: scripts/ui-audit.sh gate "iPhone 17 Pro Max" "$SPM_DIR" "$RUNNER_TEMP"

      # The iPad audit is clean (2026-10-20), so it gates too: the iPad-only
      # tests (sidebar, shelf) bite here.
      - name: UI tests and accessibility audit (iPad, gating)
        working-directory: apps/ios-native
        run: scripts/ui-audit.sh gate "iPad Pro 13-inch (M5)" "$SPM_DIR" "$RUNNER_TEMP"

      # The large-text and small-screen tests on the smallest iPhone, where they
      # bite (a call at AX5 only scrolls there), and the audit on every screen.
      - name: UI tests, large text (iPhone SE, gating)
        working-directory: apps/ios-native
        run: >-
          scripts/ui-audit.sh gate "iPhone SE (3rd generation)" "$SPM_DIR" "$RUNNER_TEMP"
          CallControlsAtLargeTextTests,NameChipUITests,SettingsTitleUITests,HomeFullnessUITests,MemoryEdgesUITests,MemoryJournalUITests,SignInUITests,HelpLinksUITests,PaperScreensUITests,AccessibilityAuditTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/app-tests*.log
            ${{ runner.temp }}/ui-audit-*.log
          retention-days: 14

      # The archive checks themselves (build number, one version everywhere,
      # English only), on synthetic bundles.
      - name: Archive checks self-test
        working-directory: apps/ios-native
        run: scripts/test-archive-checks.sh

      # Tags and manual runs also check that a Release archive builds. It is
      # unsigned: signing and upload stay manual in Xcode.
      - name: Build iOS archive (unsigned)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: apps/ios-native
        run: |
          xcodebuild -project Ferni.xcodeproj \
            -scheme Ferni \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ferni.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            archive \
            CURRENT_PROJECT_VERSION="$(scripts/build-number.sh)" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          scripts/check-archive.sh "$RUNNER_TEMP/Ferni.xcarchive"

      - name: Upload iOS archive
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/Ferni.xcarchive
          retention-days: 30

  # ============================================================================
  # ANDROID BUILD (Native Kotlin/Compose)
  # ============================================================================
  build-android:
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mobile' ||
      github.event.inputs.platforms == 'android'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android-native/**/*.gradle*', 'apps/android-native/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/android-native/ferni-release.keystore

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/android-native/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../ferni-release.keystore
          EOF

      - name: Build Android APK
        run: |
          cd apps/android-native
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Android Bundle (AAB)
        run: |
          cd apps/android-native
          ./gradlew bundleRelease
        continue-on-error: true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: |
            apps/android-native/app/build/outputs/apk/release/*.apk
            apps/android-native/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # ============================================================================
  # CREATE RELEASE
  # ============================================================================
  create-release:
    needs: [build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/android-build/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

