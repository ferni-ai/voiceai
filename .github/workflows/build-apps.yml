# Voice AI - Build Native Apps
#
# Builds signed mobile apps (iOS, Android). The Electron desktop app was removed.
# Triggered on version tags (v*) or manual dispatch.

name: Build Native Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mobile
          - ios
          - android

# Cancel in-progress runs for same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # iOS BUILD (Native SwiftUI)
  # ============================================================================
  build-ios:
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mobile' ||
      github.event.inputs.platforms == 'ios'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift Package Dependencies
        run: |
          cd apps/ios-native
          xcodebuild -resolvePackageDependencies \
            -project FerniVoice.xcodeproj \
            -scheme FerniVoice

      # For full iOS builds, you'd add:
      # - Import provisioning profiles
      # - Import signing certificates
      # - Build with xcodebuild
      # - Upload to TestFlight

      - name: Build iOS (Archive Ready)
        run: |
          cd apps/ios-native
          xcodebuild -project FerniVoice.xcodeproj \
            -scheme FerniVoice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/FerniVoice.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        continue-on-error: true

      - name: Upload iOS project
        uses: actions/upload-artifact@v7
        with:
          name: ios-project
          path: apps/ios-native/
          retention-days: 30

  # ============================================================================
  # ANDROID BUILD (Native Kotlin/Compose)
  # ============================================================================
  build-android:
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mobile' ||
      github.event.inputs.platforms == 'android'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android-native/**/*.gradle*', 'apps/android-native/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/android-native/ferni-release.keystore

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/android-native/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../ferni-release.keystore
          EOF

      - name: Build Android APK
        run: |
          cd apps/android-native
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Android Bundle (AAB)
        run: |
          cd apps/android-native
          ./gradlew bundleRelease
        continue-on-error: true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: |
            apps/android-native/app/build/outputs/apk/release/*.apk
            apps/android-native/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # ============================================================================
  # CREATE RELEASE
  # ============================================================================
  create-release:
    needs: [build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/android-build/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

