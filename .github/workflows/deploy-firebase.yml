name: Deploy Firebase Hosting

# Auto-deploy frontend to Firebase Hosting when pushed to main
# Deploys to BOTH sites: ferni-prod AND johnb-app (app.ferni.ai)
#
# Deployment Strategy:
# 1. Build frontend
# 2. Deploy to Firebase (atomic - instant switch)
# 3. Run health checks on deployed site (HTTP status + browser smoke test)
# 4. If unhealthy, auto-rollback to previous version
#
# NOTE: Deploys on ALL pushes to main (not just frontend changes) because:
# - Backend persona changes affect the app experience
# - System prompt changes need fresh frontend for consistency
# - Ensures frontend and backend stay in sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        type: choice
        options:
          - app
          - landing
          - both
        default: 'app'

# One deploy at a time. Merges minutes apart each start a deploy, and without
# a group they ran in parallel, so whichever finished last decided what served
# production, even an older commit (2026-10-02: four at once). A queued run
# waits; GitHub keeps only the newest pending one, so main's head wins.
# cancel-in-progress stays off so a rollout is never cut off midway.
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # DEPLOY APP (ferni-prod + johnb-app)
  # ============================================================================
  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.target == 'app' || inputs.target == 'both' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Build design-system
        run: node design-system/build.js

      - name: Install frontend dependencies
        run: |
          cd apps/web
          pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: |
          cd apps/web
          pnpm build
        env:
          NODE_ENV: production
          # Venmo chip-in card (#1014): off unless both repo variables are set.
          VITE_VENMO_CHIP_IN: ${{ vars.VITE_VENMO_CHIP_IN }}
          VITE_VENMO_HANDLE: ${{ vars.VITE_VENMO_HANDLE }}
          # Caption flags (apps/web/src/ui/captions/captions-flag.ts); off unless exactly "true".
          VITE_CAPTIONS_V2: ${{ vars.VITE_CAPTIONS_V2 }}
          VITE_CAPTIONS_BREATH: ${{ vars.VITE_CAPTIONS_BREATH }}
          VITE_CAPTIONS_HEARD: ${{ vars.VITE_CAPTIONS_HEARD }}
          # What Ferni Knows (apps/web/src/ui/memory/known.ts); off unless exactly "true".
          VITE_MEMORY_VIEW: ${{ vars.VITE_MEMORY_VIEW }}
          # Promises in the Your Day hub (apps/web/src/ui/hub-promises.ui.ts); off unless exactly "true".
          VITE_PROMISES_PANEL: ${{ vars.VITE_PROMISES_PANEL }}
          # Toast region (apps/web/src/ui/overlay/toast-flag.ts): ON unless "off". Kill switch:
          # set the repo variable VITE_TOAST_REGION=off and re-run this workflow.
          VITE_TOAST_REGION: ${{ vars.VITE_TOAST_REGION }}
          # Talk first (apps/web/src/config/try-first-flag.ts): on for prod since
          # 2026-10-18. To turn it off, set the repo variable VITE_TRY_FIRST=false
          # and re-run this workflow.
          VITE_TRY_FIRST: ${{ vars.VITE_TRY_FIRST || 'true' }}
          # Apple sign-in on the web (apps/web/src/config/apple-web-signin-flag.ts); hidden unless exactly "true".
          VITE_APPLE_WEB_SIGNIN: ${{ vars.VITE_APPLE_WEB_SIGNIN }}
          # Goodbye ceremony and reconnect prompt (apps/web/src/config/call-wrap-up-flag.ts); off unless exactly "true".
          VITE_CALL_WRAP_UP: ${{ vars.VITE_CALL_WRAP_UP }}
          # Calm idle home screen (apps/web/src/config/calm-idle.ts); off unless exactly "true".
          VITE_CALM_IDLE: ${{ vars.VITE_CALM_IDLE }}
          # Avatar motion switches (apps/web/src/config/motion-flags.ts); each off unless "on" or "true".
          VITE_NATURAL_BLINK: ${{ vars.VITE_NATURAL_BLINK }}
          VITE_LID_BLEND: ${{ vars.VITE_LID_BLEND }}
          VITE_GAZE: ${{ vars.VITE_GAZE }}
          VITE_LISTEN_NODS: ${{ vars.VITE_LISTEN_NODS }}
          VITE_SPRING_BODY: ${{ vars.VITE_SPRING_BODY }}
          VITE_WEIGHTED_EASING: ${{ vars.VITE_WEIGHTED_EASING }}
          VITE_SPEECH_BEATS: ${{ vars.VITE_SPEECH_BEATS }}
          VITE_THINKING_GLANCE: ${{ vars.VITE_THINKING_GLANCE }}
          VITE_TURN_GESTURES: ${{ vars.VITE_TURN_GESTURES }}
          VITE_FACE_ENGINE: ${{ vars.VITE_FACE_ENGINE }}
          VITE_EXPRESSION_ARBITER: ${{ vars.VITE_EXPRESSION_ARBITER }}
          VITE_REPLY_TONE: ${{ vars.VITE_REPLY_TONE }}
          VITE_SOUND_DIRECTOR: ${{ vars.VITE_SOUND_DIRECTOR }}
          # Android app links (apps/web/scripts/asset-links.ts): the signing
          # SHA-256 fingerprint(s), comma separated. Unset serves [] as before.
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}

      - name: Deploy to Firebase (ferni-prod)
        id: deploy-ferni
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0, the commit v0 points to
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          target: ferni-prod
          entryPoint: ./apps/web

      - name: Deploy to Firebase (johnb-app / app.ferni.ai)
        id: deploy-app
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0, the commit v0 points to
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          target: johnb-app
          entryPoint: ./apps/web

      - name: Health check deployed sites
        id: health
        run: |
          echo "Waiting 10s for deployment propagation..."
          sleep 10

          HEALTHY=true

          # Check ferni-prod
          echo "Checking https://ferni-prod.web.app..."
          for i in {1..3}; do
            if curl -sf "https://ferni-prod.web.app" > /dev/null 2>&1; then
              echo "✅ ferni-prod is healthy"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "❌ ferni-prod health check failed"
              HEALTHY=false
            fi
            sleep 5
          done

          # Check app.ferni.ai
          echo "Checking https://app.ferni.ai..."
          for i in {1..3}; do
            if curl -sf "https://app.ferni.ai" > /dev/null 2>&1; then
              echo "✅ app.ferni.ai is healthy"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "❌ app.ferni.ai health check failed"
              HEALTHY=false
            fi
            sleep 5
          done

          echo "healthy=$HEALTHY" >> $GITHUB_OUTPUT

      # curl only proves the HTML was served. On 2026-10-04 app.ferni.ai returned
      # 200 while its JS crashed at module evaluation, so also load each site in
      # a real browser and fail on uncaught errors or a missing sign-in gate.
      - name: Install Playwright chromium
        run: pnpm playwright install --with-deps --only-shell chromium

      - name: Browser smoke test deployed sites
        id: smoke
        # Let the rollback step below run when this fails
        continue-on-error: true
        run: |
          rc=0
          node scripts/smoke-frontend.mjs https://ferni-prod.web.app || rc=1
          node scripts/smoke-frontend.mjs https://app.ferni.ai || rc=1
          exit $rc

      - name: Rollback on health check failure
        if: steps.health.outputs.healthy == 'false' || steps.smoke.outcome == 'failure'
        run: |
          echo "⚠️ Health check failed - initiating rollback"

          # Install Firebase CLI
          npm install -g firebase-tools

          # Rollback to previous version
          cd apps/web
          firebase hosting:rollback --site ferni-prod --confirm || echo "Rollback ferni-prod failed"
          firebase hosting:rollback --site johnb-app --confirm || echo "Rollback johnb-app failed"

          echo "🔄 Rollback initiated - check Firebase console for status"
          exit 1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deployment summary
        if: steps.health.outputs.healthy == 'true' && steps.smoke.outcome == 'success'
        run: |
          echo "## 🚀 Firebase Hosting Deployed (Healthy)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Site | URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ferni-prod | https://ferni-prod.web.app | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          echo "| johnb-app | https://app.ferni.ai | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # DEPLOY LANDING PAGE
  # ============================================================================
  deploy-landing:
    name: Deploy Landing
    runs-on: ubuntu-latest
    # Every push to main, like the app, plus a manual landing or both
    # dispatch. A push-only "did the site change" check would miss site
    # merges whose queued run the concurrency group replaced with a newer one.
    if: ${{ github.event_name == 'push' || inputs.target == 'landing' || inputs.target == 'both' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      # The site lives in apps/website/ferni-website (its old promo folder is gone),
      # the folder `ferni deploy landing` builds. It is not a pnpm workspace package
      # and has its own package-lock.json, so npm installs it. build:prod is the
      # production build (minified) that `ferni deploy landing` runs.
      - name: Install landing dependencies
        working-directory: apps/website/ferni-website
        run: npm ci --no-audit --no-fund

      - name: Build landing page
        working-directory: apps/website/ferni-website
        run: npm run build:prod

      - name: Install Playwright chromium
        run: pnpm playwright install --with-deps --only-shell chromium

      # Fails the deploy if dark mode leaves any text under 3:1 again.
      - name: Check light and dark mode on the built site
        run: pnpm playwright test -c apps/website/ferni-website/playwright.config.ts

      - name: Deploy landing to Firebase
        id: deploy-landing
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0, the commit v0 points to
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          target: ferni-landing
          entryPoint: ./apps/website/ferni-website

      - name: Health check landing page
        id: health
        run: |
          echo "Waiting 10s for deployment propagation..."
          sleep 10

          echo "Checking https://ferni.ai..."
          for i in {1..3}; do
            if curl -sf "https://ferni.ai" > /dev/null 2>&1; then
              echo "✅ ferni.ai is healthy"
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

          echo "healthy=false" >> $GITHUB_OUTPUT
          echo "❌ ferni.ai health check failed"

      - name: Rollback on health check failure
        if: steps.health.outputs.healthy == 'false'
        run: |
          echo "⚠️ Health check failed - initiating rollback"
          npm install -g firebase-tools
          cd apps/website/ferni-website
          firebase hosting:rollback --site ferni-landing --confirm || echo "Rollback failed"
          exit 1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deployment summary
        if: steps.health.outputs.healthy == 'true'
        run: |
          echo "## 🌐 Landing Page Deployed (Healthy)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Site | URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Landing | https://ferni.ai | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # NOTIFY ON FAILURE
  # ============================================================================
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy-app, deploy-landing]
    if: failure()
    steps:
      - name: Send Slack notification
        # The commit message is attacker-controlled text: read it from env and
        # let jq build the JSON, never splice it into the script.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg msg "$COMMIT_MSG" --arg url "$RUN_URL" \
            '{text: ("❌ Firebase deploy failed or rolled back: " + $msg + "\n\n🔗 <" + $url + "|View logs>")}' \
            | curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
                -H 'Content-type: application/json' \
                --data @-
        continue-on-error: true
