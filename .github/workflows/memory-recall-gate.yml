name: Memory Recall Gate

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/memory/**'
      - '.github/workflows/memory-recall-gate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/memory/**'
      - '.github/workflows/memory-recall-gate.yml'

# One run per PR: a new push cancels the PR's running one. Every other run (push,
# merge queue, schedule) gets its own group and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  recall-at-5:
    if: ${{ vars.OPTIONAL_CI != 'off' }}
    name: Memory recall@5 golden gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        # Frozen: this job does not rewrite package.json (the reason ci.yml can't
        # be), so a lockfile mismatch here is a real error, not drift to absorb.
        run: pnpm install --frozen-lockfile

      - name: Run memory recall golden gate
        run: pnpm test:memory:recall
        env:
          NODE_ENV: test
