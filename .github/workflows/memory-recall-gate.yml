name: Memory Recall Gate

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/memory/**'
      - '.github/workflows/memory-recall-gate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/memory/**'
      - '.github/workflows/memory-recall-gate.yml'

concurrency:
  group: memory-recall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  recall-at-5:
    name: Memory recall@5 golden gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        # Frozen: this job does not rewrite package.json (the reason ci.yml can't
        # be), so a lockfile mismatch here is a real error, not drift to absorb.
        run: pnpm install --frozen-lockfile

      - name: Run memory recall golden gate
        run: pnpm test:memory:recall
        env:
          NODE_ENV: test
