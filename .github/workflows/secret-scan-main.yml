name: Secret Scan (main)

# Every push to main is scanned for secrets, two ways, failing on a live secret
# or one whose check couldn't finish (--results=verified,unknown, as CI's PR and
# merge-queue scans):
# - the full tree at the pushed commit (a one-commit checkout is enough), which
#   catches anything present on main whatever path it came by;
# - the pushed commits themselves (scripts/ci/secret-scan-range.sh), which
#   catches a secret added and removed within the push.
# PRs and merge-queue groups are scanned in CI's Security Scan (a required check).
# This lives apart from CI because CI's push trigger has a paths filter and a
# newer push replaces a waiting CI push run: here there is no filter and no
# concurrency group, so every push is scanned and no run is dropped.
# Until 2026-10-19 the push scan in CI read 0 bytes on every run (#2206).

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned by digest: the scanner sees the whole tree. Same trufflehog (3.99.2) as
  # the pinned action below pulled on 2026-10-19. Bump deliberately.
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a

jobs:
  scan:
    name: Secret scan of main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every file on main
        run: |
          echo '(^|/)\.git/' > "$RUNNER_TEMP/exclude-paths"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/cfg:ro" "$TRUFFLEHOG_IMAGE" \
            filesystem /repo --exclude-paths=/cfg/exclude-paths --results=verified,unknown --fail --no-update

      - name: Commits pushed
        id: scan-range
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: push
          REPO: ${{ github.repository }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: bash scripts/ci/secret-scan-range.sh

      - name: Check the pushed commits for secrets
        if: steps.scan-range.outputs.commits != '0'
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          base: ${{ steps.scan-range.outputs.base }}
          head: ${{ steps.scan-range.outputs.head }}
          extra_args: --results=verified,unknown
