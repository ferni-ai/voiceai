name: Cost Alerts

# Monitors Google Cloud spending and alerts on spikes
# Runs daily and checks against budget thresholds

on:
  schedule:
    # Daily at 8 AM UTC (midnight PST)
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  # Daily cost thresholds in USD; the COST_ALERT_USD and COST_CRITICAL_USD repo
  # variables override them.
  ALERT_THRESHOLD: ${{ vars.COST_ALERT_USD || '50' }}
  CRITICAL_THRESHOLD: ${{ vars.COST_CRITICAL_USD || '100' }}

jobs:
  check-costs:
    name: Check Cloud Costs
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Real spend from the Cloud Billing export to BigQuery. Until 2026-10-17 this
      # step wrote a fixed daily_cost=25 whatever was spent, so the alert could
      # never fire. Off until the BILLING_EXPORT_TABLE repo variable names the
      # export table (project.dataset.gcp_billing_export_v1_XXXXXX); while it is
      # unset the run says the cost was not measured instead of inventing one.
      - name: Get yesterday's costs
        id: costs
        env:
          BILLING_EXPORT_TABLE: ${{ vars.BILLING_EXPORT_TABLE }}
        run: |
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          echo "Checking costs for $YESTERDAY"

          if [ -z "$BILLING_EXPORT_TABLE" ]; then
            echo "::warning::BILLING_EXPORT_TABLE is not set, so daily cost was not measured"
            echo "has_access=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! [[ "$BILLING_EXPORT_TABLE" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::BILLING_EXPORT_TABLE must be project.dataset.table"
            exit 1
          fi

          # Net of credits (free tier, discounts), in the billing account's currency.
          COST=$(bq query --use_legacy_sql=false --format=csv --quiet \
            "SELECT ROUND(IFNULL(SUM(cost), 0) + IFNULL(SUM((SELECT SUM(c.amount) FROM UNNEST(credits) c)), 0), 2)
             FROM \`$BILLING_EXPORT_TABLE\`
             WHERE DATE(usage_start_time) = '$YESTERDAY'" | tail -n 1)
          if ! [[ "$COST" =~ ^-?[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Could not read cost from $BILLING_EXPORT_TABLE (got: $COST)"
            exit 1
          fi

          echo "has_access=true" >> $GITHUB_OUTPUT
          echo "daily_cost=$COST" >> $GITHUB_OUTPUT
          echo "Spend on $YESTERDAY: \$$COST"

      - name: Check thresholds
        id: check
        if: steps.costs.outputs.has_access == 'true'
        run: |
          COST=${{ steps.costs.outputs.daily_cost }}
          ALERT=${{ env.ALERT_THRESHOLD }}
          CRITICAL=${{ env.CRITICAL_THRESHOLD }}

          # COST has cents, which bash's -gt can't compare.
          if awk -v c="$COST" -v t="$CRITICAL" 'BEGIN { exit !(c > t) }'; then
            echo "level=critical" >> $GITHUB_OUTPUT
            echo "🚨 CRITICAL: Daily cost ($${COST}) exceeds $${CRITICAL}!"
          elif awk -v c="$COST" -v t="$ALERT" 'BEGIN { exit !(c > t) }'; then
            echo "level=warning" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING: Daily cost ($${COST}) exceeds $${ALERT}"
          else
            echo "level=ok" >> $GITHUB_OUTPUT
            echo "✅ Costs normal: $${COST}/day"
          fi

      - name: Alert on high costs
        if: steps.check.outputs.level == 'critical' || steps.check.outputs.level == 'warning'
        run: |
          LEVEL="${{ steps.check.outputs.level }}"
          COST="${{ steps.costs.outputs.daily_cost }}"

          if [ "$LEVEL" == "critical" ]; then
            EMOJI="🚨"
            TEXT="CRITICAL COST ALERT"
          else
            EMOJI="⚠️"
            TEXT="Cost Warning"
          fi

          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"$EMOJI *$TEXT*\n\nDaily cloud spend: \$${COST}\nThreshold: \${{ env.ALERT_THRESHOLD }}\n\n<https://console.cloud.google.com/billing|View Billing>\"
            }"

      - name: Summary
        env:
          COST: ${{ steps.costs.outputs.daily_cost }}
        run: |
          echo "## 💰 Daily Cost Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          SPEND="not measured"
          [ -n "$COST" ] && SPEND="\$$COST"
          echo "| Yesterday's spend | $SPEND |" >> $GITHUB_STEP_SUMMARY
          echo "| Alert threshold | \$${{ env.ALERT_THRESHOLD }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical threshold | \$${{ env.CRITICAL_THRESHOLD }} |" >> $GITHUB_STEP_SUMMARY
          if [ -z "$COST" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_Not measured: set the BILLING_EXPORT_TABLE repo variable to the [BigQuery billing export](https://cloud.google.com/billing/docs/how-to/export-data-bigquery) table._" >> $GITHUB_STEP_SUMMARY
          fi
