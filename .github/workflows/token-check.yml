# Token Drift Check
# ===================
# Regenerates every design-token output and fails if any committed file differs
# (content-based — see design-system/check-drift.js). Covers CSS, TS, the
# Tailwind config, iOS expressions JSON and the website token CSS.
# Fix locally with: pnpm tokens:sync && git add -A

name: Token Drift Check

on:
  pull_request:
    paths:
      - 'design-system/tokens/**'
      - 'design-system/*.js'
      - 'design-system/build/**'
      - 'design-system/dist/**'
      - 'apps/web/src/config/*.generated.*'
      - 'apps/web/public/design-system/**'
      - 'apps/ios-native/Ferni/Resources/expressions.json'
      - 'apps/website/ferni-website/css/**'
      - 'apps/website/ferni-website/src/css/**'
      - 'apps/website/ferni-website/tailwind.config.generated.js'
      - 'apps/website/developers-portal/src/css/tokens.css'
      - 'apps/website/design-system-portal/src/css/tokens.css'
      - 'brand/**.css'
      - '.github/workflows/token-check.yml'
  push:
    branches: [main]
    paths:
      - 'design-system/tokens/**'
      - 'design-system/*.js'
      - 'design-system/build/**'

jobs:
  token-drift-check:
    name: Check Token Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Check token drift
        run: pnpm tokens:check
