# Token Drift Check
# ===================
# Fails when any file tokens:sync writes (web tokens, animation constants,
# expressions, Tailwind config, website/brand token copies) differs from what
# the generators produce. Same gate as ci.yml's frontend-quality step; this
# workflow also runs on website-only changes, which ci.yml skips.
# Fix: pnpm tokens:drift --fix, then commit.

name: Token Drift Check

on:
  pull_request:
    paths:
      - 'design-system/tokens/**'
      - 'design-system/*.js'
      - 'design-system/lib/**'
      - 'design-system/dist/**'
      - 'apps/web/src/config/**'
      - 'apps/ios-native/Packages/FerniDesign/Sources/FerniDesign/Resources/expressions.json'
      - 'apps/website/ferni-website/tailwind.config.generated.js'
      - 'apps/web/public/design-system/**'
      - 'apps/website/ferni-website/css/**'
      - 'apps/website/ferni-website/src/css/**'
      - 'apps/website/developers-portal/src/css/tokens.css'
      - 'apps/website/design-system-portal/src/css/tokens.css'
      - 'brand/**.css'
  push:
    branches: [main]
    paths:
      - 'design-system/tokens/**'
      - 'design-system/*.js'
      - 'design-system/lib/**'

# One run per PR: a new push cancels the PR's running one. Every other run (push,
# merge queue, schedule) gets its own group and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  token-drift-check:
    if: ${{ vars.OPTIONAL_CI != 'off' }}
    name: Check Token Drift
    # optional: hosted only; re-enable VM via CI_RUNNER in Nov if wanted
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Design-system drift gate
        run: pnpm tokens:drift
