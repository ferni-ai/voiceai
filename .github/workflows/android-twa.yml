name: Android app (TWA)

# Builds the Play bundle for apps/android-twa, the Trusted Web Activity that
# wraps https://app.ferni.ai. Signs it only when the four ANDROID_UPLOAD_*
# secrets exist (scripts/android/make-upload-key.sh sets them); otherwise the
# bundle is unsigned and the run says so. Uploading to Play is a separate,
# manually dispatched job behind the play-release environment.

on:
  pull_request:
    paths:
      - 'apps/android-twa/**'
      - '.github/workflows/android-twa.yml'
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Upload the signed bundle to the Play internal track (needs play-release approval)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        working-directory: apps/android-twa
    env:
      # Play needs a higher versionCode on every upload; the run number only grows.
      TWA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Upload key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set_count=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v}" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -eq 0 ]; then
            echo "::warning::No ANDROID_UPLOAD_* secrets: building an UNSIGNED bundle. Play will not accept it; run scripts/android/make-upload-key.sh."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$set_count" -ne 4 ]; then
            echo "::error::Only $set_count of the 4 ANDROID_UPLOAD_* secrets are set. Set all four or none."
            exit 1
          fi
          keystore="$RUNNER_TEMP/upload.keystore"
          (umask 077 && printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore")
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing with the upload key."

      - name: Build release bundle
        env:
          # Empty when unsigned; app/build.gradle then leaves the bundle unsigned.
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Check the bundle
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$aab" || { echo "::error::$aab was not produced"; exit 1; }
          unzip -p "$aab" base/manifest/AndroidManifest.xml > /dev/null
          if [ "$SIGNED" = "true" ]; then
            jarsigner -verify "$aab" | grep -q "jar verified"
            keytool -printcert -jarfile "$aab" | grep -E 'SHA256:' | sed 's/^/Upload key /'
          else
            if jarsigner -verify "$aab" 2>&1 | grep -q 'jar is unsigned'; then
              echo "Bundle is unsigned, as expected without the upload key."
            else
              echo "::error::Expected an unsigned bundle"; exit 1
            fi
          fi
          ls -l "$aab"
          {
            echo "### Android bundle"
            echo "- versionCode: $TWA_VERSION_CODE"
            echo "- signed: $SIGNED"
            echo "- size: $(stat -c %s "$aab") bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ferni-android-${{ github.run_number }}-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: apps/android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  play-internal:
    name: Upload to Play internal track
    needs: build
    # Manual only, a signed bundle only, and a reviewer must approve the
    # play-release environment. Play also needs the first bundle uploaded by hand.
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_play && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-release
    steps:
      - name: Require the Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set; nothing was uploaded."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: ferni-android-${{ github.run_number }}-signed
          path: bundle

      - name: Upload to the internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.ferni.app
          releaseFiles: bundle/app-release.aab
          track: internal
          # A Play app that has never been published only accepts draft releases.
          status: draft
