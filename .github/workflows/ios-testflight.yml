# iOS TestFlight: archives the iPhone app from main and uploads it for
# internal testers, with Xcode's own tools (apps/ios-native/scripts/testflight.sh).
#
# Started by hand only, from main, and every run waits for a reviewer on the
# `testflight` environment. ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 must be
# secrets of that environment (not repository secrets), so nothing else can
# read the key. No third-party action runs in this job besides a SHA-pinned
# checkout.

name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Refuses before the reviewer is asked while any open issue is labelled
  # `blocks-testflight` (e.g. #2868: known bugs landed on main by the iOS train).
  # Fails closed if the issues can't be read.
  blockers:
    name: No open TestFlight blockers
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    steps:
      - name: Check blocks-testflight issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # A token that can't read issues gets an empty list, not an error (search and REST
          # alike, the repo being public), which would wave every run through. Prove issues are
          # visible first: the 100 newest items always include issues in this repo.
          seen=$(gh api "repos/$REPO/issues?state=all&sort=created&per_page=100" \
            --jq '[.[] | select(.pull_request | not)] | length') || seen=0
          if [ "${seen:-0}" -lt 1 ]; then
            echo "::error::this token can't see any issues, so blockers can't be checked; refusing"
            exit 1
          fi
          open=$(gh api "repos/$REPO/issues?labels=blocks-testflight&state=open&per_page=100" \
            --jq '.[] | select(.pull_request | not) | "#\(.number) \(.title | gsub("[\\r\\n]"; " "))"') \
            || { echo "::error::could not read blocker issues; refusing"; exit 1; }
          if [ -n "$open" ]; then
            echo "::error::TestFlight is blocked until these issues close:"
            echo "$open"
            exit 1
          fi
          echo "no open blocks-testflight issues"

  testflight:
    name: Archive and upload to TestFlight
    needs: blockers
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Xcode the iOS CI job builds with; fails loudly if the image lacks it.
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || { ls -d /Applications/Xcode*.app; exit 1; }
          xcodebuild -version

      - name: Archive and upload
        working-directory: apps/ios-native
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: ./scripts/testflight.sh
