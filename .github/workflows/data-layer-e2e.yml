name: Data Layer E2E Tests

# Firestore emulator tests for the data layer: the semantic layer's
# hooks → indexing → search → retrieval flow, and the race contracts that only a
# real Firestore can show (single-use records, a placed call's once-claims).
#
# Triggers on every pull request and merge-queue entry, with no `paths:` filter:
# a workflow-level filter never starts in the merge queue, so a required check
# behind one waits forever. The `changes` job decides instead. The check to
# require is the last job, "Data Layer E2E": success when nothing the tests
# cover changed, else the Firestore Emulator E2E result.
#
# Firestore Emulator E2E is not OPTIONAL_CI-gated, so a change it covers is
# tested before it merges (its race tests used to run only nightly). The other
# two jobs stay optional: they follow OPTIONAL_CI on pull requests and stay out
# of the merge queue. All three run nightly and on manual dispatch.

on:
  pull_request:
  merge_group:
  # Nightly on main, whatever OPTIONAL_CI says (#1366)
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

# One run per PR: a new push cancels the PR's running one. Every other run
# (merge queue, schedule, dispatch) gets its own group and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Did the data layer change?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      data_layer: ${{ steps.data_layer.outputs.matched }}
    steps:
      - uses: actions/checkout@v7

      # One regex per line: grep -E reads each line as its own pattern. `|-`
      # drops the trailing newline, which would add an empty match-all pattern.
      # Schedule and dispatch always match (see the action). The last lines are
      # what the single-use and call-claim race tests load besides their stores.
      # No comments inside the block: each line there is a pattern.
      - id: data_layer
        uses: ./.github/actions/pr-changes
        with:
          merge-group: 'true'
          include: |-
            ^src/services/data-layer/
            ^src/services/seeds/
            ^src/api/seeds-(routes|purchase)\.ts$
            ^apps/web/src/services/cosmetics\.service\.ts$
            ^src/services/billing/stripe-subscription\.ts$
            ^src/api/garden-routes\.ts$
            ^src/api/roadmap-[^/]*\.ts$
            ^src/api/outreach[^/]*\.ts$
            ^src/services/outreach/outreach-history[^/]*\.ts$
            ^src/services/outreach/(live-report-record|call-progress)\.ts$
            ^src/services/outreach/__tests__/call-claim-race\.emulator\.test\.ts$
            ^src/api/__tests__/menu-[^/]*\.emulator\.test\.ts$
            ^src/services/wellbeing-tracking/
            ^src/api/wellbeing[^/]*\.ts$
            ^src/personality/(pattern-persistence|emotional-data-shape)\.ts$
            ^src/utils/emotion-point-fields\.ts$
            ^scripts/migrations/(__tests__/)?strip-emotional-[^/]*\.ts$
            ^src/services/platform/(erase-user-record|user-stores|erase-other-keys)\.ts$
            ^scripts/devdb/
            ^src/api/account-routes\.ts$
            ^src/services/stores/single-use-records\.ts$
            ^src/services/stores/__tests__/single-use-records\.emulator\.test\.ts$
            ^src/servers/token/oauth-link-state\.ts$
            ^src/services/connect-moments/
            ^src/memory/
            ^src/tasks/scheduled/transcript-cleanup-job\.ts$
            ^src/tasks/scheduled/__tests__/transcript-cleanup\.emulator\.test\.ts$
            ^src/api/routes/intelligence-routes\.ts$
            ^src/api/__tests__/record-emotion[^/]*\.ts$
            ^src/tools/semantic-router/advanced/(better-than-human|emotional-history-shape)\.ts$
            ^src/intelligence/
            ^src/tests/data-layer/
            ^firestore\.indexes\.json$
            ^firebase\.json$
            ^\.github/workflows/data-layer-e2e\.yml$
            ^\.github/actions/(pr-changes|setup-node-pnpm)/
            ^src/utils/(firestore-utils|erasing-mark)\.ts$
            ^src/services/superhuman/firestore-utils\.ts$
            ^src/config/flags/CONNECT_MOMENT_CALENDAR\.ts$
            ^src/tests/setup(-emulator)?\.ts$
            ^vitest\.config(\.unit)?\.ts$
            ^firestore\.rules$

  firestore-e2e:
    needs: changes
    if: needs.changes.outputs.data_layer == 'true'
    name: Firestore Emulator E2E
    # Hosted runners only (public repo)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Setup Java (required for Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firestore Emulator
        run: |
          # firebase.json lists one firestore entry per database; the emulator
          # loads rules only when --only names one (both use firestore.rules).
          firebase emulators:start --only firestore:ferni-dev --project demo-project > emulator.log 2>&1 &
          # Fail here if it never comes up: running the tests without it (as when
          # this job installed Java 17 and firebase-tools needed 21) hid the failure.
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/ && echo "Emulator up after ${i}s" && exit 0
            sleep 1
          done
          cat emulator.log
          echo "Firestore emulator did not start" && exit 1

      - name: Run Data Layer E2E Tests
        run: |
          pnpm vitest run src/tests/data-layer/e2e-firestore.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          # The emulator's project; code that starts firebase-admin without a
          # projectId (ttl-cleanup) otherwise fails with "Unable to detect a Project Id".
          GCLOUD_PROJECT: demo-project
          NODE_ENV: test
          # Disable Google API for tests (no real embeddings)
          GOOGLE_API_KEY: ''
          SKIP_EMBEDDING: 'true'

      - name: Run Seed Ledger Tests
        run: |
          pnpm vitest run src/services/seeds/__tests__/ src/api/__tests__/seeds-routes-ledger.emulator.test.ts src/api/__tests__/seeds-purchase.emulator.test.ts src/api/__tests__/seeds-import.emulator.test.ts src/api/__tests__/roadmap-seeds.emulator.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          NODE_ENV: test

      # Menu green program: each panel's write->read contract (the voice writer, then
      # the route the panel calls). New lanes add a menu-*.emulator.test.ts; no edit here.
      - name: Run Menu Contract Tests
        run: |
          pnpm vitest run src/api/__tests__/menu- --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GCLOUD_PROJECT: demo-project
          NODE_ENV: test
          GOOGLE_API_KEY: ''
          SKIP_EMBEDDING: 'true'

      - name: Run Account Deletion Tests
        run: |
          pnpm vitest run src/api/__tests__/account-delete-every-store.emulator.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GCLOUD_PROJECT: demo-project
          NODE_ENV: test

      # OAuth states and connect invites: used once even when taps race (a transaction), TTL field a Timestamp
      - name: Run Single-Use Record Tests
        run: |
          pnpm vitest run src/services/stores/__tests__/single-use-records.emulator.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GCLOUD_PROJECT: demo-project
          NODE_ENV: test

      # copy-user.ts copies one person from (default) to ferni-dev: only theirs, dry run writes nothing
      - name: Run Dev Database Copy Tests
        run: |
          pnpm vitest run -c vitest.config.unit.ts scripts/devdb/__tests__/copy-user.emulator.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          NODE_ENV: test

      # record-emotion keeps only typed fields and merges on save, never losing a point
      - name: Run Emotion Point Tests
        run: |
          pnpm vitest run -c vitest.config.unit.ts src/api/__tests__/record-emotion.emulator.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          NODE_ENV: test

      # A placed call's once-claims (progress line, end-of-call report): racing workers, one winner
      - name: Run Call Claim Race Tests
        run: |
          pnpm vitest run -c vitest.config.unit.ts src/services/outreach/__tests__/call-claim-race.emulator.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          NODE_ENV: test

      - name: Run Transcript Cleanup Tests
        run: |
          pnpm vitest run src/tasks/scheduled/__tests__/transcript-cleanup.emulator.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GCLOUD_PROJECT: demo-project
          NODE_ENV: test

      - name: Run Service Wiring Integration Tests
        run: |
          pnpm vitest run src/services/data-layer/__tests__/service-wiring-integration.test.ts --reporter=verbose
        env:
          NODE_ENV: test

      # emotional_data/{uid}/points: strip on load, and the cleanup job (dry run, apply, re-run)
      - name: Run Emotional Data Points Tests
        run: |
          pnpm vitest run -c vitest.config.unit.ts scripts/migrations/__tests__/strip-emotional-data-snippets.emulator.test.ts --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          NODE_ENV: test

      - name: Run Intelligence Layer Tests
        run: |
          pnpm vitest run src/intelligence/__tests__/ --reporter=verbose
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          NODE_ENV: test

      - name: Summary
        if: always()
        run: |
          echo "## 🗄️ Data Layer E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests run with Firestore emulator at localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration hooks (trust, superhuman, calendar, contacts)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Semantic search across domains" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cross-domain correlation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TTL cleanup validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Queue metrics and monitoring" >> $GITHUB_STEP_SUMMARY

  # Entity resolver writes through storage.ts (entity_store/{userId}/…).
  # Kept as its own job so it can keep local hash embeddings on — the
  # firestore-e2e job sets SKIP_EMBEDDING, which would make create/resolve
  # paths here meaningless.
  entity-resolver-emulator:
    needs: changes
    if: >-
      needs.changes.outputs.data_layer == 'true' && github.event_name != 'merge_group' &&
      (vars.OPTIONAL_CI != 'off' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    name: Entity Resolver Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Setup Java (required for Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firestore Emulator
        run: |
          # firebase.json lists one firestore entry per database; the emulator
          # loads rules only when --only names one (both use firestore.rules).
          firebase emulators:start --only firestore:ferni-dev --project demo-project > emulator.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/ && echo "Emulator up after ${i}s" && exit 0
            sleep 1
          done
          cat emulator.log
          echo "Firestore emulator did not start" && exit 1

      - name: Run entity resolver suite
        run: pnpm test:memory:resolver
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GCLOUD_PROJECT: demo-project
          GOOGLE_CLOUD_PROJECT: demo-project
          NODE_ENV: test
          # Force LocalEmbeddings (hash, deterministic). Do not set
          # SKIP_EMBEDDING — createEntity/resolveMention still emit vectors.
          USE_VERTEX_AI: 'false'

      - name: Summary
        if: always()
        run: |
          echo "## Entity Resolver Emulator" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Suite: \`src/memory/entity-store/__tests__/entity-resolver.test.ts\`" >> $GITHUB_STEP_SUMMARY
          echo "Emulator: localhost:8080 with committed \`firestore.indexes.json\`" >> $GITHUB_STEP_SUMMARY
          echo "Embeddings: local hash (\`USE_VERTEX_AI=false\`, no API keys, no \`SKIP_EMBEDDING\`)" >> $GITHUB_STEP_SUMMARY

  # Quick unit tests (no emulator required)
  unit-tests:
    needs: changes
    if: >-
      needs.changes.outputs.data_layer == 'true' && github.event_name != 'merge_group' &&
      (vars.OPTIONAL_CI != 'off' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    name: Data Layer Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Build TypeScript
        run: pnpm build:fast

      - name: Run Unit Tests
        run: |
          pnpm vitest run src/services/data-layer/__tests__/ --reporter=verbose
        env:
          NODE_ENV: test
          SKIP_FIRESTORE: 'true'

  # The one check to require. A job-level `if: always()` makes it report on every
  # run: a skipped Firestore Emulator E2E alone would read as success even when
  # `changes` failed, so this checks both.
  gate:
    name: Data Layer E2E
    needs: [changes, firestore-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          DATA_LAYER: ${{ needs.changes.outputs.data_layer }}
          FIRESTORE_E2E: ${{ needs.firestore-e2e.result }}
        run: |
          echo "changes=$CHANGES data_layer=$DATA_LAYER firestore-e2e=$FIRESTORE_E2E"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Could not tell whether the data layer changed ($CHANGES)"; exit 1
          fi
          if [ "$DATA_LAYER" != "true" ]; then
            echo "Nothing the data layer tests cover changed: Firestore Emulator E2E skipped"; exit 0
          fi
          if [ "$FIRESTORE_E2E" != "success" ]; then
            echo "::error::Firestore Emulator E2E: $FIRESTORE_E2E"; exit 1
          fi
          echo "Firestore Emulator E2E passed"
