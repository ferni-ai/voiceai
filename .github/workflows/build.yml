name: Build

# Builds the backend, the web app and the UI server image, and checks that the image
# starts. "Build & Test" is a required check: it runs in the merge queue, and on a
# PR it is skipped, which reports success (#1250). It used to live in staging.yml, next to the preview deploy, so disabling
# that workflow to stop the previews blocked every merge (2026-10-12).

on:
  pull_request:
    branches: [main]
  merge_group:

# A new push to a PR supersedes its running build. Merge-queue runs always finish
# (cancelling one drops the queue entry).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  changes:
    name: Build Scope
    # Build & Test is skipped on pull_request (below), so this is too.
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 'false' on a PR or queue group that touches nothing the UI image or backend
      # build can see: docs, or only apps/website, ios-native or
      # macos-menubar (see ci.yml's setup job; CI_SCOPED_QUEUE=off scopes PRs only)
      code: ${{ steps.code.outputs.matched }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: code
        uses: ./.github/actions/pr-changes
        with:
          exclude: '^docs/|^scripts/voice-eval/|^[^/]+\.md$|^\.(github|claude)/.+\.md$|^apps/(website|ios-native|android-twa|macos-menubar)/'
          merge-group: ${{ vars.CI_SCOPED_QUEUE != 'off' }}

  # ============================================================================
  # BUILD & TEST
  # ============================================================================
  build:
    name: Build & Test
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    needs: changes
    # Required check: skipped (which reports success) on pull_request and when
    # `code` is false, never filtered out by `paths:`, which would leave it pending
    # forever. The merge queue builds and tests every PR before it merges, and PR
    # runs were starving it of runners (#1250).
    if: github.event_name != 'pull_request' && needs.changes.outputs.code != 'false'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # No test run here: it took 11-17 minutes per PR and per queue entry under
      # continue-on-error, so its result never decided anything. CI's Unit Tests
      # and Integration Tests are the blocking test checks.

      - name: Build backend
        run: pnpm build

      - name: Build design-system
        run: node design-system/build.js

      - name: Build frontend
        run: |
          cd apps/web
          pnpm build
        env:
          NODE_ENV: staging

      # This job is a required check and runs in the merge queue; the preview deploy,
      # the only other build of this image, never runs there. So a Dockerfile.ui that cannot
      # build (#392: an npm lockfile out of sync) merged and failed every UI deploy from
      # main. Build the production image here. No push, no credentials.
      - name: Pull Docker Hub images through a mirror
        uses: ./.github/actions/docker-hub-mirror

      # Self-hosted runners skip the mirror step above, so name the mirror in the
      # build itself: the base image and the Dockerfile frontend both come from
      # mirror.gcr.io instead of Docker Hub, whose anonymous pull limit (429) they share.
      # One tag per run attempt: the 8 runners on a VM share one Docker daemon, so two
      # queue entries building at once collided on a fixed tag ("already exists",
      # 2026-10-11), and a cancelled run left its tag behind for the next one.
      # A built image can still fail to start: the runtime prune deleted a file that
      # compromise imports (suffix-thumb/src/test, fixed in #1211), the server died
      # with ERR_MODULE_NOT_FOUND, and only a Cloud Run deploy noticed, after every
      # UI deploy from main had failed. So start it and wait for /health. The LiveKit
      # values are dummies: the server only checks that they are set, and /health
      # touches no backend.
      - name: Build UI image (no push) and check it starts
        env:
          IMAGE: john-bogle-ui:merge-check-${{ github.run_id }}-${{ github.run_attempt }}
          CONTAINER: ui-start-check-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          trap 'docker rm -f "$CONTAINER" >/dev/null 2>&1; docker image rm "$IMAGE" >/dev/null 2>&1 || echo "::warning::could not remove $IMAGE"' EXIT
          docker build -f docker/Dockerfile.ui -t "$IMAGE" \
            --build-arg BASE_REGISTRY=mirror.gcr.io/library/ \
            --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile:1.4 .
          docker run -d --name "$CONTAINER" -p 127.0.0.1::8080 \
            -e LIVEKIT_URL=wss://start-check.invalid -e LIVEKIT_API_KEY=start-check \
            -e LIVEKIT_API_SECRET=start-check "$IMAGE" >/dev/null
          PORT=$(docker port "$CONTAINER" 8080/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/health" >/dev/null 2>&1; then
              echo "UI image started: /health answered after ${i}s"; exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" = "true" ] || break
            sleep 1
          done
          echo "::error::the UI image did not answer /health within 60s"
          docker logs --tail 80 "$CONTAINER" 2>&1 || true
          exit 1
