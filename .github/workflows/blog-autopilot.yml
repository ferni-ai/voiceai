name: Blog Autopilot

# Drafts a ferni.ai blog post every week and opens a PR for human review.
# Nothing publishes without a person merging it; merging deploys the site
# (deploy-firebase.yml → deploy-landing runs when apps/website/ferni-website changes).

on:
  schedule:
    - cron: '7 15 * * 1' # Mondays 15:07 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic or angle for the post'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-autopilot
  cancel-in-progress: false

jobs:
  draft:
    name: Draft blog post
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 200 # recent history feeds the "what shipped" context

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Draft post
        id: draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_TOPIC: ${{ inputs.topic }}
        run: node scripts/content/draft-blog-post.mjs

      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: content/blog-draft-${{ github.run_id }}
          commit-message: 'content(blog): draft "${{ steps.draft.outputs.title }}"'
          title: 'Blog draft: ${{ steps.draft.outputs.title }}'
          labels: content, blog
          draft: true
          add-paths: apps/website/ferni-website/src/blog/*.md
          body: |
            An AI-drafted post for the ferni.ai blog. **Review before merging** — merging publishes it.

            Checklist:
            - [ ] Facts and product claims are accurate (no invented stats, quotes or anecdotes)
            - [ ] Sounds like Ferni: warm, plain, human
            - [ ] Title, excerpt and category are right
            - [ ] Optional: add a hero `image:` (1200×630 in `images/blog/`)

            Generated by `scripts/content/draft-blog-post.mjs`.
