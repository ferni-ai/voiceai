name: Blog Drafts

# Drafts blog posts with scripts/blog/draft-post.ts. Each draft becomes a PR,
# checked by the brand gate and the live check (check-post.ts --live) and then
# the editorial judge (judge-post.ts: Claude, a different model family from the
# Gemini drafter, scoring six dimensions; its scorecard goes in the PR body):
# - A developer post (whats-new) that passes all three opens ready for review,
#   labelled blog-auto, with auto-merge armed. The merge queue lands it once CI
#   is green, and the merge to main deploys developers.ferni.ai.
# - A consumer post (ferni.ai) that passes all three opens ready for review,
#   labelled blog-needs-approval, with auto-merge OFF. It publishes only when
#   the owner adds the blog-approved label (blog-approval.yml).
# - A post that fails any of them opens as a draft labelled blog-draft, auto-merge
#   is not armed, and the job fails. It publishes only if a person fixes and merges it.
# Consumer posts also get a hero image from scripts/blog/hero-image.ts (Gemini
# image generation, "Nano Banana", on Vertex AI); a consumer post without one
# opens as a draft and is not armed, so a post never publishes imageless.
# A draft the drafter rejects itself (brand gate failed twice) is not written and
# fails the job.
# This log is public: a rejected draft or a failed gate prints rule codes,
# counts and source PR numbers only, never the draft or the text a finding
# quotes (scripts/blog/log-safe.ts). No step here prints the draft file.
#
# The brand gate: no forbidden words, em dashes, ellipses, retired-stack names,
# unlabelled composites, or numbers missing from the sources.
# The live check (live-check.ts) applies to the PRs the drafter may use as
# sources and again to every PR the post cites:
# - Deployed: a PR touching only apps/web, apps/website/ferni-website or
#   apps/website/developers-portal is live once merged (merges deploy them). Anything else, the voice
#   agent included, ships by a manual `lk agent deploy` this workflow can't see,
#   so it counts only once merged for 7 days.
# - Not behind a flag: a PR is left out if its title or body says it's behind a
#   flag, off by default or not wired, names a flag the flag manifest has off by
#   default, or its diff adds an off-by-default flag.
# whats-new posts go to apps/website/developers-portal, which
# deploy-developers.yml deploys to developers.ferni.ai on merge.
#
# Weekly: one developer post (whats-new) and one consumer post, rotating by ISO
# week number through building-in-public, mission-essay, how-ferni-works and
# team-letter. Manual: pick one type, or "weekly" for the same pair.
# A weekly run that fails opens (or updates) one issue labelled
# blog-weekly-failed, and the next weekly run that succeeds closes it.
#
# Token: the PR steps need the BLOG_PR_TOKEN secret, a fine-grained token for
# ferni-ai/voiceai with Contents and Pull requests read and write (a machine
# user's PAT, or a GitHub App installation token). GITHUB_TOKEN can't do it:
# the org doesn't let GitHub Actions create pull requests (403), and a PR it
# opened wouldn't trigger CI, so the required checks would never report and the
# merge queue would never take it. Without the secret the job pushes the branch,
# prints the compare link and fails.

on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC
  workflow_dispatch:
    inputs:
      type:
        description: 'Post type to draft'
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - whats-new
          - building-in-public
          - mission-essay
          - how-ferni-works
          - team-letter

# GITHUB_TOKEN reads merged PRs for the drafter and the live check, and pushes
# the branch when BLOG_PR_TOKEN is missing. The PR steps use BLOG_PR_TOKEN.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: blog-drafts
  cancel-in-progress: false

jobs:
  plan:
    name: Choose post types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      types: ${{ steps.pick.outputs.types }}
    steps:
      - id: pick
        env:
          INPUT_TYPE: ${{ github.event.inputs.type }}
        run: |
          rotation=(building-in-public mission-essay how-ferni-works team-letter)
          week=$((10#$(date -u +%V)))
          consumer=${rotation[$((week % ${#rotation[@]}))]}
          if [ -z "$INPUT_TYPE" ] || [ "$INPUT_TYPE" = weekly ]; then
            types="[\"whats-new\",\"$consumer\"]"
          else
            types="[\"$INPUT_TYPE\"]"
          fi
          echo "ISO week $week: $types"
          echo "types=$types" >> "$GITHUB_OUTPUT"

  draft:
    name: Draft ${{ matrix.type }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        type: ${{ fromJSON(needs.plan.outputs.types) }}
    # Job-level permissions replace the workflow's, so restate them; id-token
    # lets the job sign in to Google Cloud keylessly (below).
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      TYPE: ${{ matrix.type }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Keyless (workload identity federation) as ferni-ci-blog, which has only
      # roles/aiplatform.user in johnb-2025. The provider accepts only this
      # workflow on refs/heads/main, so it fails on a branch or fork run.
      # GOOGLE_API_KEY is the Gemini API key the drafter uses for text.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/1031920444452/locations/global/workloadIdentityPools/github-pool/providers/ferni-voiceai-blog-drafts
          service_account: ferni-ci-blog@johnb-2025.iam.gserviceaccount.com

      # Exits 1 when the draft still fails the brand gate after one retry.
      - name: Draft the post
        id: draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_PROJECT: johnb-2025
          GOOGLE_CLOUD_LOCATION: global
        run: |
          META="$RUNNER_TEMP/draft-meta.json"
          pnpm tsx scripts/blog/draft-post.ts --type "$TYPE" --meta-out "$META"
          echo "status=$(jq -r .status "$META")" >> "$GITHUB_OUTPUT"
          echo "path=$(jq -r '.path // empty' "$META")" >> "$GITHUB_OUTPUT"

      # Records the verdict instead of failing here: a failed draft still gets a
      # (draft) PR so a person can fix it, and the PR step fails the job.
      - name: Brand gate and live check
        id: gate
        if: steps.draft.outputs.status == 'written'
        continue-on-error: true
        env:
          DRAFT: ${{ steps.draft.outputs.path }}
        run: pnpm tsx scripts/blog/check-post.ts "$DRAFT" --meta "$RUNNER_TEMP/draft-meta.json" --live

      # Consumer posts only: the developer portal has no hero images. Vertex AI
      # through the keyless credentials above. No Gemini API key is passed:
      # image models need a billed project, and that key isn't known to have
      # one. gemini-3-pro-image is served from the global location. A failure
      # doesn't stop the PR: the PR step opens it as an unarmed draft, says
      # the image is missing in the PR body and the job summary, and fails the job.
      - name: Hero image
        id: hero
        if: steps.draft.outputs.status == 'written' && !contains(steps.draft.outputs.path, '/developers-portal/')
        continue-on-error: true
        env:
          DRAFT: ${{ steps.draft.outputs.path }}
          GOOGLE_CLOUD_PROJECT: johnb-2025
          GOOGLE_CLOUD_LOCATION: global
        run: |
          if pnpm tsx scripts/blog/hero-image.ts "$DRAFT" 2> "$RUNNER_TEMP/hero.err"; then exit 0; fi
          cat "$RUNNER_TEMP/hero.err" >&2
          reason=$(grep -m1 '^Hero image failed:' "$RUNNER_TEMP/hero.err" | cut -c1-400 || true)
          echo "reason=${reason:-hero-image.ts exited non-zero, see the log}" >> "$GITHUB_OUTPUT"
          echo "::error::No hero image for $DRAFT. ${reason}"
          echo "**No hero image** for \`$DRAFT\`: ${reason:-see the log}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Claude through ANTHROPIC_API_KEY (scripts/blog/judge.ts). Like the gate,
      # it records the verdict and the PR step acts on it; with no key or no
      # readable verdict the post fails. The log gets scores only; the reasons
      # go to the PR body.
      - name: Editorial judge
        id: judge
        if: steps.draft.outputs.status == 'written'
        continue-on-error: true
        env:
          DRAFT: ${{ steps.draft.outputs.path }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          pnpm tsx scripts/blog/judge-post.ts "$DRAFT" --meta "$RUNNER_TEMP/draft-meta.json" \
            --out "$RUNNER_TEMP/judge.md"

      # REST for the branch, the file and the PR; `gh pr merge --auto` (GraphQL)
      # arms auto-merge for developer posts. The repo uses a merge queue, so no
      # merge method flag. Consumer posts wait for blog-approval.yml.
      - name: Open the PR
        if: steps.draft.outputs.status == 'written'
        env:
          DRAFT: ${{ steps.draft.outputs.path }}
          REPO: ${{ github.repository }}
          HERO: ${{ steps.hero.outcome }}
          HERO_REASON: ${{ steps.hero.outputs.reason }}
          PASSED: ${{ steps.gate.outcome == 'success' && steps.hero.outcome != 'failure' && steps.judge.outcome == 'success' }}
          CONSUMER: ${{ !contains(steps.draft.outputs.path, '/developers-portal/') }}
          HAS_PR_TOKEN: ${{ secrets.BLOG_PR_TOKEN != '' }}
          GH_TOKEN: ${{ secrets.BLOG_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          META="$RUNNER_TEMP/draft-meta.json"
          file=${DRAFT#"$GITHUB_WORKSPACE/"}
          title=$(sed -n 's/^title: //p' "$DRAFT" | head -1 | jq -r .)
          day=$(date -u +%F)
          branch="blog/draft-$TYPE-$day"
          if gh api "repos/$REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
            branch="$branch-$GITHUB_RUN_ID"
          fi
          if [ "$PASSED" = true ] && [ "$CONSUMER" = true ]; then
            label=blog-needs-approval color=fbca04 about='A drafted ferni.ai post that passed the judge; publishes when the owner adds blog-approved'
          elif [ "$PASSED" = true ]; then
            label=blog-auto color=2e7d32 about='A drafted developer post that passed the gates and the judge and merges itself'
          else
            label=blog-draft color=4a6741 about='A drafted blog post that failed a gate; a person must fix it'
          fi

          base=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$base" > /dev/null
          base64 -w0 "$DRAFT" > "$RUNNER_TEMP/content.b64"
          gh api -X PUT "repos/$REPO/contents/$file" -f branch="$branch" \
            -f message="docs(blog): draft $TYPE post for $day" \
            -F content=@"$RUNNER_TEMP/content.b64" > /dev/null
          image="apps/website/ferni-website/images/blog/$(basename "$file" .md).png"
          if [ "$HERO" = success ]; then
            base64 -w0 "$image" > "$RUNNER_TEMP/image.b64"
            gh api -X PUT "repos/$REPO/contents/$image" -f branch="$branch" \
              -f message="docs(blog): hero image for the $TYPE post for $day" \
              -F content=@"$RUNNER_TEMP/image.b64" > /dev/null
          fi

          compare="$GITHUB_SERVER_URL/$REPO/compare/main...$branch?expand=1"
          if [ "$HAS_PR_TOKEN" != true ]; then
            echo "::error::Drafted $branch but there is no BLOG_PR_TOKEN secret to open its PR (see the workflow header). Open it by hand: $compare"
            echo "Drafted \`$file\` on \`$branch\`; open the PR by hand: $compare" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "A drafted **$TYPE** post: **$title** (\`$file\`)."
            echo
            if [ "$PASSED" = true ] && [ "$CONSUMER" = true ]; then
              echo "It passed the brand gate, the live check and the editorial judge. **It waits for the owner:** auto-merge is off until a repo admin adds the \`blog-approved\` label, which arms it for the commit approved. To stop it, close this PR."
            elif [ "$PASSED" = true ]; then
              echo "It passed the brand gate, the live check and the editorial judge, so auto-merge is armed and it publishes once CI is green. To stop it, disable auto-merge or close this PR."
            else
              echo "**It failed the brand gate, the live check, the editorial judge or the hero image**, so this PR is a draft and auto-merge is off. The judge's reasons are below; the [run log]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID) has the gate's rule codes only, so run \`pnpm tsx scripts/blog/check-post.ts $file --live --details\` locally for its details. Fix the post, mark the PR ready and merge it, or close it."
            fi
            echo
            echo "The brand gate: no forbidden words, em dashes, ellipses, retired-stack names, unlabelled composites or numbers missing from the sources. The live check: every source and every cited PR is merged, not behind an off-by-default flag, and touches only the web app or website or was merged at least 7 days ago."
            echo
            case "$HERO" in
              success) echo "**Hero image:** \`$image\`, generated by Gemini (Nano Banana) from the title and excerpt with the brand illustration template. It should be on-palette line art on cream, no text, no faces, no logos. To replace it: \`pnpm tsx scripts/blog/hero-image.ts $file --force\` and push." ;;
              failure) echo "**No hero image: generation failed.** ${HERO_REASON} Make one with \`pnpm tsx scripts/blog/hero-image.ts $file\` (needs GOOGLE_CLOUD_PROJECT and Google credentials with Vertex AI access, or a billed GEMINI_API_KEY) and push it here, then mark the PR ready." ;;
              *) echo "Developer posts have no hero image." ;;
            esac
            echo
            if [ -s "$RUNNER_TEMP/judge.md" ]; then
              cat "$RUNNER_TEMP/judge.md"
            else
              echo "### Editorial judge: did not run"
            fi
            echo
            echo "### Sources"
            jq -r '.sources[] | "- " + .' "$META"
            echo
            echo "_Drafted by [Blog Drafts]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID)._"
          } > "$RUNNER_TEMP/body.md"

          # The draft jobs run in parallel, so another job may create the label
          # between the check and the create; only fail if it still doesn't exist.
          gh api "repos/$REPO/labels/$label" > /dev/null 2>&1 ||
            gh api -X POST "repos/$REPO/labels" -f name="$label" -f color="$color" \
              -f description="$about" > /dev/null 2>&1 ||
            gh api "repos/$REPO/labels/$label" > /dev/null

          draft=$([ "$PASSED" = true ] && echo false || echo true)
          pr=$(gh api -X POST "repos/$REPO/pulls" -f base=main -f head="$branch" -F draft="$draft" \
            -f title="docs(blog): $TYPE post for $day" -F body=@"$RUNNER_TEMP/body.md" -q .number)
          gh api -X POST "repos/$REPO/issues/$pr/labels" -f "labels[]=$label" > /dev/null

          if [ "$PASSED" != true ]; then
            echo "::error::The $TYPE draft failed the brand gate, the live check, the judge or the hero image. Opened #$pr as a draft, not armed."
            echo "Opened #$pr from $branch as a draft: it failed a gate, so it won't publish" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CONSUMER" = true ]; then
            echo "Opened #$pr from $branch; it publishes when the owner adds blog-approved" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$pr" --auto --repo "$REPO"
          echo "Opened #$pr from $branch with auto-merge armed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Nothing to draft
        if: steps.draft.outputs.status == 'nothing-to-draft'
        run: echo "Nothing to write a $TYPE post about (no fitting merged PRs, or the drafter skipped); no PR opened." | tee -a "$GITHUB_STEP_SUMMARY"

  # The weekly run (Mondays, or a manual "weekly") keeps one issue labelled
  # blog-weekly-failed: opened (or commented on) when a job fails, saying which
  # step failed and which draft PRs are waiting on a person, and closed by the
  # next run that succeeds. It never retries a draft: a draft that failed a
  # gate must not publish without a person.
  weekly-status:
    name: Weekly status issue
    needs: [plan, draft]
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event.inputs.type == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # this run's jobs and steps
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PLAN: ${{ needs.plan.result }}
      DRAFT: ${{ needs.draft.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the blog-weekly-failed issue
        run: |
          set -euo pipefail
          label=blog-weekly-failed
          gh api "repos/$REPO/labels/$label" > /dev/null 2>&1 ||
            gh api -X POST "repos/$REPO/labels" -f name="$label" -f color=b60205 \
              -f description='The weekly blog run failed; closes on the next good run' > /dev/null
          issue=$(gh issue list --repo "$REPO" --label "$label" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          day=$(date -u +%F)

          if [ "$PLAN" = success ] && [ "$DRAFT" = success ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$REPO" --comment "The weekly run on $day succeeded ([run]($RUN_URL)), so closing this."
            fi
            echo "Weekly run succeeded" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "The weekly blog run on $day failed ([run]($RUN_URL)). Choose post types: $PLAN; drafts: $DRAFT."
            echo
            echo "### What failed"
            gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" --jq '
              .jobs[] | select(.conclusion == "failure")
              | "- [\(.name)](\(.html_url)): \([.steps[] | select(.conclusion == "failure") | .name] | join(", "))"'
            echo
            echo "### Drafts waiting on a person"
            drafts=$(gh pr list --repo "$REPO" --label blog-draft --state open \
              --json number,title --jq '.[] | "- #\(.number) \(.title)"')
            echo "${drafts:-None open.}"
            echo
            echo "### Posts waiting for the owner's blog-approved label"
            waiting=$(gh pr list --repo "$REPO" --label blog-needs-approval --state open \
              --json number,title --jq '.[] | "- #\(.number) \(.title)"')
            echo "${waiting:-None open.}"
            echo
            echo "A draft that failed the brand gate or the live check is a draft PR without auto-merge; it publishes only if a person fixes and merges it. This issue closes itself on the next weekly run that succeeds."
          } > "$RUNNER_TEMP/issue.md"

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPO" --body-file "$RUNNER_TEMP/issue.md"
            echo "Commented on #$issue" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create --repo "$REPO" --title "Weekly blog run failed" --label "$label" \
              --body-file "$RUNNER_TEMP/issue.md")
            echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
