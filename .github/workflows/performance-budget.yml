name: Performance Budget

# Fails a PR that grows the frontend bundle (scripts/ci/bundle-growth.sh)
# Runs on PRs to catch regressions before merge

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

env:
  # How much a PR may grow the total bundle or its largest chunk (in KB)
  MAX_GROWTH_KB: 50

jobs:
  check-bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Compare bundle with base
        id: bundle
        run: |
          set -o pipefail
          scripts/ci/bundle-growth.sh ${{ github.event.pull_request.base.sha }} | tee report.md
          cat report.md >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: always() && steps.bundle.outcome != 'skipped'
        # The report is in the job summary; a token without write access
        # must not fail the check
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('report.md') ? fs.readFileSync('report.md', 'utf8') : '';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Bundle Size Report\n\n${report}`
            });
