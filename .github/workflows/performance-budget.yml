name: Performance Budget

# Checks bundle size and fails PR if it exceeds budget
# Runs on PRs to catch regressions before merge

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/performance-budget.yml'

env:
  # Gzipped JS budgets (KB), set to the size on 2026-09-30 (1771 KB total,
  # 535 KB largest chunk) rounded up to the next 10 KB. Lower them as the
  # bundle shrinks; raising them should be a deliberate choice.
  MAX_BUNDLE_SIZE_KB: 1780
  MAX_CHUNK_SIZE_KB: 540

permissions:
  contents: read
  pull-requests: write

jobs:
  check-bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build frontend
        # apps/web's build script builds the design-system tokens first
        run: pnpm --dir apps/web build

      - name: Analyze bundle size
        id: bundle
        # Gzipped JavaScript only: what browsers download for code. Fonts,
        # images and source maps are not counted.
        run: |
          cd apps/web/dist
          find . -name "*.js" -print0 | while IFS= read -r -d '' f; do
            echo "$(gzip -c "$f" | wc -c) $f"
          done | sort -rn > /tmp/js-gzip-sizes.txt

          TOTAL_KB=$(awk '{s+=$1} END {printf "%d", s/1024}' /tmp/js-gzip-sizes.txt)
          LARGEST_KB=$(head -1 /tmp/js-gzip-sizes.txt | awk '{printf "%d", $1/1024}')
          echo "total_kb=$TOTAL_KB" >> $GITHUB_OUTPUT
          echo "largest_chunk_kb=$LARGEST_KB" >> $GITHUB_OUTPUT

          {
            echo "## Bundle Analysis (gzipped JS)"
            echo ""
            echo "| File | Gzipped (KB) |"
            echo "|------|--------------|"
            head -10 /tmp/js-gzip-sizes.txt | awk '{printf "| %s | %d |\n", $2, $1/1024}'
            echo ""
            echo "**Total: ${TOTAL_KB} KB** across $(wc -l < /tmp/js-gzip-sizes.txt) files"
          } >> $GITHUB_STEP_SUMMARY

      - name: Check budget
        run: |
          TOTAL=${{ steps.bundle.outputs.total_kb }}
          LARGEST=${{ steps.bundle.outputs.largest_chunk_kb }}
          MAX_TOTAL=${{ env.MAX_BUNDLE_SIZE_KB }}
          MAX_CHUNK=${{ env.MAX_CHUNK_SIZE_KB }}

          FAILED=false

          if [ "$TOTAL" -gt "$MAX_TOTAL" ]; then
            echo "❌ Total bundle size (${TOTAL}KB) exceeds budget (${MAX_TOTAL}KB)"
            FAILED=true
          else
            echo "✅ Total bundle size: ${TOTAL}KB (budget: ${MAX_TOTAL}KB)"
          fi

          if [ "$LARGEST" -gt "$MAX_CHUNK" ]; then
            echo "❌ Largest chunk (${LARGEST}KB) exceeds budget (${MAX_CHUNK}KB)"
            FAILED=true
          else
            echo "✅ Largest chunk: ${LARGEST}KB (budget: ${MAX_CHUNK}KB)"
          fi

          if [ "$FAILED" = true ]; then
            echo ""
            echo "💡 Tips to reduce bundle size:"
            echo "  - Use dynamic imports for large dependencies"
            echo "  - Check for duplicate dependencies"
            echo "  - Remove unused code with tree-shaking"
            exit 1
          fi

      - name: Comment on PR
        if: always()
        # Advisory: a comment that can't be posted must not fail the job
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const total = '${{ steps.bundle.outputs.total_kb }}';
            const largest = '${{ steps.bundle.outputs.largest_chunk_kb }}';
            const maxTotal = '${{ env.MAX_BUNDLE_SIZE_KB }}';
            const maxChunk = '${{ env.MAX_CHUNK_SIZE_KB }}';

            const totalOk = parseInt(total) <= parseInt(maxTotal);
            const chunkOk = parseInt(largest) <= parseInt(maxChunk);

            const body = `## 📦 Bundle Size Report

            | Metric | Value | Budget | Status |
            |--------|-------|--------|--------|
            | Total JS (gzipped) | ${total} KB | ${maxTotal} KB | ${totalOk ? '✅' : '❌'} |
            | Largest chunk (gzipped) | ${largest} KB | ${maxChunk} KB | ${chunkOk ? '✅' : '❌'} |

            ${totalOk && chunkOk ? '✅ All performance budgets passed!' : '❌ Performance budget exceeded - please optimize before merging.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
