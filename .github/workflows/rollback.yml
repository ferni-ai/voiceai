name: Rollback Production

# Quick rollback to a previous revision
# Can rollback to:
# - Previous revision (default)
# - Specific revision by name
# - Specific commit SHA

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rollback'
        required: true
        type: choice
        options:
          - voice-agent
          - ui-server
          - all
      target:
        description: 'Rollback target (leave empty for previous, or enter revision/sha)'
        required: false
        type: string
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  DORA_API_URL: ${{ secrets.DORA_API_URL || 'https://ferni.ai/api/dora' }}

jobs:
  # ============================================================================
  # ROLLBACK VOICE AGENT (LiveKit Cloud): manual, by design
  # ============================================================================
  # The voice agent runs on LiveKit Cloud (prod agent CA_GeFvEpsNXLSF in project
  # ferni-prod). The GCE VM voiceai-agent-gce no longer runs, and the ferni
  # CLI's agent rollback refuses (#1730). A rollback restarts the agent and cuts live callers
  # off, so a person checks rooms=0 and runs `lk agent rollback`. The gated
  # chain is in .claude/skills/deploy-agent/SKILL.md. This job prints the steps
  # and fails so the run is never reported as a completed rollback.
  # ============================================================================
  rollback-voice-agent:
    name: Rollback Voice Agent (LiveKit Cloud, manual)
    runs-on: ubuntu-latest
    if: ${{ inputs.service == 'voice-agent' || inputs.service == 'all' }}
    outputs:
      previous_revision: ${{ steps.rollback.outputs.previous }}
      new_revision: ${{ steps.rollback.outputs.revision }}

    steps:
      - name: ⛔ Voice agent rollback is manual (lk agent rollback)
        id: rollback
        env:
          TARGET: ${{ inputs.target }}
        run: |
          {
            echo "## ⛔ Voice agent rollback is manual"
            echo ""
            echo "Run from a clean checkout of origin/main. Full gated chain: .claude/skills/deploy-agent/SKILL.md"
            echo ""
            echo '```bash'
            echo 'P=ferni-prod; C="$(git rev-parse --show-toplevel)/livekit.prod-cloud.toml"   # absolute path'
            echo 'lk agent versions --project $P --config "$C"    # find the last good version id'
            echo ''
            echo '# Rule: rooms must be 0 first; a rollback restarts the agent and cuts live callers off.'
            echo 'ROOMS=$(lk room list --project $P 2>&1) \'
            echo '  && echo "$ROOMS" | grep -q "Using project \[$P\]" \'
            echo '  && [ "$(echo "$ROOMS" | grep -c "│ RM_")" = 0 ] \'
            echo "  && lk agent rollback --project \$P --config \"\$C\" --version ${TARGET:-<id>}"
            echo ''
            echo 'lk agent versions --project $P --config "$C"    # ✓ Production must show that version'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "previous=manual-rollback-required" >> $GITHUB_OUTPUT
          echo "revision=manual-rollback-required" >> $GITHUB_OUTPUT
          exit 1

  # ============================================================================
  # ROLLBACK UI SERVER
  # ============================================================================
  rollback-ui-server:
    name: Rollback UI Server
    runs-on: ubuntu-latest
    if: ${{ inputs.service == 'ui-server' || inputs.service == 'all' }}
    # Its own group, not deploy-production's: GitHub keeps one pending run per
    # group, so a later deploy would replace (cancel) a pending rollback. The
    # deploy freeze below keeps deploys off instead.
    concurrency:
      group: prod-rollback
      cancel-in-progress: false
    permissions:
      contents: write  # the deploy-freeze tag
    outputs:
      previous_revision: ${{ steps.current.outputs.revision }}
      new_revision: ${{ steps.rollback.outputs.revision }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Get current revision
        id: current
        run: |
          CURRENT=$(gcloud run services describe john-bogle-ui \
            --region=${{ env.GCP_REGION }} \
            --format="value(status.traffic[0].revisionName)")
          echo "revision=$CURRENT" >> $GITHUB_OUTPUT

      - name: Find rollback target
        id: target
        run: |
          TARGET="${{ inputs.target }}"
          
          if [ -z "$TARGET" ]; then
            TARGET=$(gcloud run revisions list \
              --service=john-bogle-ui \
              --region=${{ env.GCP_REGION }} \
              --format="value(REVISION)" \
              --limit=2 | tail -1)
          elif [[ "$TARGET" =~ ^[a-f0-9]{8,40}$ ]]; then
            SHORT_SHA=${TARGET:0:8}
            TARGET=$(gcloud run revisions list \
              --service=john-bogle-ui \
              --region=${{ env.GCP_REGION }} \
              --format="value(REVISION)" \
              --filter="name~$SHORT_SHA" \
              --limit=1)
          fi
          
          if [ -z "$TARGET" ]; then
            echo "Could not find rollback target!"
            exit 1
          fi
          
          echo "revision=$TARGET" >> $GITHUB_OUTPUT

      # Freeze automatic deploys BEFORE moving traffic. Main's tip is still the
      # commit being rolled back, and the next automatic deploy would put it
      # straight back (scripts/ci/deploy-freeze.sh). A deploy already running
      # re-checks the freeze right before its own traffic shift and stops; the
      # pause lets one that passed that check a moment ago land first, so this
      # rollback has the last word. Unfreeze deliberately afterwards
      # (deploy-production with unfreeze: true and a reason).
      - name: Freeze automatic deploys
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          # Never block a rollback on the freeze: if it can't be set, roll back anyway and say so loudly.
          bash scripts/ci/deploy-freeze.sh set "rollback.yml by $GITHUB_ACTOR: $REASON" \
            || echo "::error::Could not set the deploy freeze; rolling back anyway. The next automatic deploy may undo this rollback: freeze by hand (git tag -a deploy-freeze -m '<reason>' && git push origin deploy-freeze)."
          sleep 30

      - name: Rollback traffic
        id: rollback
        run: |
          gcloud run services update-traffic john-bogle-ui \
            --region=${{ env.GCP_REGION }} \
            --to-revisions=${{ steps.target.outputs.revision }}=100
          
          echo "revision=${{ steps.target.outputs.revision }}" >> $GITHUB_OUTPUT

      - name: Verify rollback
        run: |
          sleep 10
          URL=$(gcloud run services describe john-bogle-ui \
            --region=${{ env.GCP_REGION }} \
            --format="value(status.url)")
          
          curl -sf "$URL/health" > /dev/null && echo "Health check passed!" || echo "Warning: Health check failed"

      - name: Confirm traffic stayed on the rollback target
        env:
          TARGET: ${{ steps.target.outputs.revision }}
        run: bash scripts/ci/confirm-rollback-traffic.sh "$TARGET"

  # ============================================================================
  # TRACK ROLLBACK
  # ============================================================================
  track-rollback:
    name: Track Rollback
    runs-on: ubuntu-latest
    needs: [rollback-voice-agent, rollback-ui-server]
    if: always()
    
    steps:
      - name: Record rollback deployment
        run: |
          # Record as a deployment with rollback flag
          curl -X POST "${{ env.DORA_API_URL }}/deployments" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DORA_API_KEY }}" \
            -d '{
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "commitSha": "rollback-${{ github.run_id }}",
              "commitMessage": "ROLLBACK: ${{ inputs.reason }}",
              "branch": "main",
              "environment": "production",
              "duration": 60,
              "success": true,
              "triggeredBy": "${{ github.actor }}",
              "buildId": "${{ github.run_id }}",
              "rollback": true,
              "metadata": {
                "reason": "${{ inputs.reason }}",
                "service": "${{ inputs.service }}",
                "target": "${{ inputs.target }}"
              }
            }' || echo "Failed to track rollback"

      - name: Create rollback incident
        run: |
          curl -X POST "${{ env.DORA_API_URL }}/incidents" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DORA_API_KEY }}" \
            -d '{
              "title": "Rollback triggered: ${{ inputs.reason }}",
              "severity": "major",
              "startedAt": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "affectedServices": ["${{ inputs.service }}"],
              "resolution": "Rolled back to previous revision"
            }' || echo "Failed to create incident"

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [rollback-voice-agent, rollback-ui-server, track-rollback]
    if: always()
    
    steps:
      - name: Create summary
        run: |
          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Service | Status | From | To |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|------|-----|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.rollback-voice-agent.result }}" != "skipped" ]]; then
            if [[ "${{ needs.rollback-voice-agent.result }}" == "success" ]]; then
              echo "| Voice Agent | ✅ Rolled back | ${{ needs.rollback-voice-agent.outputs.previous_revision }} | ${{ needs.rollback-voice-agent.outputs.new_revision }} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Voice Agent | ❌ Failed | - | - |" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          if [[ "${{ needs.rollback-ui-server.result }}" != "skipped" ]]; then
            if [[ "${{ needs.rollback-ui-server.result }}" == "success" ]]; then
              echo "| UI Server | ✅ Rolled back | ${{ needs.rollback-ui-server.outputs.previous_revision }} | ${{ needs.rollback-ui-server.outputs.new_revision }} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| UI Server | ❌ Failed | - | - |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

