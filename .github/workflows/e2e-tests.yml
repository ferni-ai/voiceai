name: E2E Tests

# PRs: the repo's offline Playwright suite (apps/web/tests/e2e) against the
#   Vite dev server that playwright.config.ts starts. Backend calls are mocked
#   in tests/e2e/fixtures.ts, so nothing leaves the runner.
# Deploys / manual runs: production smoke tests (apps/web/tests/smoke) against
#   TEST_URL with playwright.smoke.config.ts.

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'design-system/**'
      - '.github/workflows/e2e-tests.yml'
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to smoke test (default: production)'
        required: false
        default: 'https://ferni-prod.web.app'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Playwright (offline suite)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Run offline E2E suite
        run: pnpm --dir apps/web exec playwright test --project=chromium --reporter=github,html

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-offline
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Comment on PR
        if: failure()
        # Advisory: fork PRs get a read-only token
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ E2E tests failed. [View report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            });

  smoke:
    name: Playwright (production smoke)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_URL: ${{ inputs.url || 'https://ferni-prod.web.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm --dir apps/web exec playwright test --config playwright.smoke.config.ts

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## 🎭 Production smoke tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test URL: $TEST_URL" >> $GITHUB_STEP_SUMMARY
