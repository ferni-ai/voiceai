name: Rust Native Modules

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/rust-perf/**'
      - 'apps/rust-audio/**'
      - 'apps/sonata/**'
      - '.github/workflows/rust-native.yml'
      - 'scripts/cargo-test-napi.sh'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/rust-perf/**'
      - 'apps/rust-audio/**'
      - 'apps/sonata/**'
      - '.github/workflows/rust-native.yml'
      - 'scripts/cargo-test-napi.sh'

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # RUST TESTS (Fast - runs on Linux only)
  # ============================================================================
  test:
    name: Test Rust Crates
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/rust-perf/target/
            apps/rust-audio/target/
            apps/sonata/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Full unit tests, NAPI bindings included. The test binary is linked with
      # napi_* symbols left unresolved (tests never call into Node); see the
      # script. Before 2026-09-29 these only ran `cargo check` with
      # continue-on-error, and two live-path bugs (AGC time constants, YIN
      # on short frames) sat behind tests that had never run.
      - name: Test rust-audio
        run: scripts/cargo-test-napi.sh apps/rust-audio
        timeout-minutes: 15

      - name: Test rust-perf
        run: scripts/cargo-test-napi.sh apps/rust-perf -- --test-threads=1
        timeout-minutes: 15

      # Sonata needs pre-built pocket-voice cdylibs that this job does not
      # build, so its tests cannot link here. Informational only.
      # Sonata: NAPI bindings for pocket-voice STT/TTS
      # --no-default-features disables NAPI so tests can build without Node.js bindings
      - name: Test sonata (unit tests)
        working-directory: apps/sonata
        run: cargo test --no-default-features --lib -- --test-threads=1
        timeout-minutes: 5
        continue-on-error: true

  # ============================================================================
  # BUILD NATIVE MODULES (Multi-platform matrix)
  # ============================================================================
  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (production - GCE); follows CI_RUNNER like the other CI jobs
          - os: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
            target: x86_64-unknown-linux-gnu
            node_arch: linux-x64

          # macOS ARM64 (development - M-series Macs)
          - os: macos-latest
            target: aarch64-apple-darwin
            node_arch: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/rust-perf/target/
            apps/rust-audio/target/
            apps/sonata/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install napi-cli
        run: pnpm add -g @napi-rs/cli

      # Build rust-perf
      - name: Build rust-perf
        working-directory: apps/rust-perf
        run: |
          pnpm install
          napi build --platform --release --target ${{ matrix.target }}

      # Build rust-audio
      - name: Build rust-audio
        working-directory: apps/rust-audio
        run: |
          pnpm install
          napi build --platform --release --target ${{ matrix.target }}

      # Build sonata (pocket-voice STT/TTS NAPI bindings)
      # Note: pocket-voice cdylibs (STT/TTS) must be pre-built.
      # On Linux (CI), use --no-default-features for pocket-voice crates to skip Metal GPU.
      - name: Build sonata
        working-directory: apps/sonata
        run: |
          pnpm install
          napi build --platform --release --target ${{ matrix.target }}
        continue-on-error: true

      # Upload artifacts
      - name: Upload rust-perf artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-perf-${{ matrix.node_arch }}
          path: apps/rust-perf/*.node
          if-no-files-found: error

      - name: Upload rust-audio artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-audio-${{ matrix.node_arch }}
          path: apps/rust-audio/*.node
          if-no-files-found: error

      - name: Upload sonata artifact
        uses: actions/upload-artifact@v7
        with:
          name: sonata-${{ matrix.node_arch }}
          path: apps/sonata/*.node
          if-no-files-found: warn

  # ============================================================================
  # VERIFY INTEGRATION (Test that bindings work in Node.js)
  # ============================================================================
  verify:
    name: Verify Node.js Integration
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Download rust-perf artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-perf-linux-x64
          path: apps/rust-perf/

      - name: Download rust-audio artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-audio-linux-x64
          path: apps/rust-audio/

      - name: Download sonata artifact
        uses: actions/download-artifact@v8
        with:
          name: sonata-linux-x64
          path: apps/sonata/
        continue-on-error: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify rust-perf loads
        run: node -e "const p = require('./apps/rust-perf'); console.log('rust-perf exports:', Object.keys(p).length);"

      - name: Verify rust-audio loads
        run: node -e "const a = require('./apps/rust-audio'); console.log('rust-audio exports:', Object.keys(a).length);"

      - name: Verify sonata loads
        run: |
          node -e "
            try {
              const sonata = require('./apps/sonata');
              console.log('sonata exports:', Object.keys(sonata));
              console.log('✅ @ferni/sonata verified');
            } catch (e) {
              console.log('⚠️ sonata verification skipped:', e.message);
            }
          "
        continue-on-error: true

      - name: Verify native module APIs
        run: |
          node -e "
            const perf = require('./apps/rust-perf');

            // Verify @ferni/perf core functions exist
            const expectedPerf = ['getLibraryInfo', 'cosineSimilarity', 'batchCosineSimilarity'];
            for (const fn of expectedPerf) {
              if (typeof perf[fn] !== 'function') {
                throw new Error('@ferni/perf missing function: ' + fn);
              }
            }

            // Verify library info structure
            const info = perf.getLibraryInfo();
            if (!info.version || typeof info.simdAvailable !== 'boolean') {
              throw new Error('Invalid @ferni/perf library info');
            }

            console.log('✅ @ferni/perf verified:', info.version, 'SIMD:', info.simdAvailable);
          "

      - name: Verify rust-audio APIs
        run: |
          node -e "
            const audio = require('./apps/rust-audio');
            const need = ['getLibraryInfo', 'fftF32', 'applyHanningWindow', 'analyzeSpectrum', 'estimatePitchYin', 'NativePostTtsProcessor', 'NativePreSttProcessor'];
            for (const fn of need) {
              if (typeof audio[fn] !== 'function') throw new Error('@ferni/audio missing: ' + fn);
            }

            // FFT field names match the TypeScript interface
            const tone = (n, hz, rate) => Float32Array.from({ length: n }, (_, i) => Math.sin(2 * Math.PI * hz * i / rate));
            const spec = audio.analyzeSpectrum(tone(256, 440, 44100), 44100);
            for (const k of ['centroid', 'rolloff', 'dominantFrequency', 'dominantMagnitude', 'bandEnergies']) {
              if (spec[k] === undefined) throw new Error('analyzeSpectrum missing field ' + k);
            }
            if (spec.bandEnergies.length !== 7) throw new Error('bandEnergies should have 7 bands');

            // YIN finds pitch in the 512-sample windows the live analyzer uses
            // (it returned no pitch for frames under 640 samples until 2026-09-29)
            const yin = audio.estimatePitchYin(tone(512, 200, 16000), 16000, 50, 400);
            if (Math.abs(yin.pitchHz - 200) > 10) throw new Error('YIN on 512 samples gave ' + yin.pitchHz);

            // The post-TTS chain turns a speech-level frame into audio, not silence or NaN
            const post = new audio.NativePostTtsProcessor({ sampleRate: 24000 });
            const frame = tone(480, 180, 24000).map((x) => x * 0.3);
            post.processFrame(frame, false);
            post.processFrame(frame, false);
            if (!frame.every(Number.isFinite)) throw new Error('post-TTS produced non-finite samples');
            if (Math.max(...frame.map(Math.abs)) < 0.01) throw new Error('post-TTS produced silence');

            console.log('✅ @ferni/audio verified: FFT fields, YIN at 512 samples =', yin.pitchHz.toFixed(1), 'Hz, post-TTS frame ok');
          "

      - name: Run native FFT E2E tests
        run: pnpm vitest run src/speech/fft-analyzer/__tests__/native-fft-e2e.test.ts --reporter=verbose
        env:
          NODE_ENV: test
