# TEMPORARY: verifies the voice agent image builds on a GitHub-hosted runner
# after freeing disk. No credentials, no push. Delete before merging.
name: TMP verify voice image build
on:
  push:
    branches: [ci/free-disk-voice-image]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      - name: Build image (no push)
        run: |
          docker build --file docker/Dockerfile.agent --tag verify/ferni-voice-agent:test --build-arg NODE_VERSION=20 .
          df -h /
