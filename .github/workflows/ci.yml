name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'apps/**'
      - 'packages/**'
      - 'design-system/**'
      # Tested from src/tests (voice-eval scoring, the agent Dockerfile): a PR touching
      # only these never got the required checks and could not merge.
      - 'scripts/**'
      - 'docker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      # Build and CI config: a change here can break CI or the images, and a PR
      # touching only these never got the required checks, so it could not merge.
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'patches/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/Dockerfile*'
      # Shapes the UI image's build context. Prod web deploys start from this
      # push run's verdict (deploy-production.yml), so it must run on it.
      - '.dockerignore'
      - 'cloudbuild*.yaml'
      - 'infra/**'
      # The web server's env and secrets (deploy/ui-server/). A flag flip that
      # edits only these must still get a push run, or nothing deploys it.
      - 'deploy/**'
  pull_request:
    branches: [main, develop]
    # No path filter on PRs: branch protection requires these checks, so a PR
    # they skip can never merge (docs, .claude/, dependabot.yml PRs all stuck).
    # PR runs are the fast checks only: Lint & Type Check, Frontend Quality, Unit
    # Tests, Security Scan, Quality Gates. Integration Tests, Build and the other
    # slow jobs skip on pull_request (a skipped job still reports its check), so PR
    # runs stop starving the merge queue for runners. The queue runs the required
    # checks only. AGI Feature Tests, Build, Code Quality Metrics, Validation, E2E
    # Validation and Dependency Check are required by nothing: they run on every push
    # to main, even when queue-tested skips the required suite, and nightly; and
    # nightly-health.yml opens a main-red issue when the push run fails
    # (src/tests/deploy/merge-queue-jobs.test.ts).
  # The merge queue tests each PR on top of main and whatever is queued ahead of it.
  merge_group:
  # Once a night the whole suite runs on main, whatever changed. The queue and pushes
  # skip jobs a change can't reach (setup's code/node scoping), which is right only if
  # the exclude patterns are right; this catches it when they aren't. A failure opens a
  # ci-health issue (nightly-health.yml).
  schedule:
    - cron: '41 6 * * *'

# A new push to a PR supersedes its running checks. Merge-queue entries and pushes to
# main always finish: cancelling one drops the queue entry or main's only verdict.
# Pushes share one group per branch, so a running main build finishes but only the
# newest waiting one is kept: its verdict covers every commit before it. Before this,
# each merge queued its own full run and 87 waited at once, holding the runners the
# merge queue needed (2026-10-11).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max-old-space-size=3072'

jobs:
  # ============================================================================
  # SETUP - Shared dependency installation and caching
  # ============================================================================
  # runs-on comes from the CI_RUNNER repo variable (a JSON label list), falling back
  # to ubuntu-latest when it is unset (the default). Setting it to
  # ["self-hosted","Linux","X64","gce"] moves CI to the github-runner VM, an
  # emergency fallback for when hosted runners are unavailable. If that VM is
  # While CI_RUNNER is set, pull_request jobs use CI_PR_RUNNER instead when it is
  # set (["self-hosted","Linux","X64","gce","pr"]). Only half the runners carry
  # the "pr" label, so PR checks can never take every runner and merge-queue runs,
  # which ask only for CI_RUNNER's labels, always have runners free. Without it,
  # PR runs filled all 16 and queue checks waited past the queue's timeout
  # (2026-10-11). Unsetting CI_RUNNER alone returns every job to hosted runners.
  # If that VM is stopped, UNSET the variable: a job waiting
  # for a runner is not covered by timeout-minutes, so with no runner online every
  # run sits in GitHub's 24h queue and is cancelled with no verdict (2026-07).
  # Deploys never run on it, because PR code on that VM has docker (root) access
  # and must not share a host with deploy credentials. The VM's identity is
  # github-runner-ci (log/metric write only).
  #
  # Setup also decides what a PR touched. Docs-only PRs skip the heavy jobs; the
  # merge queue and pushes always run everything. A required job is skipped with
  # a job-level `if:` (a skipped job reports success), never a `paths:` filter
  # (its check never reports and the PR waits forever). The integration matrix is
  # the exception, see test-integration.
  setup:
    name: Setup & Cache Dependencies
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read # queue-tested lists merge-queue runs
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      # 'false' only when a PR touches nothing but docs/, scripts/voice-eval/ and
      # markdown outside the code trees (persona bundles load src/**/*.md at runtime)
      code: ${{ steps.code.outputs.matched }}
      # ARCHITECTURE.md is root markdown, so `code` ignores it; this output still runs
      # `pnpm docs:map --check` (Quality Gates) when only it or its generator changes.
      arch-map: ${{ steps.arch-map.outputs.matched }}
      # 'false' also when a PR touches only apps that aren't the Node app (website,
      # ios-native, android-twa, macos-menubar): none is in the UI image, ESLint
      # ignores apps/**, and none has .ts, so the test, lint and build jobs can't
      # see the change. Security and Quality Gates (brand scans the website) stay on
      # `code`. The merge queue is scoped the same way unless CI_SCOPED_QUEUE=off.
      # On a push to main whose exact tree a successful merge-queue run already
      # tested, the Node suite is skipped too (queue-tested; Security and Quality
      # Gates still run). Admin merges and direct pushes always get the full suite.
      node: ${{ steps.queue.outputs.tested == 'true' && 'false' || steps.node.outputs.matched }}
      queue-run: ${{ steps.queue.outputs.run-id }}
      # voice-eval scripts are tested by Unit Tests (src/tests/voice-eval)
      voice-eval: ${{ steps.queue.outputs.tested == 'true' && 'false' || steps.voice-eval.outputs.matched }}
      # the web app, design system or brand changed (Overlay Gallery)
      web: ${{ steps.web.outputs.matched }}
      # 'false' only when this PR's diff hits none of vitest.config.unit.ts's
      # forceRerunTriggers, so `vitest --changed` runs just the affected unit tests
      # (see test-unit-shard). Empty on other events.
      unit-full-suite: ${{ steps.unit-full.outputs.needed }}
      # How many unit test files `--changed` selects, and whether that is too many for
      # one shard ('true': run the affected set on four shards, as the whole suite is).
      # Counted only on a PR that runs the affected tests; empty otherwise, which the
      # shard matrix reads as 'not sharded' (a full run is four shards anyway).
      unit-affected-count: ${{ steps.unit-affected.outputs.count }}
      unit-affected-sharded: ${{ steps.unit-affected.outputs.sharded }}
      # 'true' when a PR touches crisis-safety or memory code, which then gets the
      # whole unit suite on four shards, as the ci:full-tests label does. Only
      # 'false' on a PR that touches none of those paths.
      full-tests: ${{ steps.risky.outputs.matched }}
    steps:
      # Two commits on a pull request (the merge commit and its base) for the unit
      # trigger check below; the pr-changes steps list files through the API.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Did code change?
        id: code
        uses: ./.github/actions/pr-changes
        with:
          exclude: '^docs/|^scripts/voice-eval/|^[^/]+\.md$|^\.(github|claude)/.+\.md$'
          merge-group: ${{ vars.CI_SCOPED_QUEUE != 'off' }}

      - name: Did the architecture map or its generator change?
        id: arch-map
        uses: ./.github/actions/pr-changes
        with:
          include: '^(ARCHITECTURE\.md|apps/cli/src/commands/quality/(docs-map|architecture-layers)\.ts)$'
          merge-group: ${{ vars.CI_SCOPED_QUEUE != 'off' }}

      - name: Did the Node app change?
        id: node
        uses: ./.github/actions/pr-changes
        with:
          exclude: '^docs/|^scripts/voice-eval/|^[^/]+\.md$|^\.(github|claude)/.+\.md$|^apps/(website|ios-native|android-twa|macos-menubar)/'
          merge-group: ${{ vars.CI_SCOPED_QUEUE != 'off' }}

      - name: Did the merge queue already test this tree?
        id: queue
        uses: ./.github/actions/queue-tested

      - name: Did voice-eval scripts change?
        id: voice-eval
        uses: ./.github/actions/pr-changes
        with:
          include: '^scripts/voice-eval/'
          merge-group: ${{ vars.CI_SCOPED_QUEUE != 'off' }}

      - name: Did the web app, design system or brand change?
        id: web
        uses: ./.github/actions/pr-changes
        with:
          include: '^(apps/web/|design-system/|brand/|\.github/workflows/ci\.yml$)'

      # Crisis-safety and memory code: a PR touching it runs the whole unit suite,
      # not just the tests whose imports reach the diff. #2717 (crisis safety) went
      # green on shard 1 alone, and a ci:full-tests label added after CI starts
      # does not re-run it. Pinned by src/tests/ci/merge-queue-scope.test.ts.
      - name: Did crisis-safety or memory code change?
        id: risky
        uses: ./.github/actions/pr-changes
        with:
          include: '^src/(services/safety/|agents/personas/crisis|agents/processors/turn-processor/turn-crisis|tools/domains/life-coaching-shared/safety-guards\.ts$|memory/|services/memory/|utils/safety-whole-word|utils/phrase-match)'

      - name: Generate cache key
        id: cache-key
        run: echo "key=node-modules-${{ hashFiles('pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js and pnpm
        if: steps.code.outputs.matched != 'false' || steps.voice-eval.outputs.matched == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Verify installation success
        if: steps.code.outputs.matched != 'false' || steps.voice-eval.outputs.matched == 'true'
        run: |
          if [ ! -d "node_modules" ]; then
            echo "❌ node_modules not found - install failed"
            exit 1
          fi
          echo "✅ node_modules verified"

      # `vitest --changed` runs the WHOLE unit suite when the diff touches one of
      # vitest.config.unit.ts's forceRerunTriggers (a persona bundle or other data
      # file under src/, package.json, the lockfile, tsconfig). One shard can't run
      # ~2,200 files in its 25 min: #2508 edited three persona JSONs and was
      # cancelled at the timeout three times with no failing test. Such a PR gets
      # the four shards of a full run instead. The script asks vitest for the
      # triggers and matches with vitest's picomatch; any failure says 'true'.
      - name: Will the affected unit tests be the whole suite?
        id: unit-full
        if: github.event_name == 'pull_request' && (steps.code.outputs.matched != 'false' || steps.voice-eval.outputs.matched == 'true')
        run: node scripts/ci/unit-full-suite-needed.mjs HEAD^1 || echo "needed=true" >> "$GITHUB_OUTPUT"

      # `--changed` is not always small either: a file under src/config/flags/ reaches
      # ~1,500 test files through the generated barrel, and one shard timed out on
      # those at 25 min (7 of 22 attempts in four hours, 2026-10-29) while a full run
      # on four shards never passed 14. Count the affected files here; above the
      # script's threshold the shards below split them four ways. Skipped when the
      # PR already runs the whole suite on four shards.
      - name: How many unit tests are affected?
        id: unit-affected
        if: >-
          github.event_name == 'pull_request'
          && steps.unit-full.outputs.needed == 'false'
          && steps.risky.outputs.matched != 'true'
          && !contains(github.event.pull_request.labels.*.name, 'ci:full-tests')
        run: node scripts/ci/unit-affected-count.mjs HEAD^1 || echo "sharded=true" >> "$GITHUB_OUTPUT"

      - name: Save node_modules cache
        if: steps.code.outputs.matched != 'false' || steps.voice-eval.outputs.matched == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.cache-key.outputs.key }}

  # ============================================================================
  # LINT & TYPE CHECK
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    needs: setup
    if: needs.setup.outputs.node != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Memory eval type check
        run: pnpm typecheck:memory-eval

      - name: Lint check
        run: pnpm lint

      # Blocking ratchet: every production file's ESLint errors may not grow (baseline: lint-coverage-baseline.json).
      - name: Lint coverage ratchet
        run: pnpm quality:lint-coverage

      - name: Tool schema validation
        run: pnpm tools:schemas:validate

      - name: Tool schema check (no drift)
        run: pnpm tools:schemas:check

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  # The full run (2,209 files) took ~31 of the job's ~34 min, so every merge-queue
  # group took ~35 min and sat a minute under the old 35 min timeout (2026-10-23).
  # It runs as four vitest shards in parallel; `test-unit` below is the one
  # "Unit Tests" check that branch protection, queue-tested and required-checks.sh
  # read. vitest shards by a hash of each file's path, so every file runs in
  # exactly one shard. A pull request runs only the affected tests, so the matrix
  # is just shard 1 there: shards 2-4 are never created and take no runner. When
  # the affected tests are the whole suite (setup's unit-full-suite), a PR gets
  # all four, as a full run does. So does a PR whose affected set is too big for
  # one shard (setup's unit-affected-sharded, a flag file for one): each shard then
  # runs its quarter of the affected files, `--changed HEAD^1 --shard=N/4`.
  test-unit-shard:
    name: Unit Tests (${{ matrix.shard }}/4)
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    # A shard runs ~8 min of tests; a cold cargo cache adds the native build.
    timeout-minutes: 25
    needs: setup
    if: needs.setup.outputs.node != 'false' || needs.setup.outputs.voice-eval == 'true'
    strategy:
      fail-fast: false
      matrix:
        # [1, 2, 3, 4] on a full run or when the affected tests are too many for one
        # shard, [1] on a pull request with a small affected set. The condition is
        # FULL_SUITE's below plus AFFECTED_SHARDED's, and must stay the same
        # (merge-queue-jobs.test.ts pins it, and the Unit Tests gate checks the count).
        shard: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-tests') || needs.setup.outputs.unit-full-suite != 'false' || needs.setup.outputs.full-tests == 'true' || needs.setup.outputs.unit-affected-sharded == 'true') && '[1, 2, 3, 4]' || '[1]') }}
    env:
      # 'true' when this run tests the whole suite: every event but a pull request,
      # a pull request labelled ci:full-tests, one whose diff makes `--changed`
      # run everything anyway (`!= 'false'`: a missing answer runs all four), and
      # one that touches crisis-safety or memory code (setup's full-tests).
      FULL_SUITE: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-tests') || needs.setup.outputs.unit-full-suite != 'false' || needs.setup.outputs.full-tests == 'true' }}
      # 'true' when a pull request that runs only the affected tests has so many that
      # setup split them over the four shards (setup's unit-affected-sharded). Only an
      # explicit 'true' does; an empty answer means one shard, which is safe because
      # setup skips the count only when the PR runs the whole suite on four anyway.
      AFFECTED_SHARDED: ${{ needs.setup.outputs.unit-affected-sharded == 'true' }}
    # Every leg reports the same three values, so it doesn't matter which one wins.
    outputs:
      full-suite: ${{ env.FULL_SUITE }}
      affected-sharded: ${{ env.AFFECTED_SHARDED }}
      shards: ${{ strategy.job-total }}
    steps:
      # Two commits on a pull request: GitHub's merge commit and its first parent, the
      # base, which the affected-tests step below diffs against.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # The root vitest.config.ts excludes apps/**, so the step below never sees the
      # CLI's tests; they run under apps/cli/vitest.config.ts instead. They need no
      # native bindings and finish in seconds, so they run before the Rust build.
      # Shard 1 runs them and the ratchet below; they don't depend on the shard.
      - name: Run CLI unit tests
        if: matrix.shard == 1
        run: pnpm test:cli:unit
        env:
          NODE_ENV: test

      # The root typecheck covers src/** only, so apps/cli was never typechecked.
      # Its error count may only go down (baseline: apps/cli/tsc-error-baseline.json).
      - name: CLI typecheck ratchet
        if: matrix.shard == 1
        run: node scripts/ci/cli-typecheck-ratchet.mjs

      # The decision register (docs/decisions/register.md) test reads Swift, CSS and
      # JSON as text, so no import edge reaches it and `--changed` would skip it; a PR
      # always runs it, before the Rust build. (The env-name list and flag barrel that
      # used to share this step are generated now, never committed, so they can't drift.)
      - name: Check the decision register
        if: env.FULL_SUITE != 'true' && matrix.shard == 1
        run: pnpm exec vitest run --config vitest.config.unit.ts src/__tests__/decisions/
        env:
          NODE_ENV: test

      # 60 call sites use the THROWING loadRustPerf() (tryLoadRustPerf is documented
      # "for availability checks, not for actual operations"), so the accelerator is
      # genuinely required — skipping those tests would hide coverage, not fix it.
      # apps/rust-perf ships ferni-perf.darwin-arm64.node, which is why this passes
      # on a dev Mac and failed here with
      #   NativeRustAcceleratorUnavailableError: Cannot find module '@ferni/perf-linux-x64-gnu'
      # rust-native.yml already builds this target ("Linux x86_64 (production - GCE)"),
      # but its artifact never reaches this job. Debug build: compiles far faster than
      # --release and the tests only need the binding to load.
      # Deliberately NOT continue-on-error — if the binding fails to build the tests
      # fail anyway, and a silent build failure is the exact pattern this audit is
      # unwinding.
      # Pinned to a commit SHA, not @stable: that is a moving branch, so the
      # toolchain action could change under this workflow without review.
      - name: Setup Rust (for the @ferni/perf native binding)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-25

      - name: Cache cargo + native targets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/rust-perf/target/
            apps/rust-audio/target/
          key: ${{ runner.os }}-native-${{ hashFiles('apps/rust-perf/Cargo.lock', 'apps/rust-audio/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-

      # Build the two bindings a passing dev machine actually has:
      #   apps/rust-perf/ferni-perf.darwin-arm64.node
      #   apps/rust-audio/ferni-audio.darwin-arm64.node
      # @ferni/sonata is the third napi package in the workspace but has NO local
      # binding either, and the suite passes without it — so it is tolerated and is
      # deliberately not built here. rust-native.yml also notes sonata needs
      # pre-built pocket-voice cdylibs, which is a separate problem.
      #
      # The binding statically links pyke's prebuilt libonnxruntime.a, which needs
      # glibc >= 2.38 (__isoc23_strtol & co). On an Ubuntu 22.04 runner (glibc 2.35)
      # it builds fine but every dlopen fails, and ~65 native tests fail in 1 ms
      # (run 37171889352). All runners are Ubuntu 24.04 (glibc 2.39), the same as
      # production, so this builds exactly what ships. The check below turns any
      # future mismatch into one clear failure with the real dlopen error.
      - name: Build @ferni/perf native binding
        working-directory: apps/rust-perf
        run: |
          pnpm install
          pnpm exec napi build --platform

      # Fail here with the real dlopen error instead of 65 tests failing in 1 ms.
      - name: Check @ferni/perf loads
        run: node -e "require('./apps/rust-perf')"

      - name: Build @ferni/audio native binding
        working-directory: apps/rust-audio
        run: |
          pnpm install
          pnpm exec napi build --platform

      # A pull request runs only the tests whose imports reach a changed file, without
      # coverage: the full coverage run was 19 of CI's ~47 runner-minutes per PR push
      # while PR jobs waited ~30 min for a runner (2026-10-18). vitest.config.unit.ts
      # lists the files no import reaches (setup, lockfile, runtime data); a change to
      # one runs everything. The merge queue always runs the whole suite with coverage,
      # so this changes how early a PR hears, never what reaches main. The
      # `ci:full-tests` label runs the whole suite on a PR, and so does a change to
      # crisis-safety or memory code (setup's full-tests).
      - name: Run unit tests affected by this pull request
        if: env.FULL_SUITE != 'true'
        run: |
          args=(--config vitest.config.unit.ts --changed HEAD^1 --passWithNoTests)
          # vitest shards the files --changed selected, so the four shards of a big
          # affected set are disjoint and together run all of it.
          if [ "$AFFECTED_SHARDED" = true ]; then args+=("--shard=$SHARD/4"); fi
          pnpm exec vitest run "${args[@]}"
        env:
          NODE_ENV: test
          NODE_OPTIONS: '--max-old-space-size=8192'
          SHARD: ${{ matrix.shard }}

      # No `--`: pnpm passes it through and vitest ignores every flag after it, so the
      # old `-- --reporter=verbose` here never took effect (the default reporter ran).
      - name: Run unit tests with coverage
        id: full-unit
        if: env.FULL_SUITE == 'true'
        run: pnpm test:unit:coverage --shard=${{ matrix.shard }}/4
        env:
          NODE_ENV: test

      # Each shard uploads its part under the one `unit` flag and Codecov merges the
      # uploads for a commit. vitest.config.unit.ts sets no coverage thresholds, so
      # there is no merged total to enforce here.
      - name: Upload unit coverage
        uses: codecov/codecov-action@v7
        if: always() && steps.full-unit.outcome != 'skipped'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

  # The "Unit Tests" check: green only when setup and every shard of the matrix
  # (four on a full run or a big affected set, one on a small one) passed. A matrix job's
  # result is success only when every leg succeeded; failure, cancelled and
  # skipped all fail this check, so shards skipped on a full run can't pass it.
  # It runs whenever the shards should have (always(), so a failed, cancelled or
  # timed-out shard turns it red instead of skipping it: a skipped required check
  # counts as passed), and skips exactly when the shards skip by design (setup
  # scoped the Node suite out), as the single job did before it was sharded.
  test-unit:
    name: Unit Tests
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    needs: [setup, test-unit-shard]
    if: always() && (needs.setup.outputs.node != 'false' || needs.setup.outputs.voice-eval == 'true')
    steps:
      - name: Every unit test shard passed
        env:
          SETUP: ${{ needs.setup.result }}
          SHARDS: ${{ needs.test-unit-shard.result }}
          FULL: ${{ needs.test-unit-shard.outputs.full-suite }}
          AFFECTED: ${{ needs.test-unit-shard.outputs.affected-sharded }}
          TOTAL: ${{ needs.test-unit-shard.outputs.shards }}
        run: |
          echo "setup: $SETUP, unit test shards: $SHARDS ($TOTAL created, full suite: $FULL, affected tests sharded: $AFFECTED)"
          if [ "$SETUP" != success ] || [ "$SHARDS" != success ]; then
            echo "::error::Unit Tests failed: setup $SETUP, shards $SHARDS (see the Unit Tests (n/4) jobs)"
            exit 1
          fi
          # The shard matrix, FULL_SUITE and AFFECTED_SHARDED are copies of one
          # condition. If they drifted, a run could create one shard that runs
          # --shard=1/4 and passes having run a quarter of the suite. Fail closed.
          case "$FULL/$AFFECTED" in
            true/* | false/true) want=4 ;;
            false/false) want=1 ;;
            *) echo "::error::Unit Tests: the shards did not report how the tests were split"; exit 1 ;;
          esac
          if [ "$TOTAL" != "$want" ]; then
            echo "::error::Unit Tests: $TOTAL shard(s) ran, expected $want (full suite: $FULL, affected tests sharded: $AFFECTED)"
            exit 1
          fi

  # ============================================================================
  # INTEGRATION TESTS (Slower - ~2-5 minutes)
  # ============================================================================
  test-integration:
    name: Integration Tests (${{ matrix.shard }}/3)
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: setup
    # No job-level `if:`: a skipped matrix job reports one check named
    # "Integration Tests (${{ matrix.shard }}/3)", so the three required checks
    # would never report. It always runs; its steps skip on a docs-only PR and on
    # every pull_request run (the merge queue runs the suite; see on.pull_request).
    # Since the repo went private (2026-09-27) its runners are smaller: the
    # suite ran at ~1 worker and passed 30 minutes, where it took ~11 before.
    # Three shards in parallel cost about the same minutes and finish sooner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false' && (steps.nm-cache.outputs.cache-hit != 'true')
        run: pnpm install --no-frozen-lockfile

      # memory-persistence loads the native vector accelerator (loadRustPerf
      # throws without it); see the same steps in Unit Tests for why.
      - name: Setup Rust (for the @ferni/perf native binding)
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-25

      - name: Cache cargo + native targets
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/rust-perf/target/
            apps/rust-audio/target/
          key: ${{ runner.os }}-native-${{ hashFiles('apps/rust-perf/Cargo.lock', 'apps/rust-audio/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-

      - name: Build @ferni/perf native binding
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        working-directory: apps/rust-perf
        run: |
          pnpm install
          pnpm exec napi build --platform

      - name: Check @ferni/perf loads
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        run: node -e "require('./apps/rust-perf')"

      # speech-modules runs the audio-prosody analyzer, which needs this binding
      # (no JS fallback). The repo only has the darwin-arm64 build, so on Linux
      # it failed with "Cannot find module '@ferni/audio-linux-x64-gnu'".
      - name: Build @ferni/audio native binding
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        working-directory: apps/rust-audio
        run: |
          pnpm install
          pnpm exec napi build --platform

      - name: Check @ferni/audio loads
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        run: node -e "require('./apps/rust-audio')"

      # Blocking. It ran with continue-on-error, so 13 tests could fail on every
      # run of main and the job still showed green.
      - name: Run integration tests
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        # No `--`: pnpm would pass it through and vitest ignores every flag after it.
        run: pnpm test:integration --shard=${{ matrix.shard }}/3 --reporter=verbose
        env:
          NODE_ENV: test
          # No GOOGLE_API_KEY: the secret is invalid ("API key not valid"), so the
          # LLM-backed tests failed their calls instead of taking their no-key skip.
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          # A project id with no credentials: code that picks a cloud backend from
          # the project id alone (Vertex embeddings, firebase-admin) fails here, so
          # the tests choose their fakes explicitly instead of relying on the env.
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}

      - name: Check coverage threshold
        if: github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        run: |
          # Extract coverage percentage from coverage summary
          COVERAGE=$(cat coverage/coverage-summary.json 2>/dev/null | grep -o '"pct":[0-9.]*' | head -1 | grep -o '[0-9.]*' || echo "0")
          echo "Coverage: ${COVERAGE}%"
          # Warn if coverage is below 60% (don't block for now)
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "⚠️ Coverage ${COVERAGE}% is below 60% threshold"
          else
            echo "✅ Coverage ${COVERAGE}% meets 60% threshold"
          fi

      - name: Upload integration coverage
        uses: codecov/codecov-action@v7
        if: always() && github.event_name != 'pull_request' && needs.setup.outputs.node != 'false'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: integration-${{ matrix.shard }}
          fail_ci_if_error: false

  # ============================================================================
  # RELATED INTEGRATION TESTS (pull_request only)
  # ============================================================================
  # PR runs skip the integration suite (the merge queue runs it), so a broken
  # integration test surfaced only as a queue rejection, which also knocks out
  # the PRs queued with it (#1332). This runs just the integration tests that
  # import the PR's changed src/ files (`vitest related`), before the queue (#1366).
  # Hosted on purpose, never CI_RUNNER: it takes no runner from the merge queue,
  # so OPTIONAL_CI (which exists to free those runners, #1018) doesn't gate it.
  # Not a required check, and it never runs in merge_group (the queue runs all).
  test-integration-related:
    name: Related Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: setup
    if: github.event_name == 'pull_request' && needs.setup.outputs.node != 'false'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Changed src files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # The files API, not `gh pr diff` (which 406s past 300 files and would
        # leave a big PR green having run nothing). Removed files are skipped: a
        # deleted module has no importers left to run. A listing failure fails.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' > "$RUNNER_TEMP/pr-files.txt"
          { grep -E '^src/.+\.(ts|tsx|js|mjs)$' "$RUNNER_TEMP/pr-files.txt" || true; } > "$RUNNER_TEMP/changed-src.txt"
          count=$(wc -l < "$RUNNER_TEMP/changed-src.txt" | tr -d " ")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count changed src file(s)"

      - name: Setup pnpm
        if: steps.changed.outputs.count != '0'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        if: steps.changed.outputs.count != '0'
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      - name: Install dependencies (node_modules cache miss)
        if: steps.changed.outputs.count != '0' && steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # Same native bindings as Integration Tests: memory-persistence and
      # speech-modules load them, and a related run can select either.
      - name: Setup Rust (for the @ferni/perf native binding)
        if: steps.changed.outputs.count != '0'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-25

      - name: Cache cargo + native targets
        if: steps.changed.outputs.count != '0'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/rust-perf/target/
            apps/rust-audio/target/
          key: ${{ runner.os }}-native-${{ hashFiles('apps/rust-perf/Cargo.lock', 'apps/rust-audio/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-

      - name: Build native bindings
        if: steps.changed.outputs.count != '0'
        run: |
          (cd apps/rust-perf && pnpm install && pnpm exec napi build --platform)
          (cd apps/rust-audio && pnpm install && pnpm exec napi build --platform)

      - name: Run integration tests related to the change
        if: steps.changed.outputs.count != '0'
        # No `--` (see Integration Tests). Paths are read into an array, never
        # word-split, since a file name comes from the PR.
        run: |
          mapfile -t files < "$RUNNER_TEMP/changed-src.txt"
          pnpm exec vitest related --run --config vitest.config.integration.ts --passWithNoTests --reporter=verbose "${files[@]}"
        env:
          NODE_ENV: test
          # Same env as Integration Tests (no GOOGLE_API_KEY, see there).
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}

  # ============================================================================
  # AGI FEATURE TESTS
  # ============================================================================
  test-agi-features:
    name: AGI Feature Tests
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    needs: setup
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # Blocking. Both ran with continue-on-error, so the job was green whatever
      # they did; main passes both (93 and 6 tests, 2026-10-18).
      - name: Run AGI Feature Unit Tests
        run: pnpm test:agi-features -- --reporter=verbose
        env:
          NODE_ENV: test

      - name: Run AGI Actions API E2E Tests
        run: pnpm test:agi-actions-api -- --reporter=verbose
        env:
          NODE_ENV: test

  # ============================================================================
  # BUILD
  # ============================================================================
  build:
    name: Build
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: [setup, lint, test-unit, test-integration, test-agi-features]
    # After a queue merge the Node suite skips on the push (queue-tested), so a
    # skipped need must not skip the build; a failed one still does
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build backend
        run: pnpm build

      - name: Build design-system
        run: pnpm build:design-system

      - name: Build frontend
        run: |
          cd apps/web
          pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            dist/
            apps/web/dist/
          retention-days: 7

  # ============================================================================
  # SECURITY SCAN
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    # Runs on every PR (the secret scan covers docs too); dependency steps skip
    # when no code changed, since the lockfile is then main's.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        if: needs.setup.outputs.code != 'false'
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: needs.setup.outputs.code != 'false' && (steps.nm-cache.outputs.cache-hit != 'true')
        run: pnpm install --no-frozen-lockfile

      - name: Run pnpm audit
        if: needs.setup.outputs.code != 'false'
        # Fails on a new high or critical advisory. Known ones with no fix yet are
        # listed (with why) under auditConfig.ignoreGhsas in pnpm-workspace.yaml.
        # A registry outage passes rather than blocking every PR.
        run: pnpm audit --audit-level=high --ignore-registry-errors

      # trufflehog is pinned to an immutable commit SHA, not @main: a mutable ref
      # means this job runs whatever is on that branch at run time, and this
      # particular action is handed the whole repo specifically to find secrets in
      # it — the worst thing to leave floating. Bump the SHA deliberately.
      # A PR scans its own commits, a merge-queue group every PR in it (from main,
      # as #2215 scopes the queue). secret-scan-range.sh fetches just that history
      # and fails unless the range is complete. Pushes to main are scanned by
      # secret-scan-main.yml (full tree plus the pushed commits): it has no paths
      # filter and nothing cancels it, while this workflow's push runs can be both.
      # Until 2026-10-19 the one-commit checkout had no base, so every scan here
      # logged "unable to resolve commit", read 0 bytes, and passed.
      - name: Commits to scan for secrets
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: scan-range
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash scripts/ci/secret-scan-range.sh

      - name: Check for secrets
        if: steps.scan-range.outcome == 'success' && steps.scan-range.outputs.commits != '0'
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          base: ${{ steps.scan-range.outputs.base }}
          head: ${{ steps.scan-range.outputs.head }}
          # Fail on a live secret and on one whose check couldn't finish; a key that
          # fails its check (unverified) is reported in the log but doesn't fail.
          extra_args: --results=verified,unknown

  # ============================================================================
  # CODE QUALITY METRICS (using unified audit CLI)
  # ============================================================================
  code-quality:
    name: Code Quality Metrics
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run unified audit
        run: pnpm audit all
        continue-on-error: true

  # ============================================================================
  # STRICT QUALITY GATES (blocking - fails build if thresholds exceeded)
  # ============================================================================
  quality-gates:
    name: Quality Gates (Blocking)
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    # Runs on pull_request too. Skipped there, it first ran in the merge queue, so
    # one PR that grew a 713-line file to 723 failed 15 of 15 merge groups and
    # knocked out every PR queued with it (2026-10-18). Its three steps are cheap.
    # arch-map: a PR that edits only ARCHITECTURE.md (root markdown) still runs docs:map --check.
    if: needs.setup.outputs.code != 'false' || needs.setup.outputs.arch-map == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # Blocking. Files over 500 lines may not grow, and brand-copy and brand-lint
      # counts may not rise (docs/DEFINITION-OF-CLEAN.md). It only ran in Brand
      # Compliance, which is not a required check and has no merge_group trigger,
      # so growth reached main three times in a week (#343, #340, #388).
      - name: Quality ratchet
        run: pnpm tsx apps/cli/src/commands/quality/ratchet.ts

      # Blocking ratchet: a new import edge breaking architecture-layers.ts fails. ~5 s; scoreboard in job summary.
      - name: Architecture gate
        run: pnpm quality:arch

      # Blocking ratchet: a relative vi.mock-family string naming no module fails (vitest
      # mocks a path nobody imports and the real module loads). Fix: point the string at
      # the module the test means. The baseline only shrinks: a fixed entry fails until
      # `pnpm quality:mock-paths --update` drops it. gen:lists first: on a cache hit install
      # is skipped, so its gitignored *.generated.ts files are absent (the tool also treats
      # them as present). ~3 s.
      - name: Mock paths resolve
        run: |
          pnpm gen:lists
          pnpm quality:mock-paths

      # Blocking: ARCHITECTURE.md's layer table is generated from architecture-layers.ts and
      # must match it (and the index.ts / CLAUDE.md files it links). Fix: `pnpm docs:map`. ~1 s.
      - name: Architecture map is current
        run: pnpm docs:map --check

      # Blocking ratchet: a new Firestore client that ignores FIRESTORE_DATABASE (dev runs on
      # ferni-dev, prod on '(default)') fails, and the allowlist may only shrink. ~10 s.
      - name: Firestore database ratchet
        run: pnpm tsx scripts/ci/firestore-database-ratchet.ts

      # Blocking. A firebase deploy of the index file must not delete a TTL policy, field
      # override or composite that prod or dev has. Diffs firestore.indexes.json against the
      # checked-in gcloud listings in scripts/ci/fixtures/firestore-indexes/. ~2 s.
      - name: Firestore index drift
        run: pnpm tsx scripts/ci/firestore-indexes-drift.ts

      # Blocking: a file this PR leaves unimported, or more unused exports in a file than at
      # the merge base, fails (knip.json; knip runs here and on the base). ~10 s.
      - name: Dead code (knip ratchet)
        run: pnpm quality:knip

      - name: Run CI Quality Gates
        run: pnpm ci:quality-gates

  # ============================================================================
  # VALIDATION (using unified validate CLI)
  # ============================================================================
  validation:
    name: Validation Checks
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Validate voices
        run: pnpm validate voices
        continue-on-error: true

      - name: Validate integrations
        run: pnpm validate integrations
        continue-on-error: true

  # ============================================================================
  # E2E VALIDATION - Validate all user actions (tools, commands, API)
  # ============================================================================
  e2e-validation:
    name: E2E Validation
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: setup
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI and backend
        run: pnpm build:fast
        continue-on-error: true

      - name: Run E2E validation
        run: node dist/apps/cli/src/index.js validate e2e --ci --report json > e2e-report.json || true
        continue-on-error: true

      - name: Check E2E coverage threshold
        run: |
          if [ -f e2e-report.json ]; then
            COVERAGE=$(cat e2e-report.json | grep -o '"coverage":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "0")
            CI_PASSED=$(cat e2e-report.json | grep -o '"ciPassed":[a-z]*' | head -1 | grep -o '[a-z]*' || echo "false")
            echo "E2E Coverage: ${COVERAGE}%"
            echo "CI Passed: ${CI_PASSED}"
            if [ "$CI_PASSED" = "false" ]; then
              echo "❌ E2E coverage ${COVERAGE}% is below 80% threshold"
              # Don't fail build for now, just warn
              # exit 1
            else
              echo "✅ E2E coverage ${COVERAGE}% meets 80% threshold"
            fi
          else
            echo "⚠️ E2E report not generated - skipping threshold check"
          fi

      - name: Upload E2E report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-validation-report
          path: e2e-report.json
          retention-days: 30

  # ============================================================================
  # FRONTEND QUALITY
  # ============================================================================
  frontend-quality:
    name: Frontend Quality
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    needs: setup
    if: needs.setup.outputs.node != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # Fails when a committed generated file (tokens.css, animation constants,
      # expressions, iOS expressions.json...) is not what the generators produce
      # from design-system/tokens/*.json. Fix: pnpm tokens:drift --fix, commit.
      - name: Design-system drift gate
        run: pnpm tokens:drift

      - name: Build design-system
        run: pnpm build:design-system

      - name: TypeScript type check
        run: |
          cd apps/web
          pnpm typecheck

      - name: Architecture tests (layers, cycles, boundaries, naming, file size)
        run: |
          cd apps/web
          pnpm test:arch

      # Web ESLint has 123 old errors, so plain `pnpm lint` can't gate. The ratchet fails
      # only when a rule gains errors (baseline: ratchet-baseline.json "webEslint").
      - name: ESLint (ratchet)
        run: |
          (cd apps/web && pnpm lint --format json --output-file eslint.json) || true
          pnpm tsx apps/cli/src/commands/quality/ratchet.ts --eslint apps/web/eslint.json

      - name: Web unit tests
        working-directory: apps/web
        run: npx vitest run

      - name: Design token validation
        run: |
          cd apps/web
          pnpm lint:tokens

      - name: UI audit
        run: |
          cd apps/web
          pnpm audit:ui || true
        continue-on-error: true

      # The build must succeed, and the bundle may not grow past its baseline (2% slack).
      - name: Build and bundle ratchet
        run: |
          (cd apps/web && pnpm build)
          pnpm tsx apps/cli/src/commands/quality/ratchet.ts --bundle

  # ============================================================================
  # OVERLAY GALLERY (visual + contrast) - PRs touching web, design system, brand
  # ============================================================================
  # Opens every scene of the dev-only overlay gallery on a phone and a desktop
  # viewport, light and dark: contrast may not get worse than
  # apps/web/tests/overlays/contrast-baseline.json (axe + the gallery probe),
  # snapshots must match the committed Linux baselines, and with the overlay
  # host on the toast region must keep clear of Connect and the menu trigger.
  # Other PRs and the merge queue skip it, and a skipped job reports success, so
  # branch protection requires it (since #2391) without stalling them; it is not
  # in required-checks.sh, which says why. Reuses setup's node_modules cache and
  # runs the Vite dev server (the gallery is dev-only, so the prod build can't
  # be used).
  overlay-gallery:
    name: Overlay Gallery (visual + contrast)
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    # 10 cut the suite off mid-run (#2391): an install on a cache miss plus the
    # two axe sweeps (every menu panel, two themes, retried once in CI) need more.
    timeout-minutes: 20
    needs: setup
    if: github.event_name == 'pull_request' && needs.setup.outputs.web != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # Browsers persist in the runner user's cache on the self-hosted VM, which
      # also has Chromium's system libraries (no sudo there).
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Overlay gallery checks
        working-directory: apps/web
        run: |
          if [ -d tests/overlays/__screenshots__/linux ]; then
            pnpm exec playwright test -c playwright.overlays.config.ts
          else
            echo "::warning::No Linux overlay snapshots are committed yet. Writing them: commit tests/overlays/__screenshots__/linux from the overlay-gallery artifact."
            pnpm exec playwright test -c playwright.overlays.config.ts --update-snapshots=all
          fi

      # Required check: a copy or layout change fails it until the baselines match.
      - name: How to refresh the baselines
        if: failure()
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "::error title=Overlay gallery::If the changed overlays are intended, refresh the Linux baselines from this run: scripts/ci/refresh-overlay-baselines.sh $PR (from the repo root, on the PR branch), review each image, then commit them."

      - name: Upload report and snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: overlay-gallery
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/tests/overlays/__screenshots__/linux/
          retention-days: 7

  # ============================================================================
  # DEPENDENCY CHECK
  # ============================================================================
  dependencies:
    name: Dependency Check
    runs-on: ${{ fromJSON((vars.CI_RUNNER && github.event_name == 'pull_request' && vars.CI_PR_RUNNER) || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: setup
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Check for outdated dependencies
        run: pnpm outdated || true

      - name: Check for duplicate dependencies
        run: pnpm dlx depcheck --ignores="@types/*" || true
