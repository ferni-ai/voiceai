name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'apps/**'
      - 'packages/**'
      - 'design-system/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'apps/**'
      - 'packages/**'
      - 'design-system/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NODE_OPTIONS: '--max-old-space-size=3072'

jobs:
  # ============================================================================
  # SETUP - Shared dependency installation and caching
  # ============================================================================
  # runs-on comes from the CI_RUNNER repo variable (a JSON label list), falling back
  # to ubuntu-latest when it is unset (the default). Setting it to
  # ["self-hosted","Linux","X64","gce"] moves CI to the github-runner VM, an
  # emergency fallback for when hosted runners are unavailable. If that VM is
  # stopped, UNSET the variable: a job waiting
  # for a runner is not covered by timeout-minutes, so with no runner online every
  # run sits in GitHub's 24h queue and is cancelled with no verdict (2026-07).
  # Deploys never run on it: deploy-gce.yml is GitHub-hosted, because PR code on
  # that VM has docker (root) access and must not share a host with deploy
  # credentials. The VM's identity is github-runner-ci (log/metric write only).
  setup:
    name: Setup & Cache Dependencies
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: echo "key=node-modules-${{ hashFiles('pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          frozen-lockfile: 'false'

      - name: Verify installation success
        run: |
          if [ ! -d "node_modules" ]; then
            echo "❌ node_modules not found - install failed"
            exit 1
          fi
          echo "✅ node_modules verified"

      - name: Save node_modules cache
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.cache-key.outputs.key }}

  # ============================================================================
  # LINT & TYPE CHECK
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Lint check
        run: pnpm lint

      - name: Tool schema validation
        run: pnpm tools:schemas:validate
        continue-on-error: true

      - name: Tool schema check (no drift)
        run: pnpm tools:schemas:check
        continue-on-error: true

  # ============================================================================
  # UNIT TESTS (Fast - ~30-60 seconds)
  # ============================================================================
  test-unit:
    name: Unit Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # 20 -> 35: the first run compiles the rust-perf binding from scratch on top of
    # an ~8 min test run. Cached cargo brings later runs back near the old budget.
    timeout-minutes: 35
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # The root vitest.config.ts excludes apps/**, so the step below never sees the
      # CLI's tests; they run under apps/cli/vitest.config.ts instead. They need no
      # native bindings and finish in seconds, so they run before the Rust build.
      - name: Run CLI unit tests
        run: pnpm test:cli:unit
        env:
          NODE_ENV: test

      # 60 call sites use the THROWING loadRustPerf() (tryLoadRustPerf is documented
      # "for availability checks, not for actual operations"), so the accelerator is
      # genuinely required — skipping those tests would hide coverage, not fix it.
      # apps/rust-perf ships ferni-perf.darwin-arm64.node, which is why this passes
      # on a dev Mac and failed here with
      #   NativeRustAcceleratorUnavailableError: Cannot find module '@ferni/perf-linux-x64-gnu'
      # rust-native.yml already builds this target ("Linux x86_64 (production - GCE)"),
      # but its artifact never reaches this job. Debug build: compiles far faster than
      # --release and the tests only need the binding to load.
      # Deliberately NOT continue-on-error — if the binding fails to build the tests
      # fail anyway, and a silent build failure is the exact pattern this audit is
      # unwinding.
      # Pinned to a commit SHA, not @stable: that is a moving branch, so the
      # toolchain action could change under this workflow without review.
      - name: Setup Rust (for the @ferni/perf native binding)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-25

      - name: Cache cargo + native targets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/rust-perf/target/
            apps/rust-audio/target/
          key: ${{ runner.os }}-native-${{ hashFiles('apps/rust-perf/Cargo.lock', 'apps/rust-audio/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-

      # Build the two bindings a passing dev machine actually has:
      #   apps/rust-perf/ferni-perf.darwin-arm64.node
      #   apps/rust-audio/ferni-audio.darwin-arm64.node
      # @ferni/sonata is the third napi package in the workspace but has NO local
      # binding either, and the suite passes without it — so it is tolerated and is
      # deliberately not built here. rust-native.yml also notes sonata needs
      # pre-built pocket-voice cdylibs, which is a separate problem.
      #
      # The binding statically links pyke's prebuilt libonnxruntime.a, which needs
      # glibc >= 2.38 (__isoc23_strtol & co). On an Ubuntu 22.04 runner (glibc 2.35)
      # it builds fine but every dlopen fails, and ~65 native tests fail in 1 ms
      # (run 37171889352). All runners are Ubuntu 24.04 (glibc 2.39), the same as
      # production, so this builds exactly what ships. The check below turns any
      # future mismatch into one clear failure with the real dlopen error.
      - name: Build @ferni/perf native binding
        working-directory: apps/rust-perf
        run: |
          pnpm install
          pnpm exec napi build --platform

      # Fail here with the real dlopen error instead of 65 tests failing in 1 ms.
      - name: Check @ferni/perf loads
        run: node -e "require('./apps/rust-perf')"

      - name: Build @ferni/audio native binding
        working-directory: apps/rust-audio
        run: |
          pnpm install
          pnpm exec napi build --platform

      - name: Run unit tests with coverage
        run: pnpm test:unit:coverage -- --reporter=verbose
        env:
          NODE_ENV: test

      - name: Upload unit coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

  # ============================================================================
  # INTEGRATION TESTS (Slower - ~2-5 minutes)
  # ============================================================================
  test-integration:
    name: Integration Tests (${{ matrix.shard }}/3)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: setup
    # Since the repo went private (2026-09-27) its runners are smaller: the
    # suite ran at ~1 worker and passed 30 minutes, where it took ~11 before.
    # Three shards in parallel cost about the same minutes and finish sooner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # memory-persistence loads the native vector accelerator (loadRustPerf
      # throws without it); see the same steps in Unit Tests for why.
      - name: Setup Rust (for the @ferni/perf native binding)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-25

      - name: Cache cargo + native targets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/rust-perf/target/
            apps/rust-audio/target/
          key: ${{ runner.os }}-native-${{ hashFiles('apps/rust-perf/Cargo.lock', 'apps/rust-audio/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-

      - name: Build @ferni/perf native binding
        working-directory: apps/rust-perf
        run: |
          pnpm install
          pnpm exec napi build --platform

      - name: Check @ferni/perf loads
        run: node -e "require('./apps/rust-perf')"

      - name: Run integration tests
        # No `--`: pnpm would pass it through and vitest ignores every flag after it.
        run: pnpm test:integration --shard=${{ matrix.shard }}/3 --reporter=verbose
        env:
          NODE_ENV: test
          # No GOOGLE_API_KEY: the secret is invalid ("API key not valid"), so the
          # LLM-backed tests failed their calls instead of taking their no-key skip.
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from coverage summary
          COVERAGE=$(cat coverage/coverage-summary.json 2>/dev/null | grep -o '"pct":[0-9.]*' | head -1 | grep -o '[0-9.]*' || echo "0")
          echo "Coverage: ${COVERAGE}%"
          # Warn if coverage is below 60% (don't block for now)
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "⚠️ Coverage ${COVERAGE}% is below 60% threshold"
          else
            echo "✅ Coverage ${COVERAGE}% meets 60% threshold"
          fi

      - name: Upload integration coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: integration-${{ matrix.shard }}
          fail_ci_if_error: false

  # ============================================================================
  # AGI FEATURE TESTS
  # ============================================================================
  test-agi-features:
    name: AGI Feature Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run AGI Feature Unit Tests
        run: pnpm test:agi-features -- --reporter=verbose
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Run AGI Actions API E2E Tests
        run: pnpm test:agi-actions-api -- --reporter=verbose
        env:
          NODE_ENV: test
        continue-on-error: true

  # ============================================================================
  # BUILD
  # ============================================================================
  build:
    name: Build
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: [setup, lint, test-unit, test-integration, test-agi-features]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build backend
        run: pnpm build

      - name: Build design-system
        run: pnpm build:design-system

      - name: Build frontend
        run: |
          cd apps/web
          pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            apps/web/dist/
          retention-days: 7

  # ============================================================================
  # SECURITY SCAN
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high || echo "⚠️ Security vulnerabilities found - review required"

      # trufflehog is pinned to an immutable commit SHA, not @main: a mutable ref
      # means this job runs whatever is on that branch at run time, and this
      # particular action is handed the whole repo specifically to find secrets in
      # it — the worst thing to leave floating. Bump the SHA deliberately.
      # On a PR, scan the diff. On a push to main, scan the WHOLE repo: this repo
      # pushes directly to main (14 commits landed that way on 2026-09-25), so the
      # PR-only form meant trufflehog had never once scanned main. A secret
      # committed straight to main was never looked at.
      - name: Check for secrets (PR diff)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Check for secrets (full repo, push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          extra_args: --only-verified

  # ============================================================================
  # CODE QUALITY METRICS (using unified audit CLI)
  # ============================================================================
  code-quality:
    name: Code Quality Metrics
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run unified audit
        run: pnpm audit all
        continue-on-error: true

  # ============================================================================
  # STRICT QUALITY GATES (blocking - fails build if thresholds exceeded)
  # ============================================================================
  quality-gates:
    name: Quality Gates (Blocking)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run CI Quality Gates
        run: pnpm ci:quality-gates
        continue-on-error: true

  # ============================================================================
  # VALIDATION (using unified validate CLI)
  # ============================================================================
  validation:
    name: Validation Checks
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Validate voices
        run: pnpm validate voices
        continue-on-error: true

      - name: Validate integrations
        run: pnpm validate integrations
        continue-on-error: true

  # ============================================================================
  # E2E VALIDATION - Validate all user actions (tools, commands, API)
  # ============================================================================
  e2e-validation:
    name: E2E Validation
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI and backend
        run: pnpm build:fast
        continue-on-error: true

      - name: Run E2E validation
        run: node dist/apps/cli/src/index.js validate e2e --ci --report json > e2e-report.json || true
        continue-on-error: true

      - name: Check E2E coverage threshold
        run: |
          if [ -f e2e-report.json ]; then
            COVERAGE=$(cat e2e-report.json | grep -o '"coverage":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "0")
            CI_PASSED=$(cat e2e-report.json | grep -o '"ciPassed":[a-z]*' | head -1 | grep -o '[a-z]*' || echo "false")
            echo "E2E Coverage: ${COVERAGE}%"
            echo "CI Passed: ${CI_PASSED}"
            if [ "$CI_PASSED" = "false" ]; then
              echo "❌ E2E coverage ${COVERAGE}% is below 80% threshold"
              # Don't fail build for now, just warn
              # exit 1
            else
              echo "✅ E2E coverage ${COVERAGE}% meets 80% threshold"
            fi
          else
            echo "⚠️ E2E report not generated - skipping threshold check"
          fi

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-validation-report
          path: e2e-report.json
          retention-days: 30

  # ============================================================================
  # FRONTEND QUALITY
  # ============================================================================
  frontend-quality:
    name: Frontend Quality
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build design-system
        run: pnpm build:design-system

      - name: TypeScript type check
        run: |
          cd apps/web
          pnpm typecheck

      - name: ESLint check
        run: |
          cd apps/web
          pnpm lint
        continue-on-error: true

      - name: Design token validation
        run: |
          cd apps/web
          pnpm lint:tokens
        continue-on-error: true

      - name: UI audit
        run: |
          cd apps/web
          pnpm audit:ui || true
        continue-on-error: true

      - name: Build and check bundle size
        run: |
          cd apps/web
          pnpm build:check || true
        continue-on-error: true

  # ============================================================================
  # DEPENDENCY CHECK
  # ============================================================================
  dependencies:
    name: Dependency Check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Check for outdated dependencies
        run: pnpm outdated || true

      - name: Check for duplicate dependencies
        run: pnpm dlx depcheck --ignores="@types/*" || true
