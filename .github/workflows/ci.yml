      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: false

      # The cache is saved by the setup job of the same run. "Re-run failed jobs"
      # and cache eviction (10 GB repo limit) both leave it missing; install
      # instead of failing a job that has nothing wrong with it.
      - name: Install dependencies (node_modules cache miss)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --no-frozen-lockfile

      # Blocking. Both ran with continue-on-error, so the job was green whatever
      # they did; main passes both (93 and 6 tests, 2026-10-18).
      - name: Run AGI Feature Unit Tests
        run: pnpm test:agi-features -- --reporter=verbose
