name: Clean Up Staging Previews

# Preview services are public Cloud Run copies of the UI server. Delete a PR's
# preview when the PR closes, and sweep any preview older than 3 days.
# This lived in staging.yml, whose pull_request trigger never includes
# `closed`, so it never ran: 539 previews had piled up by 2026-10-09.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1

concurrency:
  group: staging-cleanup-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean up staging previews
    # GitHub-hosted on purpose: this job holds GCP_SA_KEY, and the self-hosted CI
    # runner runs PR code with docker (root) access. See ci.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Delete this PR's preview
        if: github.event_name == 'pull_request'
        env:
          SERVICE_NAME: staging-pr-${{ github.event.pull_request.number }}
        run: |
          gcloud run services delete "$SERVICE_NAME" --region="$GCP_REGION" --quiet \
            && echo "Deleted $SERVICE_NAME" || echo "$SERVICE_NAME not found"

      - name: Delete previews older than 3 days
        if: github.event_name != 'pull_request'
        run: |
          CUTOFF=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gcloud run services list --region="$GCP_REGION" \
            --filter="metadata.name~^staging- AND metadata.creationTimestamp<$CUTOFF" \
            --format='value(metadata.name)' > old.txt
          echo "Deleting $(wc -l < old.txt) preview(s) created before $CUTOFF"
          xargs -r -P 8 -I{} gcloud run services delete {} --region="$GCP_REGION" --quiet --async < old.txt
