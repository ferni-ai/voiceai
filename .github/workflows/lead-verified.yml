name: Lead Verified

# REPORT-ONLY: was the exact code this PR merges independently verified? Rules:
# scripts/ci/lead-verified.ts; docs: docs/ci/ci-inventory.md. Always succeeds; the
# enforcement switch below (and making the check required) needs Seth's OK.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  group: lead-verified-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  lead-verified:
    name: Lead Verified (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Evaluator from the BASE (main in the queue), never the PR: a PR can't rewrite
      # its own judge. The head is fetched as data; full history for git merge-tree.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          fetch-depth: 0
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Evaluate verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }} # gh-readonly-queue/main/pr-<N>-<sha>
          # ENFORCEMENT SWITCH (needs Seth's OK): uncomment to fail on NOT_VERIFIED.
          # LEAD_VERIFIED_ENFORCE: '1'
        run: |
          [ -f scripts/ci/lead-verified.ts ] || { echo "::notice::evaluator not on the base yet"; exit 0; }
          node --experimental-strip-types scripts/ci/lead-verified.ts
