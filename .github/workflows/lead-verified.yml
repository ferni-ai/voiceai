name: Lead Verified

# REPORT-ONLY: was the exact code this PR merges independently verified? Rules:
# scripts/ci/lead-verified.ts; docs: docs/ci/ci-inventory.md. Always succeeds; the
# enforcement switch below (and making the check required) needs Seth's OK.
# Re-runs when the evidence changes (comments, PR edits). issue_comment runs report in
# the Actions log; they don't update the PR's check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:

concurrency:
  group: lead-verified-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  lead-verified:
    name: Lead Verified (report-only)
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The evaluator script is checked out from main (also for stacked PRs), not the PR.
      # This workflow file itself still runs from the PR's merge or queue commit, so a PR
      # can edit it until branch rules require code-owner review (#2547) or it moves to a
      # main-pinned trigger. The head is fetched as data only; full history for merge-tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Evaluate verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }} # gh-readonly-queue/main/pr-<N>-<sha>
          # ENFORCEMENT SWITCH (needs Seth's OK): uncomment to fail on NOT_VERIFIED.
          # LEAD_VERIFIED_ENFORCE: '1'
        run: |
          [ -f scripts/ci/lead-verified.ts ] || { echo "::notice::evaluator not on main yet"; exit 0; }
          node --experimental-strip-types scripts/ci/lead-verified.ts
