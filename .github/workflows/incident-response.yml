name: Incident Response

# Automated incident response playbook
# Triggers on manual dispatch or from other workflows

on:
  workflow_dispatch:
    inputs:
      incident_type:
        description: 'Type of incident'
        required: true
        type: choice
        options:
          - outage
          - high_errors
          - security
          - performance
      service:
        description: 'Affected service'
        required: true
        type: choice
        options:
          - voice-agent
          - ui-server
          - app
          - landing
          - all
      severity:
        description: 'Severity level'
        required: true
        type: choice
        options:
          - critical
          - high
          - medium
          - low

env:
  GCP_REGION: us-central1

jobs:
  triage:
    name: Incident Triage
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.triage.outputs.action }}

    steps:
      - name: Log incident
        run: |
          echo "🚨 INCIDENT OPENED"
          echo "Type: ${{ inputs.incident_type }}"
          echo "Service: ${{ inputs.service }}"
          echo "Severity: ${{ inputs.severity }}"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Determine response action
        id: triage
        run: |
          TYPE="${{ inputs.incident_type }}"
          SEVERITY="${{ inputs.severity }}"

          case "$TYPE" in
            outage)
              echo "action=restart" >> $GITHUB_OUTPUT
              ;;
            high_errors)
              echo "action=rollback" >> $GITHUB_OUTPUT
              ;;
            security)
              echo "action=isolate" >> $GITHUB_OUTPUT
              ;;
            performance)
              echo "action=scale" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Create incident channel notification
        run: |
          SEVERITY="${{ inputs.severity }}"
          if [ "$SEVERITY" == "critical" ]; then
            EMOJI="🔴"
          elif [ "$SEVERITY" == "high" ]; then
            EMOJI="🟠"
          else
            EMOJI="🟡"
          fi

          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"$EMOJI *INCIDENT: ${{ inputs.incident_type }}*\n\nService: \`${{ inputs.service }}\`\nSeverity: ${{ inputs.severity }}\nRunbook: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Response>\n\n@oncall please acknowledge\"
            }"

  respond:
    name: Execute Response
    needs: triage
    runs-on: ubuntu-latest
    # Its own group (shared with rollback.yml), not deploy-production's: GitHub
    # keeps one pending run per group, so a later deploy would replace (cancel)
    # a pending rollback. A rollback freezes deploys instead.
    concurrency:
      group: prod-rollback
      cancel-in-progress: false
    permissions:
      contents: write  # the deploy-freeze tag

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ======================================================================
      # VOICE AGENT (LiveKit Cloud): manual runbook, no automatic action
      # ======================================================================
      # The voice agent runs on LiveKit Cloud (prod agent CA_GeFvEpsNXLSF in
      # project ferni-prod). The old GCE VM voiceai-agent-gce no longer runs.
      # This workflow never restarts or rolls it back: a restart cuts live
      # callers off, so a person checks rooms=0 first. The gated chain lives in
      # .claude/skills/deploy-agent/SKILL.md.
      - name: "Voice agent: runbook (LiveKit Cloud)"
        if: inputs.service == 'voice-agent' || inputs.service == 'all'
        env:
          ACTION: ${{ needs.triage.outputs.action }}
        run: |
          {
            echo "## Voice agent runbook (LiveKit Cloud, action: $ACTION)"
            echo ""
            echo "No automatic action was taken on the voice agent. Run these from a clean"
            echo "checkout of origin/main. Full gated chain: .claude/skills/deploy-agent/SKILL.md"
            echo ""
            echo '```bash'
            echo 'P=ferni-prod; C="$(git rev-parse --show-toplevel)/livekit.prod-cloud.toml"   # absolute path'
            echo 'lk agent status   --project $P --config "$C"'
            echo 'lk agent versions --project $P --config "$C"'
            echo 'lk agent logs     --project $P --config "$C"'
            echo ''
            echo '# Rule: rooms must be 0 before ANY restart or rollback (it cuts live callers off).'
            echo '# This fails closed if lk cannot reach the project.'
            echo 'ROOMS=$(lk room list --project $P 2>&1) \'
            echo '  && echo "$ROOMS" | grep -q "Using project \[$P\]" \'
            echo '  && [ "$(echo "$ROOMS" | grep -c "│ RM_")" = 0 ] && echo rooms=0'
            echo ''
            case "$ACTION" in
              restart)
                echo '# outage: restart (only after rooms=0)'
                echo 'lk agent restart --project $P --config "$C"' ;;
              rollback|isolate)
                echo '# high errors / security: roll back to the last good version (only after rooms=0)'
                echo 'lk agent rollback --project $P --config "$C" --version <id from lk agent versions>' ;;
              scale)
                echo '# performance: LiveKit Cloud scales workers itself; check status and logs first.' ;;
            esac
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # RESTART ACTION
      # ======================================================================
      - name: "Action: Restart service"
        if: needs.triage.outputs.action == 'restart'
        run: |
          SERVICE="${{ inputs.service }}"
          echo "🔄 Restarting $SERVICE..."

          if [ "$SERVICE" == "ui-server" ] || [ "$SERVICE" == "all" ]; then
            gcloud run services update john-bogle-ui \
              --region=${{ env.GCP_REGION }} \
              --update-env-vars="RESTART_TIMESTAMP=$(date +%s)" \
              --project=${{ secrets.GCP_PROJECT_ID }} || echo "UI server restart failed"
          fi

          echo "✅ Restart command issued"

      # ======================================================================
      # ROLLBACK ACTION
      # ======================================================================
      # Freeze automatic deploys BEFORE moving traffic. Main's tip is still the
      # commit being rolled back, and the next automatic deploy would put it
      # straight back (scripts/ci/deploy-freeze.sh). A deploy already running
      # re-checks the freeze right before its own traffic shift and stops; the
      # pause lets one that passed that check a moment ago land first, so this
      # rollback has the last word. Unfreeze deliberately afterwards
      # (deploy-production with unfreeze: true and a reason).
      - name: Freeze automatic deploys
        if: needs.triage.outputs.action == 'rollback' && (inputs.service == 'ui-server' || inputs.service == 'all')
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT: ${{ inputs.incident_type }}
          SEVERITY: ${{ inputs.severity }}
        run: |
          # Never block a rollback on the freeze: if it can't be set, roll back anyway and say so loudly.
          bash scripts/ci/deploy-freeze.sh set "incident-response rollback by $GITHUB_ACTOR ($INCIDENT, $SEVERITY)" \
            || echo "::error::Could not set the deploy freeze; rolling back anyway. The next automatic deploy may undo this rollback: freeze by hand (git tag -a deploy-freeze -m '<reason>' && git push origin deploy-freeze)."
          sleep 30

      - name: "Action: Rollback to previous version"
        id: rollback
        if: needs.triage.outputs.action == 'rollback'
        run: |
          SERVICE="${{ inputs.service }}"
          echo "⏪ Rolling back $SERVICE..."

          if [ "$SERVICE" == "ui-server" ] || [ "$SERVICE" == "all" ]; then
            PREV_REV=$(gcloud run revisions list \
              --service=john-bogle-ui \
              --region=${{ env.GCP_REGION }} \
              --format="value(REVISION)" \
              --limit=2 \
              --project=${{ secrets.GCP_PROJECT_ID }} | tail -1)

            if [ -n "$PREV_REV" ]; then
              gcloud run services update-traffic john-bogle-ui \
                --region=${{ env.GCP_REGION }} \
                --to-revisions="$PREV_REV=100" \
                --project=${{ secrets.GCP_PROJECT_ID }}
              echo "✅ Rolled back ui-server to $PREV_REV"
              echo "revision=$PREV_REV" >> "$GITHUB_OUTPUT"
            fi
          fi

      # A deploy that passed its freeze re-check just before the freeze could
      # still shift traffic after this rollback. Look again and fail loudly.
      - name: Confirm traffic stayed on the rollback target
        if: needs.triage.outputs.action == 'rollback' && steps.rollback.outputs.revision != ''
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TARGET: ${{ steps.rollback.outputs.revision }}
        run: |
          sleep 15
          bash scripts/ci/confirm-rollback-traffic.sh "$TARGET"

      # ======================================================================
      # SCALE ACTION
      # ======================================================================
      - name: "Action: Scale up service"
        if: needs.triage.outputs.action == 'scale'
        run: |
          SERVICE="${{ inputs.service }}"
          echo "📈 Scaling up $SERVICE..."

          if [ "$SERVICE" == "ui-server" ] || [ "$SERVICE" == "all" ]; then
            gcloud run services update john-bogle-ui \
              --region=${{ env.GCP_REGION }} \
              --min-instances=2 \
              --max-instances=20 \
              --project=${{ secrets.GCP_PROJECT_ID }}
            echo "✅ Scaled ui-server: min=2, max=20"
          fi

      # ======================================================================
      # ISOLATE ACTION (Security)
      # ======================================================================
      - name: "Action: Isolate service (security)"
        if: needs.triage.outputs.action == 'isolate'
        run: |
          SERVICE="${{ inputs.service }}"
          echo "🔒 Isolating $SERVICE for security review..."

          if [ "$SERVICE" == "ui-server" ] || [ "$SERVICE" == "all" ]; then
            gcloud run services update john-bogle-ui \
              --region=${{ env.GCP_REGION }} \
              --max-instances=0 \
              --project=${{ secrets.GCP_PROJECT_ID }} || true
            echo "⚠️ UI server isolated (max-instances=0)"
          fi

          echo ""
          echo "🔴 SERVICES ISOLATED - Manual review required before restoring"

  verify:
    name: Verify Resolution
    needs: [triage, respond]
    runs-on: ubuntu-latest

    steps:
      - name: Wait for changes to propagate
        run: sleep 30

      - name: Health check
        id: health
        run: |
          SERVICE="${{ inputs.service }}"
          ALL_HEALTHY=true

          check_service() {
            URL=$1
            NAME=$2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "✅ $NAME: UP"
            else
              echo "❌ $NAME: DOWN ($STATUS)"
              ALL_HEALTHY=false
            fi
          }

          if [ "$SERVICE" == "voice-agent" ] || [ "$SERVICE" == "all" ]; then
            # LiveKit Cloud has no public health URL; this workflow took no action
            # on the agent, so a person confirms it with `lk agent status`.
            echo "❔ Voice Agent (LiveKit Cloud): not checked here; run lk agent status (see runbook)"
            ALL_HEALTHY=false
          fi

          if [ "$SERVICE" == "ui-server" ] || [ "$SERVICE" == "all" ]; then
            check_service "https://john-bogle-ui-1031920444452.us-central1.run.app/health" "UI Server"
          fi

          if [ "$SERVICE" == "app" ] || [ "$SERVICE" == "all" ]; then
            check_service "https://app.ferni.ai" "App"
          fi

          if [ "$SERVICE" == "landing" ] || [ "$SERVICE" == "all" ]; then
            check_service "https://ferni.ai" "Landing"
          fi

          echo "healthy=$ALL_HEALTHY" >> $GITHUB_OUTPUT

      - name: Report resolution
        run: |
          HEALTHY="${{ steps.health.outputs.healthy }}"
          ACTION="${{ needs.triage.outputs.action }}"

          if [ "$HEALTHY" == "true" ]; then
            STATUS="✅ RESOLVED"
            COLOR="good"
          else
            STATUS="⚠️ NEEDS ATTENTION"
            COLOR="warning"
          fi

          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"$STATUS\n\nIncident: ${{ inputs.incident_type }}\nAction taken: $ACTION\nService: ${{ inputs.service }}\n\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>\"
            }"

      - name: Summary
        run: |
          echo "## 🚨 Incident Response Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ inputs.incident_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ inputs.service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | ${{ inputs.severity }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.triage.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.health.outputs.healthy == 'true' && '✅ Resolved' || '⚠️ Needs attention' }} |" >> $GITHUB_STEP_SUMMARY
