# Dependabot Configuration
# Automatically creates PRs for dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Backend (root package.json). This is the pnpm workspace: Dependabot reads
  # pnpm-lock.yaml and updates every workspace package from here. Never add a
  # package-lock.json at the root or in a workspace package: Dependabot then
  # switches to npm, which can't resolve "workspace:*" (every security update
  # failed this way until 2026-10-03).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Group minor/patch updates together
      minor-and-patch:
        patterns:
          - "*"
        # knip gates CI (Quality Gates, dead-code step): its updates come alone, so a
        # change in what it reports is reviewed on its own, not inside a 30-package bump.
        exclude-patterns:
          - "knip"
        update-types:
          - "minor"
          - "patch"
      # Majors: packages that must move together share a PR; every other major
      # comes alone. One group for all majors (#3415: 16 majors, 13 failing
      # checks) gave no way to tell which bump broke what. open-pull-requests-limit
      # above still caps how many are open at once.
      # eslint 9+ needs flat config, and typescript-eslint must match the eslint major.
      lint-majors:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
        update-types:
          - "major"
      # firebase-admin pins its own @google-cloud/firestore; bumping one alone
      # leaves two Firestore clients in the tree.
      firebase-admin-majors:
        patterns:
          - "firebase-admin"
          - "@google-cloud/*"
        update-types:
          - "major"
    ignore:
      # @types/node follows the runtime major in .nvmrc (22). A newer major types
      # APIs production doesn't have; bump it in the PR that moves the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Ignore major version updates for critical packages (review manually)
      - dependency-name: "@livekit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 14.18.0 drops the word after "in" ("practice in spanish" -> "practice in"),
      # breaking coach-media topic queries (topic-query.test.ts, #2217). Lift this
      # with a PR that adapts topicOnlyQuery to the new version.
      - dependency-name: "compromise"
        versions: [">=14.18.0"]
      # The agent loads one libonnxruntime.so.1: Silero VAD's copy is pinned to 1.30.0
      # (pnpm-workspace.yaml), so a root bump alone splits it and the speaker model
      # falls back to DSP (#3413, #301). Lift this with a PR that moves the root,
      # Silero and transformers copies together (onnxruntime-single-version.test.ts).
      - dependency-name: "onnxruntime-node"
        versions: [">=1.31.0"]
      - dependency-name: "onnxruntime-web"
        versions: [">=1.31.0"]

  # Frontend (apps/web): covered by the root entry above. apps/web is a pnpm
  # workspace package; its old npm package-lock.json is gone, and
  # the UI image now installs it from pnpm-lock.yaml like everything else.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    # One PR a month for every action bump, majors included.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
