# Dependabot Configuration
# Automatically creates PRs for dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Backend (root package.json). This is the pnpm workspace: Dependabot reads
  # pnpm-lock.yaml and updates every workspace package from here. Never add a
  # package-lock.json at the root or in a workspace package: Dependabot then
  # switches to npm, which can't resolve "workspace:*" (every security update
  # failed this way until 2026-10-03).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Group minor/patch updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for critical packages (review manually)
      - dependency-name: "@livekit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Frontend (apps/web): covered by the root entry above. apps/web is a pnpm
  # workspace package; its old npm package-lock.json is gone, and
  # the UI image now installs it from pnpm-lock.yaml like everything else.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
