name: 'Install pinned gitleaks'
description: >
  Installs gitleaks at one pinned version and SHA-256 and puts it on PATH. On
  2026-11-08 the release download page returned 504 for over 30 minutes, which
  failed the Security Scan in most merge groups and ejected green PRs from the
  queue. So the tarball comes from, in order: the actions cache, the release
  download URL, then the API asset endpoint (a different path to the same file).
  Each source retries with exponential backoff. Whatever the source, the SHA-256
  check runs before anything is extracted, so no path can install a different file.

inputs:
  github-token:
    description: Token for the API asset fallback (raises the unauthenticated rate limit).
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Restore the gitleaks tarball
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/gitleaks-cache
        # Version and checksum both in the key: a bump can never reuse an old tarball.
        key: gitleaks-8.30.1-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb-linux-x64

    - name: Download, verify and install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # The release asset id for gitleaks_8.30.1_linux_x64.tar.gz. Update it with
        # the version: GET /repos/gitleaks/gitleaks/releases/tags/v<version>.
        GITLEAKS_ASSET_ID: '378332058'
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/gitleaks-cache"
        tarball="$dir/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        mkdir -p "$dir"

        # No fixed --retry-delay: curl then backs off exponentially. Each source
        # gets up to 150 s, so both together stay within about 5 minutes.
        fetch() {
          curl -sSfL --retry 8 --retry-all-errors --retry-max-time 150 --connect-timeout 20 "$@"
        }

        if [ "$CACHE_HIT" = "true" ] && [ -s "$tarball" ]; then
          echo "gitleaks tarball: restored from the actions cache"
        elif fetch -o "$tarball" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; then
          echo "gitleaks tarball: downloaded from the release URL"
        else
          echo "::warning::gitleaks release URL failed after retries; trying the API asset endpoint"
          # curl does not forward this Authorization header to the redirect host.
          auth=()
          if [ -n "${GH_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $GH_TOKEN"); fi
          fetch ${auth[@]+"${auth[@]}"} -H 'Accept: application/octet-stream' \
            -o "$tarball" "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_ASSET_ID}"
          echo "gitleaks tarball: downloaded from the API asset endpoint"
        fi

        echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -

        bin="$RUNNER_TEMP/gitleaks-bin"
        mkdir -p "$bin"
        tar xzf "$tarball" -C "$bin" gitleaks
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/gitleaks" version
