name: 'Did the merge queue already test this tree?'
description: >
  On a push to main, sets `tested` to 'true' only when a SUCCESSFUL merge-queue run
  of the CI workflow tested a commit with exactly this commit's tree. A queue merge
  lands that tree on main (sometimes as a new commit SHA), so running the suite
  again proves nothing new. Anything else is 'false', and everything runs: any
  other event or branch, an admin merge or direct push (no queue run for this
  tree), a failed or cancelled run, or any API error. On 2026-10-11, admin merges
  that skipped the queue left main red, so that path must always get full CI.
  A run counts only if its Node suite (Lint & Type Check, Unit Tests, Frontend
  Quality) actually ran and passed: a scoped queue run that skipped those jobs
  succeeded without testing the tree (2026-10-19, #2027 merged that way).

outputs:
  tested:
    description: "'true' or 'false'"
    value: ${{ steps.check.outputs.tested }}
  run-id:
    description: 'The matching merge-queue run, when tested is true'
    value: ${{ steps.check.outputs.run_id }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        SERVER: ${{ github.server_url }}
      run: |
        full() { echo "tested=false" >> "$GITHUB_OUTPUT"; echo "Full suite: $1"; exit 0; }
        [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] || full "$EVENT on $REF is not a push to main"
        tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) && [ -n "$tree" ] \
          || full "could not read the tree of $SHA"
        # The newest successful queue runs; a queue merge's run is among the latest.
        runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&status=success&per_page=30" \
          --jq '.workflow_runs[] | select(.conclusion == "success") | "\(.id) \(.head_sha)"') \
          || full "could not list merge-queue runs"
        # 'true' when the run's Node suite ran and passed (skipped counts as not run).
        suite_ran() {
          gh api "repos/$REPO/actions/runs/$1/jobs?per_page=100" --jq '[.jobs[]
            | select(.name == "Lint & Type Check" or .name == "Unit Tests" or .name == "Frontend Quality")
            | .conclusion] | length == 3 and all(. == "success")' 2>/dev/null
        }
        while read -r id head; do
          [ -n "$id" ] || continue
          if [ "$head" != "$SHA" ]; then
            t=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha 2>/dev/null) || continue
            [ "$t" = "$tree" ] || continue
          fi
          if [ "$(suite_ran "$id")" = true ]; then match=$id; break; fi
          echo "Merge-queue run $id has this tree but did not run the Node suite; not trusted"
        done <<< "$runs"
        [ -n "${match:-}" ] || full "no successful merge-queue run ran the Node suite on tree $tree (admin merge, direct push, or a scoped queue run?)"
        echo "tested=true" >> "$GITHUB_OUTPUT"
        echo "run_id=$match" >> "$GITHUB_OUTPUT"
        echo "::notice::Skipping the full suite: merge-queue run $SERVER/$REPO/actions/runs/$match passed on tree $tree, which is this commit's tree"
