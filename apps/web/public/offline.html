<!DOCTYPE html>
<html lang="en" data-theme="zen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Ferni</title>
    <!-- The design-system page background (zen and midnight background.primary), so the status bar matches the page -->
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        --color-bg-primary: #faf8f5;
        --color-text-primary: #2c2520;
        --color-text-secondary: #5c544a;
        --color-accent: #4a6741;
        --color-on-accent: #ffffff;
        --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-body: 'Inter', system-ui, sans-serif;
      }

      /* Midnight theme tokens (design-system/tokens/colors.json) */
      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg-primary: #14110e;
          --color-text-primary: #f4efe6;
          --color-text-secondary: #cfc3b4;
          --color-accent: #8eae7a;
          --color-on-accent: #14110e;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-body);
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }

      .offline-container {
        max-width: 400px;
      }

      .offline-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 1.5rem;
      }

      .offline-title {
        font-family: var(--font-display);
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: var(--color-text-primary);
      }

      .offline-message {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--color-text-secondary);
        margin-bottom: 2rem;
      }

      .offline-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 1.5rem;
        background: var(--color-accent);
        color: var(--color-on-accent);
        border: none;
        border-radius: 999px;
        font-family: var(--font-body);
        font-size: 0.9375rem;
        font-weight: 500;
        min-height: 48px;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .offline-btn:hover {
        transform: translateY(-1px);
        opacity: 0.9;
      }

      .offline-btn:active {
        transform: translateY(0);
      }

      .offline-tip {
        margin-top: 2rem;
        font-size: 0.875rem;
        color: var(--color-text-secondary);
      }

      /* Ferni breathes slowly while he waits */
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }

      .offline-icon {
        animation: breathe 4s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .offline-icon {
          animation: none;
        }
      }

      /* Online indicator */
      .online-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: var(--color-accent);
        color: var(--color-on-accent);
        padding: 0.75rem;
        text-align: center;
        font-size: 0.875rem;
        transform: translateY(-100%);
        transition: transform 0.3s ease;
      }

      .online-banner.show {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="online-banner" id="onlineBanner">
      You're back online. Reloading now.
    </div>

    <div class="offline-container">
      <!-- Ferni, eyes resting while the connection is away -->
      <svg class="offline-icon" viewBox="0 0 80 80" role="img" aria-label="Ferni">
        <circle cx="40" cy="40" r="38" fill="#4a6741" />
        <ellipse cx="29" cy="38" rx="6.5" ry="4" fill="#ffffff" />
        <ellipse cx="51" cy="38" rx="6.5" ry="4" fill="#ffffff" />
      </svg>

      <h1 class="offline-title">You're offline</h1>
      
      <p class="offline-message">
        It looks like your internet connection dropped.
        I'll be right here when you're back online.
      </p>

      <button class="offline-btn" onclick="window.location.reload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6" />
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
          <path d="M3 22v-6h6" />
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
        </svg>
        Try Again
      </button>

      <p class="offline-tip">
        Some features are available offline once you've visited them.
      </p>
    </div>

    <script>
      // Listen for online status
      window.addEventListener('online', function() {
        document.getElementById('onlineBanner').classList.add('show');
        setTimeout(function() {
          window.location.reload();
        }, 1500);
      });

      // Auto-retry every 10 seconds
      let retryCount = 0;
      const maxRetries = 3;

      function checkConnection() {
        if (navigator.onLine && retryCount < maxRetries) {
          retryCount++;
          fetch('/', { method: 'HEAD', cache: 'no-store' })
            .then(function() {
              window.location.reload();
            })
            .catch(function() {
              // Still offline
            });
        }
      }

      setInterval(checkConnection, 10000);
    </script>
  </body>
</html>
