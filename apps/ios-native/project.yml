# Ferni for iPhone and iPad. Generate the Xcode project with `xcodegen generate`
# (the generated Ferni.xcodeproj is committed so CI and Xcode need no extra tool).
#
# The app target is a thin SwiftUI shell; the work lives in local packages:
#   Packages/FerniKit    configuration, the account, the server API, team, plans
#   Packages/FerniVoice  a call with Ferni: the session, the LiveKit room, agent signals
#   Packages/FerniDesign color/type/spacing tokens and the window avatar
name: Ferni
options:
  bundleIdPrefix: com.sethdford
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.1"
  generateEmptyDirectories: false

packages:
  FerniKit:
    path: Packages/FerniKit
  FerniVoice:
    path: Packages/FerniVoice
  FerniDesign:
    path: Packages/FerniDesign
  FerniLink:
    path: Packages/FerniLink
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.30.0

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: "XT8W26YE9U"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Ferni:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Ferni.xcconfig
      Release: Config/Ferni.xcconfig
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: FerniKit
      - package: FerniVoice
      - package: FerniDesign
      - package: Sentry
      - package: FerniLink
      - target: FerniLive
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ferni
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FerniAPIBaseURL: $(FERNI_API_BASE_URL)
        # The web app's locales (App/Localizable.xcstrings, scripts/build-string-catalog.py).
        CFBundleLocalizations: [en, en-GB, ar, de, es, fr, he, ja, ko, zh-Hans, zh-Hant]
        # Crash reporting: empty (off) unless Config/Sentry.local.xcconfig sets it.
        SentryDSN: $(SENTRY_DSN)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # ProMotion: the avatar asks for 120 Hz only while Ferni speaks.
        CADisableMinimumFrameDurationOnPhone: true
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # One window: a call is one session, and a second iPad window would share it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Calls keep talking with the screen locked, reported to the system through
        # LiveCommunicationKit (a VoIP call app). Nothing else runs in the background.
        UIBackgroundModes:
          - audio
          - voip
        NSFaceIDUsageDescription: Ferni uses Face ID to keep what Ferni remembers just for you.
        NSMicrophoneUsageDescription: Ferni listens only while you're talking together, so you can talk out loud.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Ferni.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Notes from Ferni (APNs) wait for the server route (#1991, critic C3).
        # To ship them: add `aps-environment: development` here and FERNI_PUSH to
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS below, in one commit.
    settings:
      base:
        PRODUCT_NAME: Ferni
        PRODUCT_BUNDLE_IDENTIFIER: com.sethdford.ferni
        TARGETED_DEVICE_FAMILY: "1,2"
        FERNI_API_BASE_URL: "https://app.ferni.ai"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES

  # App-level logic (AppModel), hosted in the app.
  FerniAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Ferni
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sethdford.ferni.apptests
        GENERATE_INFOPLIST_FILE: YES

  # The call on the Lock Screen and in the Dynamic Island.
  FerniLive:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: FerniDesign
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Ferni
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sethdford.ferni.live
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Ferni:
    build:
      targets:
        Ferni: all
    run:
      config: Debug
      storeKitConfiguration: Ferni.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FerniAppTests
        - package: FerniKit/FerniKitTests
        - package: FerniVoice/FerniVoiceTests
        - package: FerniDesign/FerniDesignTests
        - package: FerniLink/FerniLinkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
