# Ferni for iPhone and iPad. Generate the Xcode project with `xcodegen generate`
# (the generated Ferni.xcodeproj is committed so CI and Xcode need no extra tool).
#
# The app target is a thin SwiftUI shell; the work lives in local packages:
#   Packages/FerniKit    configuration, the account, the server API, team, plans
#   Packages/FerniVoice  a call with Ferni (agent signals; next: the LiveKit session)
#   Packages/FerniDesign color/type/spacing tokens and the window avatar
name: Ferni
options:
  bundleIdPrefix: com.sethdford
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.1"
  generateEmptyDirectories: false

packages:
  FerniKit:
    path: Packages/FerniKit
  FerniVoice:
    path: Packages/FerniVoice
  FerniDesign:
    path: Packages/FerniDesign

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: "XT8W26YE9U"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Ferni:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: FerniKit
      - package: FerniVoice
      - package: FerniDesign
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ferni
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FerniAPIBaseURL: $(FERNI_API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # One window: a call is one session, and a second iPad window would share it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Calls keep talking with the screen locked. Nothing else runs in the background.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Ferni needs the microphone so you can talk out loud with Ferni and your team.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Ferni.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_NAME: Ferni
        PRODUCT_BUNDLE_IDENTIFIER: com.sethdford.ferni
        TARGETED_DEVICE_FAMILY: "1,2"
        FERNI_API_BASE_URL: "https://app.ferni.ai"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES

schemes:
  Ferni:
    build:
      targets:
        Ferni: all
    run:
      config: Debug
      storeKitConfiguration: Ferni.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: FerniKit/FerniKitTests
        - package: FerniVoice/FerniVoiceTests
        - package: FerniDesign/FerniDesignTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
